<style>

<script>
(function () {
  function _revelar() {
    var g = document.getElementById('gomSaldoGate');
    if (g) g.remove();
  }
  function _negar() {
    _revelar();
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">'
      + '<div style="max-width:420px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.15);padding:36px 28px;">'
      + '<i class="bi bi-shield-lock" style="font-size:2.6rem;color:#dc2626;"></i>'
      + '<h4 style="font-weight:900;color:#002b5e;margin:14px 0 6px;">Acesso restrito</h4>'
      + '<p style="color:#64748b;margin:0 0 18px;">Seu perfil não tem acesso à tela <strong>Saldo</strong>.</p>'
      + '<a class="btn btn-primary fw-bold" href="index.html"><i class="bi bi-arrow-left me-1"></i>Voltar ao sistema</a>'
      + '</div></div>';
  }
  if (window.AcessoSME && window.AcessoSME.pronto) {
    window.AcessoSME.pronto
      .then(function () { window.AcessoSME.can('saldo', 'ver') ? _revelar() : _negar(); })
      .catch(function () { _negar(); });
  } else {
    // Central não carregou: não expõe a tela.
    _negar();
  }
})();
</script>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyhupkxHQNtNIVE2uVcVtLJX1xP1vU69_2qJoYGBCsnQqjq3SN7p1M1xZnObmM-ReoNLw/exec';

let todosOsDados  = [];
let medicoesSerie = [];
let contratoInfo  = null;
let chartProjecao = null;
let _modalItens   = [];
let _voltarModal  = null;

const R$ = v => v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const pct = (p, t) => t > 0 ? Math.round((p / t) * 100) : 0;

function resolverStatus(r) {
  if (r.status) return r.status;
  if (r.valor_pago > 0 && r.valor_aberto > 0)  return 'EM ANDAMENTO';
  if (r.valor_pago === 0 && r.valor_aberto > 0) return 'PENDENTE';
  if (r.valor_pago > 0 && r.valor_aberto <= 0)  return 'CONCLUÍDA';
  return 'PENDENTE';
}

function statusClass(s) {
  const n = (s || '').toUpperCase();
  if (n.includes('CONCLU'))                               return 'c';
  if (n.includes('ANDAMENTO') || n.includes('PROGRESSO')) return 'a';
  return 'p';
}

function statusBadge(s) {
  const mapping = { 'c': 'success', 'a': 'warning', 'p': 'danger' };
  const text = s || 'PENDENTE';
  return `<span class="badge bg-${mapping[statusClass(s)] || 'secondary'}">${text}</span>`;
}

function miniBar(pago, total) {
  const p = pct(pago, total);
  return `<div class="progress" style="height: 6px;">
    <div class="progress-bar" style="width: ${p}%; background: linear-gradient(135deg, var(--primary), var(--neon-blue));"></div>
  </div><small class="text-muted">${p}%</small>`;
}

function highlight(txt, termo) {
  if (!termo) return txt || '–';
  const re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return (txt || '–').replace(re, '<mark style="background: rgba(0, 229, 255, 0.3); border-radius: 2px; padding: 0 2px;">$1</mark>');
}

function agrupar(dados) {
  const map = {};
  dados.forEach(r => {
    if (!map[r.unidade]) map[r.unidade] = { unidade: r.unidade, tipo: r.tipo, os: [] };
    map[r.unidade].os.push(r);
  });
  return Object.values(map).map(g => {
    const os    = g.os;
    const tot   = os.reduce((s,r) => s + r.valor_os,    0);
    const pago  = os.reduce((s,r) => s + r.valor_pago,  0);
    const aberto= os.reduce((s,r) => s + r.valor_aberto,0);
    const conc  = os.filter(r => statusClass(resolverStatus(r)) === 'c').length;
    const and   = os.filter(r => statusClass(resolverStatus(r)) === 'a').length;
    const pend  = os.filter(r => statusClass(resolverStatus(r)) === 'p').length;
    return { ...g, tot, pago, aberto, conc, and, pend };
  }).sort((a,b) => a.unidade.localeCompare(b.unidade));
}

function atualizarCards(dados, pfx) {
  const grupos  = agrupar(dados);
  const tot     = dados.reduce((s,r) => s + r.valor_os,    0);
  const emitido = dados.reduce((s,r) => s + (r.valor_emitido ?? r.valor_os), 0);
  const pago    = dados.reduce((s,r) => s + r.valor_pago,  0);
  const aberto  = dados.reduce((s,r) => s + r.valor_aberto,0);
  const conc    = dados.filter(r => statusClass(resolverStatus(r)) === 'c').length;
  const and     = dados.filter(r => statusClass(resolverStatus(r)) === 'a').length;
  const pend    = dados.filter(r => statusClass(resolverStatus(r)) === 'p').length;

  // Atualizar elementos apenas se existem
  const updateEl = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  updateEl(pfx+'total', dados.length);
  updateEl(pfx+'unidades', `${grupos.length} unidades`);
  updateEl(pfx+'valor', R$(emitido));
  updateEl(pfx+'pago', R$(pago));
  updateEl(pfx+'pct', `${pct(pago,tot)}% executado`);
  updateEl(pfx+'aberto', R$(aberto));
  updateEl(pfx+'conc', conc);
  updateEl(pfx+'and', and);
  updateEl(pfx+'pend', pend);

  if (pfx === 'c-' && contratoInfo) {
    const c = contratoInfo;
    const saldoNeg = c.saldo < 0;
    const saldoAbs = Math.abs(c.saldo);
    const medicoesNovas = c.medicoesNovas ?? Math.max(0, c.restantes - 1);
    const mediaRestante = medicoesNovas > 0 ? c.saldo / medicoesNovas : 0;

    // Atualizar apenas se os elementos existem
    const saldoEl = document.getElementById('c-saldo');
    const saldoSubEl = document.getElementById('c-saldo-sub');
    if (saldoEl) saldoEl.textContent = R$(saldoAbs);
    if (saldoSubEl) {
      saldoSubEl.textContent =
        saldoNeg
          ? `Estourou | Média: ${R$(Math.abs(mediaRestante))}`
          : `Média: ${R$(mediaRestante)} (${medicoesNovas} med.)`;
    }
  }
}

function fmtKM(v) {
  const n = Math.abs(v);
  const s = n >= 1000000 ? (v/1000000).toFixed(1) + 'M' : (v/1000).toFixed(0) + 'k';
  return 'R$' + s;
}

function atualizarProjecao() {
  const c = contratoInfo;
  if (!c) return;

  const esporte   = c.valorEsporte  || 0;
  const garantia  = c.valorGarantia || 0;
  const comprometido = c.totalComprometido != null ? c.totalComprometido : (c.totalEmitido + esporte + garantia);
  const compPct  = c.valorContrato > 0 ? Math.round(comprometido / c.valorContrato * 100) : 0;
  const emitPct  = c.valorContrato > 0 ? Math.round(c.totalEmitido / c.valorContrato * 100) : 0;
  const saldoNeg = c.saldo < 0;
  const saldoPos = Math.max(0, c.saldo);
  const proximaMedicao = c.proximaMedicao ?? (c.medicoesFeitas + 1);
  const valorProxima   = c.valorProxima  ?? todosOsDados.reduce((s,r) => s + r.valor_aberto, 0);
  const medicoesNovas  = c.medicoesNovas ?? Math.max(0, c.restantes - 1);
  const mediaRestante  = medicoesNovas > 0 ? c.saldo / medicoesNovas : 0;

  document.getElementById('contrato-resumo').innerHTML = `
    <div class="contrato-stat">
      <div class="contrato-stat-label">Teto do contrato</div>
      <div class="contrato-stat-value">${R$(c.valorContrato)}</div>
      <div class="contrato-stat-sub">${c.medicoesContrato} medições</div>
    </div>
    <div class="contrato-stat" style="cursor: pointer;" onclick="detalheCard('emitido')">
      <div class="contrato-stat-label">Emitido em O.S</div>
      <div class="contrato-stat-value">${R$(c.totalEmitido)}</div>
      <div class="contrato-stat-sub">${emitPct}% do teto</div>
    </div>
    <div class="contrato-stat">
      <div class="contrato-stat-label">Sec. Esporte</div>
      <div class="contrato-stat-value">${R$(esporte)}</div>
      <div class="contrato-stat-sub">descontado</div>
    </div>
    <div class="contrato-stat">
      <div class="contrato-stat-label">Garantia de obra</div>
      <div class="contrato-stat-value">${R$(garantia)}</div>
      <div class="contrato-stat-sub">descontado</div>
    </div>
    <div class="contrato-stat">
      <div class="contrato-stat-label">Total comprometido</div>
      <div class="contrato-stat-value">${R$(comprometido)}</div>
      <div class="contrato-stat-sub">${compPct}% do teto</div>
    </div>
    <div class="contrato-stat" style="cursor: pointer;" onclick="abrirGraficoProjecao()">
      <div class="contrato-stat-label">${saldoNeg ? 'Estourou o teto' : 'Saldo a Emitir'}</div>
      <div class="contrato-stat-value" style="color: ${saldoNeg ? '#ef4444' : '#22c55e'};">${R$(saldoPos)}</div>
      <div class="contrato-stat-sub" id="saldo-sub">Clique para projeção</div>
    </div>`;

  const N = c.medicoesContrato;
  const labels = Array.from({ length: N }, (_, i) => (i + 1) + 'ª');
  const realMap = {};
  medicoesSerie.forEach(m => { realMap[parseInt(m.label, 10)] = m.valor; });

  const realizado = labels.map((_, i) => (i <   c.medicoesFeitas ? (realMap[i + 1] ?? 0) : null));
  const proxima   = labels.map((_, i) => (i === c.medicoesFeitas ? valorProxima          : null));
  const projecao  = labels.map((_, i) => (i >   c.medicoesFeitas ? mediaRestante         : null));

  // Gráfico agora é criado apenas dentro da modal abrirGraficoProjecao()
}

function toggle(i) {
  const card = document.getElementById(`u-${i}`);
  card.classList.toggle('open');
  const container = card.querySelector('[data-os-container]');
  if (container) {
    container.style.display = container.style.display === 'none' ? 'block' : 'none';
  }
}

function renderLista(dados, termo) {
  const grupos = agrupar(dados);
  const lista  = document.getElementById('lista-det');

  if (!grupos.length) {
    lista.innerHTML = '<div class="alert alert-info mt-3">Nenhum registro encontrado.</div>';
    return;
  }

  lista.innerHTML = grupos.map((g, i) => `
    <div class="unidade-item" id="u-${i}">
      <div class="unidade-header" onclick="toggle(${i})">
        <div>
          <div class="unidade-nome">${highlight(g.unidade, termo)}</div>
          <small class="text-muted">${g.os.length} O.S · ${g.conc} ✅ ${g.and} 🟡 ${g.pend} 🔴</small>
        </div>
        <div class="unidade-stats">
          <div class="unidade-stat">
            <div class="unidade-stat-label">Total</div>
            <div class="unidade-stat-value">${R$(g.tot)}</div>
          </div>
          <div class="unidade-stat">
            <div class="unidade-stat-label">Executado</div>
            <div class="unidade-stat-value">${R$(g.pago)}</div>
          </div>
          <div class="unidade-stat">
            <div class="unidade-stat-label">A Executar</div>
            <div class="unidade-stat-value">${R$(g.aberto)}</div>
          </div>
        </div>
        <i class="bi bi-chevron-right" style="color: var(--primary);"></i>
      </div>
      <div data-os-container style="display: none; border-top: 1px solid rgba(148, 163, 184, 0.24); padding-top: 12px;">
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead style="background: rgba(0, 43, 94, 0.05);">
              <tr><th>O.S</th><th>Serviço</th><th>Status</th><th class="text-end">Valor</th><th class="text-end">Executado</th><th class="text-end">A Executar</th></tr>
            </thead>
            <tbody>
              ${g.os.map(r => `
                <tr>
                  <td><strong>${r.os}</strong></td>
                  <td>${highlight(r.servico, termo)}</td>
                  <td>${statusBadge(resolverStatus(r))}</td>
                  <td class="text-end">${R$(r.valor_os)}</td>
                  <td class="text-end text-success">${R$(r.valor_pago)}</td>
                  <td class="text-end text-danger">${R$(r.valor_aberto)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `).join('');
}

function aplicarFiltros() {
  const termo   = document.getElementById('busca-texto').value.trim().toLowerCase();
  const unidade = document.getElementById('filtro-unidade').value;

  let dados = todosOsDados;

  if (unidade) dados = dados.filter(r => r.unidade === unidade);

  if (termo) {
    dados = dados.filter(r =>
      [r.unidade, r.tipo, r.servico, r.status, r.os].some(campo =>
        (campo || '').toString().toLowerCase().includes(termo)
      )
    );
  }

  document.getElementById('badge-det').textContent = `${dados.length} O.S`;
  renderLista(dados, termo);
}

function detalheCard(tipo) {
  const ehStatus = c => todosOsDados.filter(r => statusClass(resolverStatus(r)) === c);
  switch (tipo) {
    case 'total':    return abrirDetalhe('Todas as O.S', todosOsDados);
    case 'emitido':  return abrirDetalhe('Total emitido em O.S', todosOsDados);
    case 'pago':     return abrirDetalhe('Valor executado', todosOsDados.filter(r => r.valor_pago > 0));
    case 'aberto':   return abrirDetalhe('A executar', todosOsDados.filter(r => r.valor_aberto > 0));
    case 'conc':     return abrirDetalhe('O.S concluídas', ehStatus('c'));
    case 'and':      return abrirDetalhe('O.S em andamento', ehStatus('a'));
    case 'pend':     return abrirDetalhe('O.S pendentes', ehStatus('p'));
  }
}

function abrirDetalhe(titulo, lista) {
  const vTot  = r => (r.valor_emitido ?? r.valor_os) || 0;
  const vPago = r => r.valor_pago   || 0;
  const vAb   = r => r.valor_aberto || 0;
  const itens = lista.slice().sort((a, b) => vTot(b) - vTot(a));
  const soma  = f => itens.reduce((s, r) => s + f(r), 0);

  const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('modal-sub').textContent = `${itens.length} O.S`;
  document.getElementById('modal-body').innerHTML = `
    <div class="table-responsive">
      <table class="table">
        <thead style="background: rgba(0, 43, 94, 0.05);">
          <tr><th>Escola</th><th>O.S</th><th class="text-end">Total</th><th class="text-end">Pago</th><th class="text-end">A Executar</th></tr>
        </thead>
        <tbody>
          ${itens.map(r => `
            <tr>
              <td>${r.unidade}</td>
              <td><strong>${r.os || '–'}</strong></td>
              <td class="text-end">${R$(vTot(r))}</td>
              <td class="text-end text-success">${R$(vPago(r))}</td>
              <td class="text-end text-danger">${R$(vAb(r))}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot style="background: rgba(0, 43, 94, 0.05);">
          <tr style="font-weight: 700;">
            <td></td><td class="text-end">Total</td>
            <td class="text-end">${R$(soma(vTot))}</td>
            <td class="text-end">${R$(soma(vPago))}</td>
            <td class="text-end">${R$(soma(vAb))}</td>
          </tr>
        </tfoot>
      </table>
    </div>`;
  modal.show();
}

function abrirInfo(titulo, html) {
  const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('modal-sub').textContent = '';
  document.getElementById('modal-body').innerHTML = `<div class="p-3">${html}</div>`;
  modal.show();
}

function abrirGraficoProjecao() {
  const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
  document.getElementById('modal-titulo').textContent = '📊 Projeção de Saldo por Medição';
  document.getElementById('modal-sub').textContent = 'Clique nas colunas para detalhar';
  document.getElementById('modal-body').innerHTML = `
    <div style="position: relative; height: 400px; padding: 20px;">
      <canvas id="chartProjecaoModal"></canvas>
    </div>`;
  modal.show();

  setTimeout(() => {
    const c = contratoInfo;
    if (!c) return;

    const N = c.medicoesContrato;
    const labels = Array.from({ length: N }, (_, i) => (i + 1) + 'ª');
    const realMap = {};
    medicoesSerie.forEach(m => { realMap[parseInt(m.label, 10)] = m.valor; });

    const proximaMedicao = c.proximaMedicao ?? (c.medicoesFeitas + 1);
    const valorProxima = c.valorProxima ?? todosOsDados.reduce((s,r) => s + r.valor_aberto, 0);
    const medicoesNovas = c.medicoesNovas ?? Math.max(0, c.restantes - 1);
    const mediaRestante = medicoesNovas > 0 ? c.saldo / medicoesNovas : 0;

    const realizado = labels.map((_, i) => (i < c.medicoesFeitas ? (realMap[i + 1] ?? 0) : null));
    const proxima = labels.map((_, i) => (i === c.medicoesFeitas ? valorProxima : null));
    const projecao = labels.map((_, i) => (i > c.medicoesFeitas ? mediaRestante : null));

    const chartModal = new Chart(document.getElementById('chartProjecaoModal'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Realizado', data: realizado, backgroundColor: 'rgba(0, 43, 94, 0.5)', borderColor: 'var(--primary)', borderWidth: 2, borderRadius: 6 },
          { label: 'Próxima medição', data: proxima, backgroundColor: 'rgba(245, 158, 11, 0.2)', borderColor: 'var(--orcamento)', borderWidth: 2, borderRadius: 6 },
          { label: 'Média projetada', data: projecao, backgroundColor: 'rgba(34, 197, 94, 0.2)', borderColor: 'var(--servico-realizado)', borderWidth: 2, borderRadius: 6 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom' } },
        scales: {
          x: { stacked: true },
          y: { stacked: true, ticks: { callback: fmtKM } }
        }
      }
    });
  }, 100);
}

function detalharPorMedicao() {
  if (!todosOsDados.length) {
    abrirInfo('Valor Executado por Medição', 'Nenhuma O.S registrada ainda.');
    return;
  }

  // Descobrir todas as medições
  const medicoesSet = new Set();
  todosOsDados.forEach(r => {
    if (r.med) Object.keys(r.med).forEach(m => medicoesSet.add(parseInt(m)));
  });
  const medicoes = Array.from(medicoesSet).sort((a, b) => a - b);

  if (!medicoes.length) {
    abrirInfo('Valor Executado por Medição', 'Nenhuma medição paga ainda.');
    return;
  }

  // Calcular totais por medição
  const totaisPorMedicao = medicoes.map(m => {
    let total = 0;
    todosOsDados.forEach(r => {
      if (r.med && r.med[m]) total += r.med[m];
    });
    return total;
  });
  const totalGeral = totaisPorMedicao.reduce((s, v) => s + v, 0);

  // Agrupar por unidade (para função detalhar depois)
  const porUnidade = {};
  todosOsDados.forEach(r => {
    if (!porUnidade[r.unidade]) {
      porUnidade[r.unidade] = { unidade: r.unidade, medicoes: {} };
    }
    if (r.med) {
      Object.entries(r.med).forEach(([med, valor]) => {
        const medNum = parseInt(med);
        porUnidade[r.unidade].medicoes[medNum] = (porUnidade[r.unidade].medicoes[medNum] || 0) + valor;
      });
    }
  });

  // Tabela inicial: apenas totais por medição
  const linhasSimples = medicoes.map(m => `
    <tr>
      <td><strong>${m}ª medição</strong></td>
      <td class="text-end">${R$(totaisPorMedicao[medicoes.indexOf(m)])}</td>
    </tr>
  `).join('');

  const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
  document.getElementById('modal-titulo').textContent = '💰 Valor Executado por Medição';
  document.getElementById('modal-sub').textContent = `${medicoes.length} medição(ões) realizada(s)`;
  document.getElementById('modal-body').innerHTML = `
    <div class="table-responsive">
      <table class="table">
        <thead style="background: rgba(0, 43, 94, 0.05);">
          <tr><th>Medição</th><th class="text-end">Valor Pago</th></tr>
        </thead>
        <tbody>
          ${linhasSimples}
        </tbody>
        <tfoot style="background: rgba(0, 43, 94, 0.05);">
          <tr style="font-weight: 700;">
            <td>Total geral</td>
            <td class="text-end text-success">${R$(totalGeral)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div style="margin-top: 16px; text-align: center;">
      <button class="btn btn-primary" onclick="detalharPorUnidade()">
        <i class="bi bi-zoom-in me-2"></i>Detalhar por Unidade Escolar
      </button>
    </div>`;
  modal.show();
}

function detalharPorUnidade() {
  // Descobrir todas as medições
  const medicoesSet = new Set();
  todosOsDados.forEach(r => {
    if (r.med) Object.keys(r.med).forEach(m => medicoesSet.add(parseInt(m)));
  });
  const medicoes = Array.from(medicoesSet).sort((a, b) => a - b);

  // Agrupar por unidade
  const porUnidade = {};
  todosOsDados.forEach(r => {
    if (!porUnidade[r.unidade]) {
      porUnidade[r.unidade] = { unidade: r.unidade, medicoes: {} };
    }
    if (r.med) {
      Object.entries(r.med).forEach(([med, valor]) => {
        const medNum = parseInt(med);
        porUnidade[r.unidade].medicoes[medNum] = (porUnidade[r.unidade].medicoes[medNum] || 0) + valor;
      });
    }
  });

  // Montar cabeçalho com medições
  const cabecalho = ['Unidade Escolar', ...medicoes.map(m => `${m}ª`), 'Total'].join('</th><th class="text-end">') + '</th>';

  // Montar linhas
  const linhas = Object.values(porUnidade)
    .sort((a, b) => a.unidade.localeCompare(b.unidade))
    .map((u, idx) => {
      const valores = medicoes.map(m => u.medicoes[m] || 0);
      const subtotal = valores.reduce((s, v) => s + v, 0);
      const colMedicoes = valores.map((v, i) => {
        const medNum = medicoes[i];
        return v > 0
          ? `<span class="med-clicavel" onclick="abrirDetalheMedicao(${medNum}, '${u.unidade}')" title="Clique para detalhes">${R$(v)}</span>`
          : R$(v);
      });
      const colunas = [
        u.unidade,
        ...colMedicoes,
        `<strong>${R$(subtotal)}</strong>`
      ].join('</td><td class="text-end">') + '</td>';
      return `<tr><td>${colunas}</td></tr>`;
    }).join('');

  // Rodapé com totais
  const totaisPorMedicao = medicoes.map(m => {
    let total = 0;
    Object.values(porUnidade).forEach(u => {
      total += u.medicoes[m] || 0;
    });
    return total;
  });
  const totalGeral = totaisPorMedicao.reduce((s, v) => s + v, 0);

  const colTotais = totaisPorMedicao.map(v => `<strong>${R$(v)}</strong>`);
  const rodape = [
    '<strong>Total por medição</strong>',
    ...colTotais,
    `<strong>${R$(totalGeral)}</strong>`
  ].join('</td><td class="text-end">') + '</td>';

  document.getElementById('modal-titulo').textContent = '💰 Valor Executado por Unidade e Medição';
  document.getElementById('modal-sub').textContent = `${Object.keys(porUnidade).length} unidades · ${medicoes.length} medição(ões) · Clique nas medições para detalhes`;
  document.getElementById('modal-body').innerHTML = `
    <div class="table-responsive">
      <table class="table tabela-detalhamento">
        <thead style="background: rgba(0, 43, 94, 0.05); position: sticky; top: 0;">
          <tr><th>${cabecalho}</tr>
        </thead>
        <tbody>
          ${linhas}
        </tbody>
        <tfoot style="background: rgba(0, 43, 94, 0.05); position: sticky; bottom: 0; font-weight: 700;">
          <tr><td>${rodape}</td></tr>
        </tfoot>
      </table>
    </div>
    <div style="margin-top: 16px; text-align: center; display: flex; gap: 8px; justify-content: center;">
      <button class="btn btn-outline-primary btn-sm" onclick="detalharPorMedicao()">
        <i class="bi bi-arrow-left me-2"></i>Ver por Medição
      </button>
    </div>`;
}

function abrirDetalheMedicao(medNum, unidade) {
  const osComMedicao = todosOsDados.filter(r => r.unidade === unidade && r.med && r.med[medNum] > 0);

  if (!osComMedicao.length) {
    abrirInfo(`Medição ${medNum}ª - ${unidade}`, 'Nenhuma O.S com valor nesta medição.');
    return;
  }

  const linhas = osComMedicao.map(r => `
    <tr>
      <td><strong>OS ${r.os || '–'}</strong></td>
      <td>${r.servico || '–'}</td>
      <td class="text-end text-success">${R$(r.med[medNum])}</td>
    </tr>
  `).join('');

  const total = osComMedicao.reduce((s, r) => s + (r.med[medNum] || 0), 0);

  const modal = new bootstrap.Modal(document.getElementById('modalDetalhes'));
  document.getElementById('modal-titulo').textContent = `📋 Medição ${medNum}ª - ${unidade}`;
  document.getElementById('modal-sub').textContent = `${osComMedicao.length} O.S com valores`;
  document.getElementById('modal-body').innerHTML = `
    <div class="table-responsive">
      <table class="table table-sm">
        <thead style="background: rgba(0, 43, 94, 0.05);">
          <tr><th>O.S</th><th>Serviço</th><th class="text-end">Valor</th></tr>
        </thead>
        <tbody>
          ${linhas}
        </tbody>
        <tfoot style="background: rgba(0, 43, 94, 0.05);">
          <tr style="font-weight: 700;"><td></td><td class="text-end">Total</td><td class="text-end text-success">${R$(total)}</td></tr>
        </tfoot>
      </table>
    </div>
    <div style="margin-top: 12px; text-align: center;">
      <button class="btn btn-outline-primary btn-sm" onclick="detalharPorUnidade()">
        <i class="bi bi-arrow-left me-1"></i>Voltar
      </button>
    </div>`;
  modal.show();
}

function inicializar(payload) {
  todosOsDados  = payload.rows || [];
  medicoesSerie = payload.medicoesSerie || [];
  contratoInfo  = payload.contrato || null;

  const unidades = [...new Set(todosOsDados.map(r => r.unidade))].sort();

  const sel = document.getElementById('filtro-unidade');
  sel.innerHTML = `<option value="">Todas as unidades (${unidades.length})</option>`;
  unidades.forEach(u => {
    const op = document.createElement('option');
    op.value = op.textContent = u;
    sel.appendChild(op);
  });

  document.getElementById('subtitulo').textContent = `Atlântica Construções · ${todosOsDados.length} O.S em ${unidades.length} unidades`;

  atualizarCards(todosOsDados, 'c-');
  atualizarProjecao();
  document.getElementById('badge-det').textContent = `${todosOsDados.length} O.S`;
  renderLista(todosOsDados, '');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
}

async function carregar() {
  if (!API_URL || API_URL.startsWith('COLE_AQUI')) {
    document.getElementById('loading').innerHTML = '<span style="color: var(--griffo);">⚠️ Configure a API_URL.</span>';
    return;
  }

  try {
    const resp = await fetch(API_URL, { method: 'GET' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const payload = await resp.json();
    inicializar(payload);
  } catch (err) {
    document.getElementById('loading').innerHTML = `<span style="color: var(--griffo);">⚠️ Erro: ${err.message || err}</span>`;
  }
}

carregar();
</script>
