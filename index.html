function parseTimelineJsonModal_(res) {
  if (!res) return { ok: false, timeline: [] };
  if (typeof res === 'string') {
    try { return JSON.parse(res); } catch(e) { return { ok: false, erro: e.message, timeline: [] }; }
  }
  return res;
}

function timelineIconePorTipo_(tipo) {
  tipo = String(tipo || '').toLowerCase();
  if (tipo.indexOf('criacao') >= 0) return 'bi-plus-circle-fill';
  if (tipo.indexOf('equipe') >= 0) return 'bi-people-fill';
  if (tipo.indexOf('prazo') >= 0) return 'bi-calendar-check-fill';
  if (tipo.indexOf('conclusao') >= 0) return 'bi-check-circle-fill';
  if (tipo.indexOf('fila') >= 0) return 'bi-hourglass-split';
  if (tipo.indexOf('encaminhamento') >= 0) return 'bi-send-fill';
  return 'bi-dot';
}

function renderTimelineChamadoModal_(eventos, carregando) {
  var box = document.getElementById('mdlTimelineBox');
  if (!box) return;
  eventos = Array.isArray(eventos) ? eventos : [];

  if (carregando && !eventos.length) {
    box.innerHTML = '<div class="timeline-loading"><span class="spinner-border spinner-border-sm me-2"></span>Carregando histórico...</div>';
    return;
  }

  if (!eventos.length) {
    box.innerHTML = '<div class="timeline-empty"><i class="bi bi-clock-history me-1"></i>Nenhum histórico detalhado encontrado para este chamado.</div>';
    return;
  }

  var html = eventos.map(function(e) {
    var status = e.statusNovo || e.status || '';
    var statusAnterior = e.statusAnterior || '';
    var statusLinha = statusAnterior && statusAnterior !== status
      ? '<span class="timeline-status-de">' + escapeHtml(statusAnterior) + '</span><i class="bi bi-arrow-right-short"></i><span class="timeline-status-para">' + escapeHtml(status || '-') + '</span>'
      : (status ? '<span class="timeline-status-para">' + escapeHtml(status) + '</span>' : '');
    var meta = [e.origem, e.usuario, e.equipe ? 'Equipe: ' + e.equipe : '', e.valorOrcamento ? 'Valor: ' + e.valorOrcamento : ''].filter(Boolean).join(' · ');
    return '<div class="timeline-item timeline-' + escapeHtml(e.tipo || 'log') + '">' +
      '<div class="timeline-marker"><i class="bi ' + timelineIconePorTipo_(e.tipo) + '"></i></div>' +
      '<div class="timeline-content">' +
        '<div class="timeline-top"><strong>' + escapeHtml(e.titulo || 'Registro') + '</strong><span>' + escapeHtml(e.data || '-') + '</span></div>' +
        (statusLinha ? '<div class="timeline-status">' + statusLinha + '</div>' : '') +
        (e.descricao ? '<div class="timeline-desc">' + escapeHtml(e.descricao) + '</div>' : '') +
        (meta ? '<div class="timeline-meta">' + escapeHtml(meta) + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  box.innerHTML = '<div class="timeline-list">' + html + '</div>' + (carregando ? '<div class="timeline-loading small"><span class="spinner-border spinner-border-sm me-2"></span>Atualizando com logs do sistema...</div>' : '');
}

function montarTimelineLocalModal_(chamado) {
  chamado = chamado || {};
  var eventos = [];
  function add(ev) {
    if (!ev || (!ev.titulo && !ev.descricao)) return;
    eventos.push(ev);
  }

  add({ tipo: 'criacao', data: chamado.dataHora || chamado.data || '', titulo: 'Chamado criado', descricao: chamado.detalhamento || '', statusNovo: chamado.situacao || chamado.status || '', origem: chamado.sistema || 'Solicitação' });
  if (chamado.dataHoraEntradaFila) add({ tipo: 'fila', data: chamado.dataHoraEntradaFila, titulo: 'Entrada em atendimento/fila', descricao: 'Registro de entrada no atendimento.', statusNovo: chamado.situacao || chamado.status || '', origem: 'Sistema' });
  if (chamado.dataHoraEncaminhamento) add({ tipo: 'encaminhamento', data: chamado.dataHoraEncaminhamento, titulo: 'Encaminhamento registrado', descricao: 'Chamado encaminhado para a etapa atual.', statusNovo: chamado.situacao || chamado.status || '', origem: 'Sistema' });
  if (chamado.dataPrevistaConclusao) add({ tipo: 'prazo', data: chamado.dataPrevistaConclusao, titulo: 'Previsão de conclusão', descricao: 'Previsão definida para conclusão do atendimento.', statusNovo: chamado.situacao || chamado.status || '', origem: 'Prazo' });
  if (chamado.dataConclusaoOs || chamado.dataConclusao) add({ tipo: 'conclusao', data: chamado.dataConclusaoOs || chamado.dataConclusao, titulo: 'Conclusão registrada', descricao: 'Conclusão do atendimento ou OS.', statusNovo: chamado.situacao || chamado.status || '', origem: 'Sistema' });

  return eventos;
}

function carregarTimelineChamadoModal_(id) {
  var chamado = (window.listaChamadosGlobal || []).find(function(x) { return String(x.id) === String(id); }) || {};
  var locais = montarTimelineLocalModal_(chamado);
  renderTimelineChamadoModal_(locais, true);

  if (!google || !google.script || !google.script.run || typeof google.script.run.gomListarTimelineChamadoV1Json !== 'function') {
    renderTimelineChamadoModal_(locais, false);
    return;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      var payload = parseTimelineJsonModal_(res);
      var eventos = payload && payload.ok && Array.isArray(payload.timeline) ? payload.timeline : locais;
      if (!eventos.length) eventos = locais;
      renderTimelineChamadoModal_(eventos, false);
    })
    .withFailureHandler(function(err) {
      console.warn('[GOM TIMELINE] Falha ao carregar timeline:', err);
      renderTimelineChamadoModal_(locais, false);
    })
    .gomListarTimelineChamadoV1Json(id);
}

  const st = normalizarSituacaoSistema(chamado.situacao || chamado.status);

  if (telaAtual === 'fila' || st === 'Aguardando visita') return ['Devolvido para a escola', 'Atendimento Emergencial', 'Solicitado Orçamento'];

function preencherSelectStatusModal(chamado) {
  const select = document.getElementById('mdlSelectStatus');
  if (!select) return;

  if (isFluxoAprovacaoModal_(chamado)) {
    select.innerHTML = [
      '<option value="">Selecione...</option>',

      '<option value="negar">Negar orçamento</option>',

    ].join('');
    select.value = '';
    select.onchange = atualizarCamposModalAprovacao;
    return;
  }

  select.onchange = null;

  const opcoes = [atual].concat(getStatusPermitidosModal(chamado).filter(s => s !== atual));
  select.innerHTML = opcoes.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

function salvarStatusDoModal(botao) {
  const select = document.getElementById('mdlSelectStatus');
  const chamado = (window.listaChamadosGlobal || []).find(x => String(x.id) === String(idChamadoAberto)) || {};
  const emAprovacao = isFluxoAprovacaoModal_(chamado);
  const btn = botao || document.getElementById('mdlBtnAtualizar');
  const obs = document.getElementById('mdlNovaObservacao').value;
  const numeroOs = document.getElementById('mdlNumeroOs');
  const dataPrev = document.getElementById('mdlDataPrevistaConclusao');

  if (emAprovacao) {
    const decisao = select ? select.value : '';
    if (!decisao) {
      alert('Selecione uma decisão do orçamento.');
      return;
    }

    const payload = {
      id: idChamadoAberto,
      decisao: decisao,
      parecerInterno: obs,
      observacoes: obs
    };

    if (decisao === 'aprovar') {
      payload.numeroOs = numeroOs ? String(numeroOs.value || '').trim() : '';
      if (!payload.numeroOs) {
        alert('Informe o número da OS para aprovar o orçamento.');
        if (numeroOs) numeroOs.focus();
        return;
      }
      if (dataPrev && dataPrev.value) payload.dataPrevistaConclusao = dataPrev.value;
    }

    if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(btn, 'Registrando decisão...');
    else if (btn) btn.disabled = true;

    google.script.run
      .withSuccessHandler(function() {
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalAnalise'));
        if (modal) modal.hide();
        refreshChamados(function() {
          if (typeof renderizarTela === 'function') renderizarTela();
        });
      })
      .withFailureHandler(function(err) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(btn);
        else if (btn) btn.disabled = false;
        if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível registrar a decisão.');
        else alert((err && err.message) || err);
      })
      .salvarDecisaoAprovacao(payload);
    return;
  }

  const status = select ? select.value : '';
  const payload = { id: idChamadoAberto, situacao: status, observacoes: obs };
  if (numeroOs && numeroOs.value) payload.numeroOs = numeroOs.value;
  if (dataPrev && dataPrev.value) payload.dataPrevistaConclusao = dataPrev.value;

  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(btn, 'Atualizando...');
  else if (btn) btn.disabled = true;

  google.script.run
    .withSuccessHandler(function() {
      const modal = bootstrap.Modal.getInstance(document.getElementById('modalAnalise'));
      if (modal) modal.hide();
      refreshChamados();
    })
    .withFailureHandler(function(err) {
      if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(btn);
      else if (btn) btn.disabled = false;
      if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível atualizar o chamado.');
      else alert((err && err.message) || err);
    })
    .atualizarChamadoWorkflow(payload);
}

window.atualizarCamposModalAprovacao = atualizarCamposModalAprovacao;

  <script>
window.empresaDiaAlterados = window.empresaDiaAlterados || {};

function totalEncaminhamentosDiaAlterados_() {
  return Object.keys(window.empresaDiaAlterados || {}).length;
}

function atualizarEstadoEncaminhamentosDiaEmpresa() {
  var total = totalEncaminhamentosDiaAlterados_();
  var bar = document.getElementById('empresaDiaSaveBar');
  var texto = document.getElementById('empresaDiaSaveBarText');
  var contador = document.getElementById('empresaDiaAlteracoesCount');

  if (contador) contador.textContent = String(total);
  if (bar) bar.style.display = total > 0 ? 'flex' : 'none';
  if (texto) {
    texto.textContent = total > 0
      ? total + ' encaminhamento(s) do dia aguardando salvamento.'
      : 'Nenhum encaminhamento pendente.';
  }
}

function setBotoesEncaminhamentoDiaEmpresa_(disabled) {
  document.querySelectorAll('#empresaDiaSaveBar button, .empresa-os-form-inline select, .empresa-os-observacao-wrap textarea').forEach(function(el) {
    if (disabled) {
      el.disabled = true;
      el.classList.add('gom-btn-disabled-context');
    } else {
      if (!el.classList.contains('gom-btn-loading')) el.disabled = false;
      el.classList.remove('gom-btn-disabled-context');
    }
  });
}

function marcarEncaminhamentoDiaEmpresaAlterado(id) {
  id = String(id || '').trim();
  if (!id) return;

  var form = document.getElementById('formEquipeDia_' + id.replace(/[^A-Za-z0-9_-]/g, '_')) || document.getElementById('formEquipeDia_' + id);
  if (!form) return;

  var payload = formToObject(form);
  payload.id = id;
  delete payload.numeroOs;

  window.empresaDiaAlterados = window.empresaDiaAlterados || {};
  window.empresaDiaAlterados[id] = payload;

  var row = form.closest ? form.closest('.empresa-os-list-row-v2') : null;
  if (row) row.classList.add('empresa-dia-alterado');

  atualizarEstadoEncaminhamentosDiaEmpresa();
}

function descartarEncaminhamentosDiaEmpresa(botao) {
  if (totalEncaminhamentosDiaAlterados_() > 0 && !confirm('Deseja descartar os encaminhamentos do dia que ainda não foram salvos?')) return;
  window.empresaDiaAlterados = {};
  if (typeof renderizarTela === 'function') renderizarTela();
}

function salvarEncaminhamentosDiaEmpresa(botao) {
  var lista = Object.keys(window.empresaDiaAlterados || {}).map(function(k) { return window.empresaDiaAlterados[k]; });

  if (!lista.length) {
    alert('Não há encaminhamentos do dia pendentes para salvar.');
    return;
  }

  var semEquipe = lista.filter(function(item) { return !String(item.equipe || '').trim(); });
  if (semEquipe.length) {
    alert('Selecione a equipe do dia em todos os encaminhamentos antes de salvar.');
    return;
  }

  if (botao && typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Salvando encaminhamentos...');
  setBotoesEncaminhamentoDiaEmpresa_(true);

  var indice = 0;
  function salvarProximo() {
    if (indice >= lista.length) {
      window.empresaDiaAlterados = {};
      setBotoesEncaminhamentoDiaEmpresa_(false);
      if (botao && typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Salvo');
      else if (botao && typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
      refreshChamados(function() {
        if (window.telaAtual === 'empresa' && typeof renderizarTela === 'function') renderizarTela();
        if (window.telaAtual === 'campo' && typeof refreshCampo === 'function') refreshCampo();
      });
      return;
    }

    var payload = Object.assign({}, lista[indice]);
    payload.id = String(payload.id || '').trim();
    delete payload.numeroOs;

    google.script.run
      .withSuccessHandler(function() {
        indice++;
        salvarProximo();
      })
      .withFailureHandler(function(err) {
        setBotoesEncaminhamentoDiaEmpresa_(false);
        if (botao && typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível salvar os encaminhamentos do dia.');
        else alert((err && err.message) || err);
      })
      .salvarEquipeDiaEmpresa(payload);
  }

  salvarProximo();
}


function setEmpresaModo(modo, botao) {
  modo = modo || 'diario';
  if ((window.empresaModoAtual || 'diario') === 'diario' && modo !== 'diario' && totalEncaminhamentosDiaAlterados_ && totalEncaminhamentosDiaAlterados_() > 0) {
    if (!confirm('Existem encaminhamentos do dia não salvos. Deseja sair da execução diária e descartar essas alterações?')) return;
    window.empresaDiaAlterados = {};
  }
  window.empresaModoAtual = modo;
  if (typeof empresaModoAtual !== 'undefined') empresaModoAtual = window.empresaModoAtual;

  // Ao trocar de aba dentro da Empresa, limpamos filtros que poderiam esconder dados.
  window.statusFiltroClicado = null;
  if (typeof statusFiltroClicado !== 'undefined') statusFiltroClicado = null;

  const buscaGeral = document.getElementById('pesquisa');
  if (buscaGeral) buscaGeral.value = '';

  if (window.empresaModoAtual !== 'gerencial') {
    window.empresaGerencialBusca = '';
    window.empresaGerencialStatus = 'Todos';
    window.empresaGerencialPrazo = 'Todos';
  }

  var tabs = document.querySelectorAll('#empresaModoTabs .nav-link');
  Array.prototype.forEach.call(tabs, function(b) { b.classList.remove('active'); });
  if (botao) botao.classList.add('active');

  if (window.empresaModoAtual === 'gerencial') carregarHistoricoCampoEmpresaSePreciso();
  renderizarTela();
}

function renderEmpresaView(listaRender) {
  var modo = window.empresaModoAtual || 'diario';
  var listaBase = listaRender || [];

  if (modo === 'equipes') return renderGestaoEquipes();

  if (modo === 'orcamentos') {
    var listaOrc = listaBase.filter(function(i) {
      return normalizarSituacaoSistema(i.situacao || i.status) === 'Solicitado Orçamento';
    });
    if (!listaOrc.length) {
      return '<div class="empty-state"><h5>Nenhum orçamento solicitado.</h5><p>Quando a triagem solicitar orçamento, ele aparecerá aqui para a empresa responder.</p></div>';
    }
    return '<div class="empresa-grid">' + listaOrc.map(renderCardOrcamentoEmpresa).join('') + '</div>';
  }

  if (modo === 'gerencial') {
    var statusGerencial = window.STATUS_EMPRESA_GERENCIAL || ['OS emitida', 'Atendimento Emergencial', 'Garantia de Obra', 'Serviço Realizado'];
    var listaGer = listaBase.filter(function(i) {
      return statusGerencial.indexOf(normalizarSituacaoSistema(i.situacao || i.status)) !== -1;
    });
    return renderGerencialOsEmpresa(listaGer);
  }

function carregarHistoricoCampoEmpresaSePreciso(opcoes) {
  opcoes = opcoes || {};
  var dados = window.dadosCampoGlobal || { historico: [] };
  if (!opcoes.forcar && (window.empresaHistoricoCarregando || (Array.isArray(dados.historico) && dados.historico.length > 0))) return;
  if (!google || !google.script || !google.script.run || typeof google.script.run.gomListarCampoWebV3Json !== 'function') return;

  window.empresaHistoricoCarregando = true;
  google.script.run
    .withSuccessHandler(function(res) {
      window.empresaHistoricoCarregando = false;
      try {
        var payload = typeof res === 'string' ? JSON.parse(res) : res;
        window.dadosCampoGlobal = payload && payload.dados ? payload.dados : { chamados: [], historico: [], kpis: {} };
      } catch (e) {
        console.warn('[GOM] Não foi possível carregar histórico de campo para a empresa:', e);
      }
      if (window.telaAtual === 'empresa' && (window.empresaModoAtual || 'diario') === 'gerencial') renderizarTela();
    })
    .withFailureHandler(function(err) {
      window.empresaHistoricoCarregando = false;
      console.warn('[GOM] Falha ao carregar histórico de campo para a empresa:', err);
    })
    .gomListarCampoWebV3Json();
}

function calcularResumoGerencialOsEmpresa(lista) {
  var hoje = new Date();
  var semNumero = 0;
  var vencidas = 0;
  var realizados = 0;
  (lista || []).forEach(function(item) {
    var st = normalizarSituacaoSistema(item.situacao || item.status);
    if (st === 'OS emitida' && !String(item.numeroOs || '').trim()) semNumero++;
    if (st === 'Serviço Realizado') realizados++;
    var p = parseDataEmpresa(item.dataPrevistaConclusao || item.dataPrevistaConclusaoRaw);
    if (p && p.getTime() < inicioDiaEmpresa(hoje).getTime() && st !== 'Serviço Realizado') vencidas++;
  });
  return { total: (lista || []).length, semNumero: semNumero, vencidas: vencidas, realizados: realizados };
}

function filtrarGerencialOsEmpresa(lista) {
  var busca = normalizarTextoBase(valorCampoGerencial_(window.empresaGerencialBusca || ''));
  var filtroStatus = window.empresaGerencialStatus || 'Todos';
  var filtroPrazo = window.empresaGerencialPrazo || 'Todos';

  return (lista || []).filter(function(item) {
    var st = normalizarSituacaoSistema(item.situacao || item.status);
    if (filtroStatus !== 'Todos' && st !== filtroStatus) return false;

    var prazoInfo = getPrazoInfoGerencial(item);
    if (filtroPrazo === 'Vencidas' && prazoInfo.tipo !== 'vencida') return false;
    if (filtroPrazo === 'Sem previsão' && prazoInfo.tipo !== 'sem-previsao') return false;
    if (filtroPrazo === 'No prazo' && prazoInfo.tipo !== 'no-prazo') return false;

    if (!busca) return true;
    var historico = getHistoricoEquipeEmpresaPorId(item.id);
    var textoHistorico = historico.map(function(h) { return [h.equipe, h.observacoes, h.dataAtendimento, h.tipoRegistro].join(' '); }).join(' ');
    var texto = normalizarTextoBase([item.id, item.unidade, item.detalhamento, item.numeroOs, item.equipe, item.observacoes, st, textoHistorico].join(' '));
    return texto.indexOf(busca) !== -1;
  });
}

function valorCampoGerencial_(valor) {
  if (valor && typeof valor === 'object' && typeof valor.value !== 'undefined') return String(valor.value || '');
  if (valor && typeof valor === 'object') return '';
  return String(valor || '');
}

function getPrazoInfoGerencial(item) {
  var st = normalizarSituacaoSistema(item.situacao || item.status);
  if (st === 'Serviço Realizado') return { tipo: 'realizado', classe: 'ok', texto: 'Serviço realizado' };
  var data = parseDataEmpresa(item.dataPrevistaConclusao || item.dataPrevistaConclusaoRaw);
  if (!data) return { tipo: 'sem-previsao', classe: 'neutro', texto: 'Sem previsão' };
  var hoje = inicioDiaEmpresa(new Date());
  var d = inicioDiaEmpresa(data);
  if (d.getTime() < hoje.getTime()) return { tipo: 'vencida', classe: 'vencida', texto: 'Previsão vencida' };
  if (d.getTime() === hoje.getTime()) return { tipo: 'hoje', classe: 'alerta', texto: 'Vence hoje' };
  return { tipo: 'no-prazo', classe: 'ok', texto: 'No prazo' };
}

function parseDataEmpresa(valor) {
  if (!valor) return null;
  if (valor instanceof Date) return valor;
  if (typeof valor === 'number') return new Date(valor);
  var s = String(valor || '').trim();
  if (!s) return null;
  var iso = s.slice(0, 10);
  if (iso.length === 10 && iso.charAt(4) === '-' && iso.charAt(7) === '-') {
    var pIso = iso.split('-');
    return new Date(Number(pIso[0]), Number(pIso[1]) - 1, Number(pIso[2]));
  }
  if ((s.indexOf('/') === 2 || s.indexOf('-') === 2) && s.length >= 10) {
    var sep = s.indexOf('/') === 2 ? '/' : '-';
    var p = s.slice(0, 10).split(sep);
    return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
  }
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function inicioDiaEmpresa(data) {
  return new Date(data.getFullYear(), data.getMonth(), data.getDate());
}

function calcularDiasGerencial(valor) {
  var data = parseDataEmpresa(valor);
  if (!data) return 'Sem data';
  var diff = inicioDiaEmpresa(new Date()).getTime() - inicioDiaEmpresa(data).getTime();
  var dias = Math.max(0, Math.floor(diff / 86400000));
  return dias === 1 ? '1 dia' : String(dias) + ' dias';
}

const CORES_OBRAS = {
  'Aguardando': '#f59e0b',

  'Em execução': 'bi-hammer',
  'Suspensa': 'bi-pause-circle-fill',
  'Concluída': 'bi-check-circle-fill',
  'Arquivada': 'bi-archive-fill'
};

function normalizarStatusObraSistema(valor) {
  const textoOriginal = String(valor || '').trim();
  const textoNormalizado = normalizarTextoBase(textoOriginal);
  const mapa = {
    '': 'Aguardando',
    'aguardando': 'Aguardando',
    'em projeto': 'Em projeto',
    'projeto': 'Em projeto',
    'em licitacao': 'Em licitação',
    'licitacao': 'Em licitação',
    'em execucao': 'Em execução',
    'execucao': 'Em execução',
    'concluida': 'Concluída',
    'concluido': 'Concluída',
    'suspensa': 'Suspensa',
    'suspenso': 'Suspensa',
    'arquivada': 'Arquivada',
    'arquivado': 'Arquivada'
  };
  return mapa[textoNormalizado] || textoOriginal || 'Aguardando';
}

function getCorObraStatus(status) { return CORES_OBRAS[normalizarStatusObraSistema(status)] || '#0f766e'; }
function getIconeObraStatus(status) { return ICONES_OBRAS[normalizarStatusObraSistema(status)] || 'bi-buildings-fill'; }
function pesoPrioridadeObra(prioridade) { const p = String(prioridade || 'P3').toUpperCase(); return { P0: 0, P1: 1, P2: 2, P3: 3 }[p] ?? 9; }
function getPrioridadeClass(prioridade) { const p = String(prioridade || 'P3').toLowerCase(); return ['p0','p1','p2','p3'].includes(p) ? p : 'p3'; }

function renderizarObras() {
  const painel = document.getElementById('painelDados');
  if (!painel) return;
  painel.classList.add('obras-grid');

  if (!obrasCarregadas) {
    setPainelCarregando('Carregando obras...');
    return;
  }

  const termo = termoPesquisa();
  const base = ordenarObras(listaObrasGlobal || []);
  const lista = base.filter(o => {
    o.status = normalizarStatusObraSistema(o.status);
    const texto = normalizarTextoBase(`${o.id} ${o.codigo} ${o.unidade} ${o.tipo} ${o.descricao} ${o.status} ${o.prioridade} ${o.responsavel} ${o.responsavel2} ${o.prazo} ${o.valorEstimado} ${o.observacoes}`);
    return texto.includes(termo) && (statusFiltroClicado ? o.status === statusFiltroClicado : true);
  });

  renderizarKPIsObras(base);
  const contador = document.getElementById('contador');
  if (contador) contador.innerText = `${lista.length} obras`;

  if (!lista.length) {
    painel.innerHTML = '<div class="empty-state"><i class="bi bi-buildings display-5 d-block mb-3 text-muted"></i><h5>Nenhuma obra encontrada.</h5><p>Ajuste a busca ou selecione outro status.</p></div>';
    return;
  }

  painel.innerHTML = lista.map(renderCardObra).join('');
}

function ordenarObras(lista) {
  return [...(lista || [])].sort((a, b) => {
    const pa = pesoPrioridadeObra(a.prioridade);
    const pb = pesoPrioridadeObra(b.prioridade);
    if (pa !== pb) return pa - pb;
    return String(a.unidade || a.descricao || '').localeCompare(String(b.unidade || b.descricao || ''), 'pt-BR') || Number(a.id || 0) - Number(b.id || 0);
  });
}

function renderizarKPIsObras(lista) {
  const grid = document.getElementById('kpiGrid');
  if (!grid) return;
  const cont = {};
  (lista || []).forEach(o => { const st = normalizarStatusObraSistema(o.status); cont[st] = (cont[st] || 0) + 1; });
  let html = '';
  html += montarKpiCard(null, 'Todas as obras', (lista || []).length, 'var(--obras)', statusFiltroClicado === null, 'Todas as obras');

}

function abrirModalObra(id) {
  const o = listaObrasGlobal.find(x => String(x.id) === String(id));

  idObraAberta = o.id;
  document.getElementById('obraId').value = o.id;

function salvarObraModal(botao) {
  const btn = botao || (typeof gomGetBotaoAtivo === 'function' ? gomGetBotaoAtivo() : null);
  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(btn, 'Salvando obra...');

  };

window.renderizarObras = window.renderizarObras || renderizarObras;

  <!-- Scripts_Campo.html -->
  <script>
var campoTabAtual = window.campoTabAtual || 'dia';
var campoFiltroAtual = window.campoFiltroAtual || null;
var campoEscolaFiltroAtual = window.campoEscolaFiltroAtual || '';

function loadCampoTab(tab, botao) {
  campoTabAtual = tab || 'dia';
  window.campoTabAtual = campoTabAtual;
  document.querySelectorAll('.campo-actions .btn').forEach(function(b) { b.classList.remove('active'); });
  if (botao) botao.classList.add('active');
  renderizarCampo();
}

function filtrarCampoKpi(filtro) {
  campoFiltroAtual = campoFiltroAtual === filtro ? null : filtro;
  window.campoFiltroAtual = campoFiltroAtual;
  renderizarCampo();
}

function filtrarCampo() {
  sincronizarFiltroEscolaCampo();
  renderizarCampo();
}

function limparFiltrosCampo() {
  campoFiltroAtual = null;
  window.campoFiltroAtual = null;
  campoEscolaFiltroAtual = '';
  window.campoEscolaFiltroAtual = '';

  const pesquisa = document.getElementById('pesquisa');
  if (pesquisa) pesquisa.value = '';

  const select = document.getElementById('campoSelectEscola');
  if (select) select.value = '';

  renderizarCampo();
}

function sincronizarFiltroEscolaCampo() {
  const select = document.getElementById('campoSelectEscola');
  if (!select) return;
  campoEscolaFiltroAtual = select.value || '';
  window.campoEscolaFiltroAtual = campoEscolaFiltroAtual;
}

function getFiltroEscolaCampoNormalizado() {
  return normalizarTextoBase(campoEscolaFiltroAtual || '');
}

function passaFiltroEscolaCampo(item) {
  const escolaFiltro = getFiltroEscolaCampoNormalizado();
  if (!escolaFiltro) return true;
  return normalizarTextoBase(item && item.unidade ? item.unidade : '').includes(escolaFiltro);
}

function popularSelectEscolasCampo() {
  const select = document.getElementById('campoSelectEscola');
  if (!select) return;

  const valorAtual = select.value || campoEscolaFiltroAtual || '';
  const mapa = {};

  getChamadosCampo().forEach(function(item) {
    const nome = String(item && item.unidade ? item.unidade : '').trim();
    if (nome) mapa[nome] = true;
  });

  getHistoricoCampo().forEach(function(item) {
    const nome = String(item && item.unidade ? item.unidade : '').trim();
    if (nome) mapa[nome] = true;
  });

  const escolas = Object.keys(mapa).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
  select.innerHTML = '<option value="">Todas as escolas</option>' + escolas.map(function(nome) {
    const selected = nome === valorAtual ? ' selected' : '';
    return '<option value="' + escapeHtml(nome) + '"' + selected + '>' + escapeHtml(nome) + '</option>';
  }).join('');

  if (valorAtual && escolas.indexOf(valorAtual) >= 0) select.value = valorAtual;
  else if (valorAtual) {
    campoEscolaFiltroAtual = '';
    window.campoEscolaFiltroAtual = '';
  }
}

function getDadosCampo() {
  return window.dadosCampoGlobal || { chamados: [], historico: [], kpis: {} };
}

function getChamadosCampo() {
  const dados = getDadosCampo();
  return Array.isArray(dados.chamados) ? dados.chamados : [];
}

function getHistoricoCampo() {
  const dados = getDadosCampo();
  return Array.isArray(dados.historico) ? dados.historico : [];
}

function renderizarCampo() {
  if (!window.campoCarregado) {
    const painel = document.getElementById('painelDados');
    if (painel) {
      painel.innerHTML = '<div class="empty-state"><div class="spinner-border text-primary"></div><p class="mt-3 fw-bold">Carregando equipes em campo...</p></div>';
    }
    return;
  }

  popularSelectEscolasCampo();
  renderizarKpisCampo();
  const painel = document.getElementById('painelDados');
  if (!painel) return;

  const termo = termoPesquisa();
  const chamadosBase = getChamadosCampo().filter(function(item) {
    const textoOk = normalizarTextoBase([
      item.id, item.unidade, item.detalhamento, item.equipe, item.situacao,
      item.numeroOs, item.observacoes, item.dataEquipe, item.dataHoraUltimaAcao,
      item.dataPrevistaConclusao
    ].join(' ')).includes(termo);
    return textoOk && passaFiltroEscolaCampo(item);
  });
  const chamados = aplicarFiltroCampo(chamadosBase);
  const historico = filtrarHistoricoCampo(getHistoricoCampo(), termo);

  if (campoTabAtual === 'historico') {
    painel.innerHTML = renderHistoricoCampo(historico, chamadosBase);
    return;
  }

  if (campoTabAtual === 'pendencias') {
    const pendentes = chamados.filter(function(c) { return !c.temEquipeDiaValida; });
    painel.innerHTML = pendentes.length ? renderListaCampoOficial(pendentes, { modo: 'pendencias' }) : '<div class="empty-state"><h5>Nenhuma pendência de preenchimento hoje.</h5><p>A empresa já registrou as equipes do dia para todos os atendimentos filtrados.</p></div>';
    setContadorCampo(pendentes.length);
    return;
  }

  painel.innerHTML = chamados.length ? renderListaCampoOficial(chamados, { modo: 'dia' }) : '<div class="empty-state"><h5>Nenhuma unidade em campo para os filtros atuais.</h5><p>Use a busca ou os KPIs para remover filtros aplicados.</p></div>';
  setContadorCampo(chamados.length);
}

function aplicarFiltroCampo(lista) {
  if (!campoFiltroAtual) return lista || [];
  return (lista || []).filter(function(item) {
    const st = normalizarSituacaoSistema(item.situacao || item.status);
    if (campoFiltroAtual === 'OS emitida') return st === 'OS emitida';
    if (campoFiltroAtual === 'Atendimento Emergencial') return st === 'Atendimento Emergencial';
    if (campoFiltroAtual === 'OS sem número') return st === 'OS emitida' && !String(item.numeroOs || '').trim();
    if (campoFiltroAtual === 'Escolas em atendimento') return true;
    if (campoFiltroAtual === 'Pendentes hoje') return !item.temEquipeDiaValida;
    if (campoFiltroAtual === 'Preenchidos hoje') return !!item.temEquipeDiaValida;
    return true;
  });
}

function filtrarHistoricoCampo(historico, termo) {
  const lista = (historico || []).filter(function(h) { return passaFiltroEscolaCampo(h); });
  if (!termo) return lista;
  return lista.filter(function(h) {
    return normalizarTextoBase([h.dataAtendimento, h.id, h.unidade, h.equipe, h.tipoRegistro, h.observacoes].join(' ')).includes(termo);
  });
}

function renderizarKpisCampo() {
  const grid = document.getElementById('campoKpis');
  if (!grid) return;

  const dados = getDadosCampo();
  const k = dados.kpis || {};
  const chamados = getChamadosCampo();

  const pendentesHoje = Number(k.pendentesHoje || 0) || chamados.filter(function(c) { return !c.temEquipeDiaValida; }).length;
  const preenchidosHoje = Number(k.preenchidosHoje || 0) || chamados.filter(function(c) { return !!c.temEquipeDiaValida; }).length;

  const cards = [
    { filtro: 'Escolas em atendimento', titulo: 'Unidades em campo', valor: k.escolasEmAtendimento || chamados.length, cor: 'var(--servico-realizado)', icon: 'bi-buildings-fill', descricao: 'Unidades com atendimento ativo e acompanhamento diário necessário.' },
    { filtro: 'Pendentes hoje', titulo: 'Pendentes hoje', valor: pendentesHoje, cor: 'var(--duplicado)', icon: 'bi-clock-history', descricao: 'Atendimentos que ainda não receberam equipe do dia ou observação diária.' },
    { filtro: 'Preenchidos hoje', titulo: 'Preenchidos hoje', valor: preenchidosHoje, cor: 'var(--concluido)', icon: 'bi-check-circle-fill', descricao: 'Atendimentos que já tiveram equipe registrada no dia atual.' },
    { filtro: 'OS emitida', titulo: 'OS emitidas', valor: k.osAbertas || chamados.filter(function(c) { return normalizarSituacaoSistema(c.situacao || c.status) === 'OS emitida'; }).length, cor: 'var(--os)', icon: 'bi-file-earmark-check-fill', descricao: 'Ordens de serviço liberadas para execução pela empresa.' },
    { filtro: 'Atendimento Emergencial', titulo: 'Emergenciais', valor: k.emergenciais || chamados.filter(function(c) { return normalizarSituacaoSistema(c.situacao || c.status) === 'Atendimento Emergencial'; }).length, cor: 'var(--emergencial)', icon: 'bi-exclamation-triangle-fill', descricao: 'Demandas emergenciais atualmente em campo.' },
    { filtro: 'OS sem número', titulo: 'OS sem número', valor: osSemNumero, cor: 'var(--orcamento)', icon: 'bi-exclamation-diamond-fill', descricao: 'OS emitidas que precisam de numeração para rastreabilidade.' }
  ];

  grid.innerHTML = cards
    .filter(function(c) { return Number(c.valor) > 0; })
    .map(function(c) { return renderKpiCampo(c); })
    .join('');
}

function renderListaCampoOficial(lista, opcoes) {

function salvarEquipeDiaCampoFront(e, id) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  alert('A tela Campo é somente para visualização. O registro da equipe do dia deve ser feito pela empresa na tela Empresa.');
}

function renderHistoricoCampo(historico, chamadosAtuais) {
  const historicoValido = Array.isArray(historico) ? historico : [];
  const chamados = Array.isArray(chamadosAtuais) ? chamadosAtuais : [];
  const baseGrafico = historicoValido.length ? historicoValido : chamados.map(function(c) {
    return {
      dataAtendimento: c.dataEquipe || c.dataHoraUltimaAcao || c.dataHora || c.data || 'Atual',
      id: c.id,
      unidade: c.unidade,
      equipe: c.equipe || (c.temEquipeDiaValida ? 'Equipe informada' : 'Pendente'),
      tipoRegistro: c.temEquipeDiaValida ? 'Preenchido hoje' : 'Pendente hoje',
      observacoes: c.observacoes || ''
    };
  });

  if (!baseGrafico.length && !chamados.length) {
    setContadorCampo(0);
    return '<div class="empty-state"><h5>Nenhum histórico ou atendimento em campo encontrado.</h5></div>';
  }

  const seriePorData = gerarSerieDiariaCampo(baseGrafico, 30);
  const porEquipe = agruparContagem(baseGrafico, function(h) { return String(h.equipe || 'Sem equipe').trim() || 'Sem equipe'; });
  const porTipo = agruparContagem(baseGrafico, function(h) { return String(h.tipoRegistro || 'Registro').trim() || 'Registro'; });
  const diasPorUnidade = calcularDiasEmCampoPorUnidade(chamados);
  const osPrazo = calcularOsPrazoCampo(chamados);
  const pendenciasTipo = calcularPendenciasTipoCampo(chamados);
  const atendimentosPorStatus = agruparContagem(chamados, function(c) { return normalizarSituacaoSistema(c.situacao || c.status || 'Sem status'); });
  const rankingEquipes = agruparContagem(baseGrafico, function(h) { return String(h.equipe || 'Sem equipe').trim() || 'Sem equipe'; });
  const tempoMedioEquipe = calcularTempoMedioCampoPorEquipe(chamados);

  const linhas = baseGrafico.slice(-120).reverse().map(function(h) {

function renderGraficoBarrasDataCampo(titulo, serie, subtitulo) {
  const entradas = Array.isArray(serie) ? serie : [];
  const max = entradas.reduce(function(m, item) { return Math.max(m, Number(item.valor || 0)); }, 1);
  return `
    <div class="panel campo-chart-panel campo-chart-panel-wide">
      <div class="panel-head campo-chart-head">
        <div>
          <h6 class="panel-title mb-0"><i class="bi bi-bar-chart-fill"></i>${escapeHtml(titulo)}</h6>
          <p class="campo-chart-subtitle mb-0">${escapeHtml(subtitulo || '')}</p>
        </div>
        <span class="campo-chart-periodo">Últimos ${escapeHtml(entradas.length || 0)} dias</span>
      </div>
      <div class="campo-chart campo-chart-data">
        ${entradas.map(function(item) {
          const label = item.label;
          const valor = Number(item.valor || 0);
          const altura = valor > 0 ? Math.max(12, Math.round((valor / max) * 190)) : 4;

        }).join('')}
      </div>
    </div>`;
}

function renderGraficoRoscaCampo(titulo, dados, subtitulo) {
  const paleta = ['#002b5e', '#00e5ff', '#22c55e', '#f59e0b', '#6366f1', '#ec4899', '#14b8a6', '#ef4444', '#64748b'];
  const entradasOriginais = Object.entries(dados || {}).filter(function(item) { return Number(item[1] || 0) > 0; }).sort(function(a, b) { return b[1] - a[1]; });
  const entradas = limitarEntradasRoscaCampo(entradasOriginais, 7);
  const total = entradas.reduce(function(soma, item) { return soma + Number(item[1] || 0); }, 0);

  if (!total) {
    return `
      <div class="panel campo-chart-panel campo-donut-panel">
        <div class="panel-head campo-chart-head"><div><h6 class="panel-title mb-0"><i class="bi bi-pie-chart-fill"></i>${escapeHtml(titulo)}</h6><p class="campo-chart-subtitle mb-0">${escapeHtml(subtitulo || '')}</p></div></div>
        <div class="empty-state compact"><h6>Nenhum registro para este gráfico.</h6></div>
      </div>`;
  }

  let acumulado = 0;
  const segmentos = entradas.map(function(item, idx) {
    const valor = Number(item[1] || 0);
    const inicio = acumulado;
    const fim = acumulado + (valor / total * 360);
    acumulado = fim;
    return `${paleta[idx % paleta.length]} ${inicio.toFixed(2)}deg ${fim.toFixed(2)}deg`;
  }).join(', ');

  return `
    <div class="panel campo-chart-panel campo-donut-panel">
      <div class="panel-head campo-chart-head">
        <div>
          <h6 class="panel-title mb-0"><i class="bi bi-pie-chart-fill"></i>${escapeHtml(titulo)}</h6>
          <p class="campo-chart-subtitle mb-0">${escapeHtml(subtitulo || '')}</p>
        </div>
        <span class="campo-chart-periodo">${escapeHtml(total)} registros</span>
      </div>
      <div class="campo-donut-wrap">
        <div class="campo-donut" style="background: conic-gradient(${segmentos});">
          <div class="campo-donut-center"><strong>${escapeHtml(total)}</strong><span>registros</span></div>
        </div>
        <div class="campo-donut-legend">
          ${entradas.map(function(item, idx) {
            const label = item[0];
            const valor = Number(item[1] || 0);
            const pct = total ? Math.round(valor / total * 100) : 0;
            return `<div class="campo-donut-legend-row" title="${escapeHtml(label)}: ${escapeHtml(valor)}"><span class="campo-donut-color" style="background:${paleta[idx % paleta.length]};"></span><span class="campo-donut-label">${escapeHtml(label)}</span><strong>${escapeHtml(valor)}</strong><em>${escapeHtml(pct)}%</em></div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

function limitarEntradasRoscaCampo(entradas, limite) {
  if (!Array.isArray(entradas) || entradas.length <= limite) return entradas || [];
  const principais = entradas.slice(0, limite);
  const outros = entradas.slice(limite).reduce(function(soma, item) { return soma + Number(item[1] || 0); }, 0);
  if (outros > 0) principais.push(['Outros', outros]);
  return principais;
}

function gerarSerieDiariaCampo(lista, dias) {
  const totalDias = Math.max(7, Number(dias || 30));
  const hoje = new Date();
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - (totalDias - 1));
  const mapa = {};
  const serie = [];

  for (let i = 0; i < totalDias; i++) {
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    const chave = chaveDataCampo(d);
    mapa[chave] = { chave: chave, label: labelDataCampo(d), valor: 0 };
    serie.push(mapa[chave]);
  }

  (lista || []).forEach(function(item) {
    const d = parseDataCampo(item.dataAtendimento || item.dataEquipe || item.dataHoraUltimaAcao || item.dataHora || item.data);
    if (!d) return;
    const dLimpa = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (dLimpa.getTime() < inicio.getTime()) return;
    const chave = chaveDataCampo(dLimpa);
    if (mapa[chave]) mapa[chave].valor += 1;
  });

  return serie;
}

function parseDataCampo(valor) {
  if (valor instanceof Date && !isNaN(valor.getTime())) return valor;
  if (typeof valor === 'number' && valor > 100000) {
    const dataNumero = new Date(valor);
    return isNaN(dataNumero.getTime()) ? null : dataNumero;
  }

  const s = String(valor || '').trim();
  if (!s || s === 'Atual' || s === '-') return null;

  const primeiraParte = s.split(' ')[0];
  if (primeiraParte.indexOf('/') > -1) {
    const partes = primeiraParte.split('/');
    if (partes.length >= 3) {
      let dia = Number(partes[0]);
      let mes = Number(partes[1]);
      let ano = Number(partes[2]);
      if (ano < 100) ano += 2000;
      const d = new Date(ano, mes - 1, dia);
      return isNaN(d.getTime()) ? null : d;
    }
  }

  if (primeiraParte.indexOf('-') > -1) {
    const partesIso = primeiraParte.split('-');
    if (partesIso.length >= 3 && partesIso[0].length === 4) {
      const d = new Date(Number(partesIso[0]), Number(partesIso[1]) - 1, Number(partesIso[2]));
      return isNaN(d.getTime()) ? null : d;
    }
  }

  const dataNativa = new Date(s);
  return isNaN(dataNativa.getTime()) ? null : dataNativa;
}

function chaveDataCampo(data) {
  return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0') + '-' + String(data.getDate()).padStart(2, '0');
}

function labelDataCampo(data) {
  return String(data.getDate()).padStart(2, '0') + '/' + String(data.getMonth() + 1).padStart(2, '0');
}

function renderGraficoBarrasHorizCampo(titulo, dados, subtitulo, unidade, opcoes) {
  const cfg = opcoes || {};
  const decimais = Number(cfg.decimais || 0);
  const entradas = Object.entries(dados || {})
    .filter(function(item) { return Number(item[1] || 0) > 0; })
    .sort(function(a, b) { return Number(b[1] || 0) - Number(a[1] || 0); })
    .slice(0, Number(cfg.limite || 10));

  const max = entradas.reduce(function(m, item) { return Math.max(m, Number(item[1] || 0)); }, 1);

  return `
    <div class="panel campo-chart-panel campo-hbar-panel">
      <div class="panel-head campo-chart-head">
        <div>
          <h6 class="panel-title mb-0"><i class="bi bi-bar-chart-steps"></i>${escapeHtml(titulo)}</h6>
          <p class="campo-chart-subtitle mb-0">${escapeHtml(subtitulo || '')}</p>
        </div>
        <span class="campo-chart-periodo">Top ${escapeHtml(entradas.length || 0)}</span>
      </div>
      <div class="campo-hbar-body">
        ${entradas.length ? entradas.map(function(item, idx) {
          const label = String(item[0] || 'Sem informação');
          const valor = Number(item[1] || 0);
          const largura = Math.max(6, Math.round((valor / max) * 100));
          const valorFormatado = decimais > 0 ? valor.toFixed(decimais).replace('.', ',') : String(Math.round(valor));
          return `<div class="campo-hbar-row" title="${escapeHtml(label)}: ${escapeHtml(valorFormatado)} ${escapeHtml(unidade || '')}">
            <div class="campo-hbar-label"><span>${escapeHtml(idx + 1)}</span>${escapeHtml(label)}</div>
            <div class="campo-hbar-track"><div class="campo-hbar-fill" style="width:${largura}%;"></div></div>
            <div class="campo-hbar-value">${escapeHtml(valorFormatado)} <small>${escapeHtml(unidade || '')}</small></div>
          </div>`;
        }).join('') : '<div class="empty-state compact"><h6>Nenhum dado para este gráfico.</h6></div>'}
      </div>
    </div>`;
}

function calcularDiasEmCampoPorUnidade(chamados) {
  const hoje = new Date();
  const hojeLimpo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return (chamados || []).reduce(function(acc, item) {
    const unidade = String(item.unidade || 'Unidade não informada').trim() || 'Unidade não informada';
    const dataInicio = parseDataCampo(item.dataHoraEncaminhamento || item.dataHoraEntradaFila || item.dataHoraUltimaAcao || item.dataHora || item.data);
    if (!dataInicio) return acc;
    const inicioLimpo = new Date(dataInicio.getFullYear(), dataInicio.getMonth(), dataInicio.getDate());
    const dias = Math.max(1, Math.floor((hojeLimpo.getTime() - inicioLimpo.getTime()) / 86400000) + 1);
    acc[unidade] = Math.max(Number(acc[unidade] || 0), dias);
    return acc;
  }, {});
}

function calcularOsPrazoCampo(chamados) {
  const hoje = new Date();
  const hojeLimpo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const resultado = { 'No prazo': 0, 'Vencidas': 0, 'Sem previsão': 0 };

  (chamados || []).forEach(function(item) {
    const st = normalizarSituacaoSistema(item.situacao || item.status);
    if (!['OS emitida', 'Atendimento Emergencial', 'Garantia de Obra'].includes(st)) return;
    const previsao = parseDataCampo(item.dataPrevistaConclusao || item.previsaoConclusao || item.dataPrevisao);
    if (!previsao) {
      resultado['Sem previsão'] += 1;
      return;
    }
    const previsaoLimpa = new Date(previsao.getFullYear(), previsao.getMonth(), previsao.getDate());
    if (previsaoLimpa.getTime() < hojeLimpo.getTime()) resultado['Vencidas'] += 1;
    else resultado['No prazo'] += 1;
  });

  return resultado;
}

function calcularPendenciasTipoCampo(chamados) {
  const hoje = new Date();
  const hojeLimpo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const resultado = {
    'Sem equipe hoje': 0,
    'OS sem número': 0,
    'Previsão vencida': 0,
    'Sem previsão': 0,
    'Sem observação hoje': 0
  };

  (chamados || []).forEach(function(item) {
    const st = normalizarSituacaoSistema(item.situacao || item.status);
    if (!item.temEquipeDiaValida) resultado['Sem equipe hoje'] += 1;
    if (st === 'OS emitida' && !String(item.numeroOs || '').trim()) resultado['OS sem número'] += 1;

    const previsao = parseDataCampo(item.dataPrevistaConclusao || item.previsaoConclusao || item.dataPrevisao);
    if (!previsao) resultado['Sem previsão'] += 1;
    else {
      const previsaoLimpa = new Date(previsao.getFullYear(), previsao.getMonth(), previsao.getDate());
      if (previsaoLimpa.getTime() < hojeLimpo.getTime()) resultado['Previsão vencida'] += 1;
    }

    if (item.temEquipeDiaValida && !String(item.observacoes || '').trim()) resultado['Sem observação hoje'] += 1;
  });

  Object.keys(resultado).forEach(function(chave) {
    if (!resultado[chave]) delete resultado[chave];
  });
  return resultado;
}

function calcularTempoMedioCampoPorEquipe(chamados) {
  const hoje = new Date();
  const hojeLimpo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const acumulado = {};

  (chamados || []).forEach(function(item) {
    const equipe = String(item.equipe || '').trim();
    if (!equipe) return;
    const dataInicio = parseDataCampo(item.dataHoraEncaminhamento || item.dataHoraEntradaFila || item.dataHoraUltimaAcao || item.dataHora || item.data);
    if (!dataInicio) return;
    const inicioLimpo = new Date(dataInicio.getFullYear(), dataInicio.getMonth(), dataInicio.getDate());
    const dias = Math.max(1, Math.floor((hojeLimpo.getTime() - inicioLimpo.getTime()) / 86400000) + 1);
    if (!acumulado[equipe]) acumulado[equipe] = { soma: 0, qtd: 0 };
    acumulado[equipe].soma += dias;
    acumulado[equipe].qtd += 1;
  });

  return Object.keys(acumulado).reduce(function(acc, equipe) {
    acc[equipe] = acumulado[equipe].qtd ? (acumulado[equipe].soma / acumulado[equipe].qtd) : 0;
    return acc;
  }, {});
}

function renderGraficoBarrasCampo(titulo, dados, cor) {
  const entradas = Object.entries(dados || {}).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 12);
  const serie = entradas.map(function(item) { return { label: item[0], valor: item[1] }; });
  return renderGraficoBarrasDataCampo(titulo, serie, '');
}

function agruparContagem(lista, fn) {
  return (lista || []).reduce(function(acc, item) {
    const chave = fn(item) || 'Sem informação';
    acc[chave] = (acc[chave] || 0) + 1;
    return acc;
  }, {});
}

function normalizarDataCurtaCampo(valor) {
  const s = String(valor || '').trim();
  if (!s) return 'Sem data';
  const br = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (br) return br[1].padStart(2, '0') + '/' + br[2].padStart(2, '0');
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[3] + '/' + iso[2];
  return s.substring(0, 10);
}

function setContadorCampo(n) {
  const c = document.getElementById('contadorCampo');
  if (c) c.innerText = Number(n || 0) + ' registro' + (Number(n || 0) === 1 ? '' : 's');
}

function campoSafeDomId(valor) {
  return String(valor || '').split('').map(function(ch) {
    const code = ch.charCodeAt(0);
    const ok = (code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122) || ch === '_' || ch === '-';
    return ok ? ch : '_';
  }).join('') || 'sem_id';
}

function resumirTextoCampo(valor, limite) {
  const texto = String(valor || '').replace(/\s+/g, ' ').trim();
  if (texto.length <= limite) return texto;
  return texto.slice(0, limite - 1).trim() + '…';
}

  <script>
(function() {
