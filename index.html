<script>
/**
 * GOM — gom-api.js
 *
 * Substitui google.script.run por chamadas fetch() ao GAS como API REST.
 * Mantém a interface:
 *
 * google.script.run
 *   .withSuccessHandler(fn)
 *   .withFailureHandler(fn)
 *   .nomeDaFuncao(args)
 *
 * Este arquivo deve ser carregado ANTES dos demais Scripts_*.html.
 */

const GOM_API_URL = 'https://script.google.com/a/macros/educacao.pmrp.sp.gov.br/s/AKfycbzGf9lnIDmlcBdEVT9EzJ5ykQZwqFniWGOCnr6AovtXrUGx7eFPfyVzwQdaurb_T4XR/exec';

const GomAPI = (() => {
  'use strict';

  function tentarJson(texto) {
    try {
      return JSON.parse(texto);
    } catch (e) {
      return texto;
    }
  }

  function validarRespostaApi(acao, resposta) {
    if (
      resposta &&
      typeof resposta === 'object' &&
      resposta.ok === false &&
      (resposta.erro || resposta.error)
    ) {
      throw new Error(resposta.erro || resposta.error || ('Erro em ' + acao));
    }
    return resposta;
  }

  async function _getText_(acao, params) {
    const url = new URL(GOM_API_URL);
    url.searchParams.set('acao', acao);

    if (params && typeof params === 'object') {
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null) {
          url.searchParams.set(k, String(v));
        }
      });
    }

    const res = await fetch(url.toString(), {
      method: 'GET',
      redirect: 'follow'
    });

    if (!res.ok) {
      throw new Error('Erro HTTP ' + res.status + ' em ' + acao);
    }

    return await res.text();
  }

  async function _get_(acao, params) {
    const texto = await _getText_(acao, params);
    return validarRespostaApi(acao, tentarJson(texto));
  }

  async function _post_(acao, payload) {
    const res = await fetch(GOM_API_URL, {
      method: 'POST',

      /*
       * Importante:
       * Usamos text/plain para evitar preflight CORS no navegador.
       * O Apps Script continua recebendo o JSON normalmente em e.postData.contents.
       */
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },

      body: JSON.stringify({
        acao,
        payload: payload || {}
      }),

      redirect: 'follow'
    });

    if (!res.ok) {
      throw new Error('Erro HTTP ' + res.status + ' em ' + acao);
    }

    const texto = await res.text();
    return validarRespostaApi(acao, tentarJson(texto));
  }

  return {
    _get_,
    _getText_,
    _post_
  };
})();

/**
 * Cria um runner compatível com google.script.run.
 *
 * Exemplo suportado:
 * google.script.run
 *   .withSuccessHandler(cb)
 *   .withFailureHandler(err)
 *   .gomListarChamadosWebV3Json()
 */
function criarGomScriptRunner(onSuccess, onFailure, userObject) {
  const estado = {
    onSuccess: typeof onSuccess === 'function' ? onSuccess : null,
    onFailure: typeof onFailure === 'function' ? onFailure : null,
    userObject: userObject || null
  };

  const runner = {
    withSuccessHandler(fn) {
      return criarGomScriptRunner(fn, estado.onFailure, estado.userObject);
    },

    withFailureHandler(fn) {
      return criarGomScriptRunner(estado.onSuccess, fn, estado.userObject);
    },

    withUserObject(obj) {
      return criarGomScriptRunner(estado.onSuccess, estado.onFailure, obj);
    }
  };

  return new Proxy(runner, {
    get(target, prop) {
      if (prop in target) {
        return target[prop].bind(target);
      }

      // Evita o runner ser tratado como Promise/thenable.
      if (prop === 'then') {
        return undefined;
      }

      return function(...args) {
        _executarChamadaGAS_(String(prop), args)
          .then(resultado => {
            if (estado.onSuccess) {
              estado.onSuccess(resultado, estado.userObject);
            }
          })
          .catch(erro => {
            if (estado.onFailure) {
              estado.onFailure(erro, estado.userObject);
            } else {
              console.error('[GOM API] Erro não tratado em', prop, erro);
            }
          });
      };
    }
  });
}

// Expõe google.script.run fake no GitHub Pages.
window.google = window.google || {};
window.google.script = window.google.script || {};
window.google.script.run = criarGomScriptRunner();

/**
 * Mapeamento:
 * nome da função usada no frontend → ação REST do Code_API.gs
 */
async function _executarChamadaGAS_(nomeFuncao, args) {
  const payload = args && args[0] !== undefined ? args[0] : {};

  switch (nomeFuncao) {
    // ─────────────────────────────────────────────
    // Leituras
    // ─────────────────────────────────────────────

    case 'gomListarChamadosWebV3Json':
      // A função original do GAS retornava string JSON.
      // Mantemos isso para não quebrar scripts que fazem JSON.parse().
      return GomAPI._getText_('listarChamados');

    case 'getDadosIniciais':
      return GomAPI._get_('getDadosIniciais');

    case 'gomListarCampoWebV3Json':
      return GomAPI._getText_('listarCampo');

    case 'gomListarObrasWebV3Json':
      return GomAPI._getText_('listarObras');

    case 'gomObterUsuarioAtualV1Json': {
      const texto = await GomAPI._getText_('getUsuario');

      /*
       * Proteção contra resposta duplamente serializada:
       * se o Code_API devolver uma string JSON dentro de outra string JSON,
       * removemos uma camada.
       */
      try {
        const parsed = JSON.parse(texto);
        return typeof parsed === 'string' ? parsed : texto;
      } catch (e) {
        return texto;
      }
    }

    case 'gomConsultarProtocoloEscolaV1Json':
      return GomAPI._getText_('consultarProtocolo', payload);

    case 'listarConfiguracoes':
    case 'obterConfiguracoes':
      return GomAPI._get_('listarConfiguracoes');

    // ─────────────────────────────────────────────
    // Escritas
    // ─────────────────────────────────────────────

    case 'atualizarChamadoWorkflow':
      return GomAPI._post_('atualizarChamado', payload);

    case 'gomAtualizarChamadosLoteV1': {
      const listaLote = typeof payload === 'string' ? JSON.parse(payload) : payload;
      return GomAPI._post_('atualizarLote', listaLote);
    }

    case 'salvarNovaSolicitacao':
      return GomAPI._post_('criarChamado', payload);

    case 'salvarSolicitacaoEscola':
      return GomAPI._post_('criarChamadoEscola', payload);

    case 'salvarEquipeDiaEmpresa':
      return GomAPI._post_('salvarEquipeDia', payload);

    case 'salvarEquipesDiaEmpresaLote':
    case 'salvarLoteEquipeDia':
      return GomAPI._post_('salvarLoteEquipeDia', payload);

    case 'salvarRespostaOrcamentoEmpresa':
      return GomAPI._post_('enviarOrcamento', payload);

    case 'salvarNovaEquipe':
      return GomAPI._post_('salvarEquipe', {
        nome: args[0],
        tipoEquipe: args[1] || 'secretaria'
      });

    case 'atualizarObra':
    case 'salvarObraModal':
      return GomAPI._post_('atualizarObra', payload);

    case 'salvarConfiguracoesTela':
    case 'salvarConfiguracao':
      return GomAPI._post_('salvarConfiguracoes', payload);

    case 'gomRegistrarComplementoEscolaV1Json':
      return GomAPI._post_('registrarComplemento', payload);

    default:
      throw new Error('Função GAS não mapeada na API: ' + nomeFuncao);
  }
}
