  window.alertasFiltroAtual = window.alertasFiltroAtual || 'todos';
  window.alertasConfiguracoesCarregadas = Boolean(window.alertasConfiguracoesCarregadas);

  function parseJsonAlertas_(res) {
    if (!res) return { ok: false, configuracoes: [] };
    if (typeof res === 'string') {
      try { return JSON.parse(res); }
      catch(e) { return { ok: false, erro: e.message, configuracoes: [] }; }
    }
    return res;
  }

  function getConfigAlerta_(chave, padrao) {
    const lista = Array.isArray(window.configuracoesGlobal) ? window.configuracoesGlobal : [];
    const item = lista.find(cfg => String(cfg.chave || '').trim() === chave);
    const valor = item ? String(item.valor == null ? '' : item.valor).trim() : '';
    return valor || padrao;
  }

  function getConfigNumeroAlerta_(chave, padrao) {
    const valor = Number(String(getConfigAlerta_(chave, padrao)).replace(',', '.'));
    return isNaN(valor) || valor < 0 ? Number(padrao || 0) : valor;
  }

  function configAtivaAlerta_(chave, padrao) {
    const valor = normalizarTextoBase(getConfigAlerta_(chave, padrao || 'SIM'));
    return valor !== 'nao' && valor !== 'não' && valor !== 'false' && valor !== '0';
  }

  function carregarConfiguracoesParaAlertas_(callback) {
    if (window.alertasConfiguracoesCarregadas || !google || !google.script || !google.script.run) {
      if (typeof callback === 'function') callback();
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        const payload = parseJsonAlertas_(res);
        if (payload && Array.isArray(payload.configuracoes)) window.configuracoesGlobal = payload.configuracoes;
        window.alertasConfiguracoesCarregadas = true;
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(err => {
        console.warn('[GOM ALERTAS] Não foi possível carregar configurações. Usando padrões.', err);
        window.alertasConfiguracoesCarregadas = true;
        if (typeof callback === 'function') callback();
      })
      .gomListarConfiguracoesWebV1Json();
  }

  function timestampChamado_(item) {
    const candidatos = [
      item && item.dataHoraUltimaAcao,
      item && item.dataHoraEntradaFila,
      item && item.dataEntradaFila,
      item && item.dataHora,
      item && item.data,
      item && item.dataRaw
    ];
    for (const valor of candidatos) {
      if (!valor) continue;
      if (typeof valor === 'number' && !isNaN(valor)) return valor;
      const direto = parseDataHoraBR(valor);
      if (direto) return direto;
      const data = new Date(String(valor));
      if (!isNaN(data.getTime())) return data.getTime();
    }
    return null;
  }

  function timestampPrevisto_(item) {
    const candidatos = [
      item && item.dataPrevistaConclusao,
      item && item.previsaoConclusao,
      item && item.dataPrevisao,
      item && item.prazoConclusao,
      item && item.prazo
    ];
    for (const valor of candidatos) {
      if (!valor) continue;
      if (typeof valor === 'number' && !isNaN(valor)) return valor;
      const br = parseDataHoraBR(valor);
      if (br) return br;
      const data = new Date(String(valor));
      if (!isNaN(data.getTime())) return data.getTime();
    }
    return null;
  }

  function diasDesde_(timestamp) {
    if (!timestamp) return null;
    const diff = Date.now() - timestamp;
    if (diff < 0) return 0;
    return Math.floor(diff / (24 * 60 * 60 * 1000));
  }

  function formatarDataAlerta_(timestamp) {
    if (!timestamp) return 'Sem data';
    const data = new Date(timestamp);
    if (isNaN(data.getTime())) return 'Sem data';
    const dd = String(data.getDate()).padStart(2, '0');
    const mm = String(data.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mm + '/' + data.getFullYear();
  }

  function criarAlerta_(dados) {
    return Object.assign({
      id: '',
      chamadoId: '',
      unidade: 'Unidade não informada',
      status: '',
      tipo: 'geral',
      grupo: 'Operacional',
      titulo: 'Alerta',
      descricao: '',
      acao: 'Verificar pendência.',
      severidade: 'media',
      cor: 'var(--orcamento)',
      icone: 'bi-exclamation-diamond-fill',
      dias: null,
      dataReferencia: '',
      item: null
    }, dados || {});
  }

  function calcularAlertas() {
    const chamados = Array.isArray(listaChamadosGlobal) ? listaChamadosGlobal : [];
    const alertas = [];

    const slaAnalise = getConfigNumeroAlerta_('SLA_ANALISE_DIAS', 3);
    const slaOrcamento = getConfigNumeroAlerta_('SLA_ORCAMENTO_DIAS', 5);
    const slaVisita = getConfigNumeroAlerta_('SLA_VISITA_DIAS', 3);
    const slaAprovacao = getConfigNumeroAlerta_('SLA_APROVACAO_DIAS', 2);
    const slaOs = getConfigNumeroAlerta_('SLA_OS_DIAS', 7);
    const slaFinalizacao = getConfigNumeroAlerta_('SLA_FINALIZACAO_DIAS', 2);

    chamados.forEach(item => {
      const st = normalizarSituacaoSistema(item.situacao || item.status);
      const id = String(item.id || '').trim();
      const unidade = item.unidade || 'Unidade não informada';
      const baseTs = timestampChamado_(item);
      const dias = diasDesde_(baseTs);
      const dataRef = formatarDataAlerta_(baseTs);
      const previsao = timestampPrevisto_(item);

      if (st === 'Em análise' && configAtivaAlerta_('ALERTA_ANALISE_PARADA_ATIVO', 'SIM') && dias !== null && dias >= slaAnalise) {
        alertas.push(criarAlerta_({
          id: 'analise-parada-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'analise-parada',
          grupo: 'Triagem',
          titulo: 'Chamado novo sem interação',
          descricao: 'O chamado está em análise há ' + dias + ' dia(s), acima do SLA configurado de ' + slaAnalise + ' dia(s).',
          acao: 'Avaliar a demanda e encaminhar para visita, orçamento, emergência ou devolução.',
          severidade: dias >= slaAnalise + 3 ? 'alta' : 'media',
          cor: 'var(--analise)',
          icone: 'bi-funnel-fill',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (st === 'OS emitida' && configAtivaAlerta_('ALERTA_OS_SEM_NUMERO_ATIVO', 'SIM') && !String(item.numeroOs || '').trim()) {
        alertas.push(criarAlerta_({
          id: 'os-sem-numero-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'os-sem-numero',
          grupo: 'OS',
          titulo: 'OS emitida sem numeração',
          descricao: 'A ordem de serviço foi liberada, mas o número da OS ainda não está preenchido.',
          acao: 'Abrir o chamado e preencher o número da OS para garantir rastreabilidade.',
          severidade: 'critica',
          cor: 'var(--emergencial)',
          icone: 'bi-file-earmark-x-fill',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (STATUS_CAMPO.includes(st) && configAtivaAlerta_('ALERTA_OS_SEM_PREVISAO_ATIVO', 'SIM') && !previsao) {
        alertas.push(criarAlerta_({
          id: 'os-sem-previsao-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'os-sem-previsao',
          grupo: 'Prazo',
          titulo: 'OS em campo sem previsão',
          descricao: 'A OS está em acompanhamento, mas não possui data prevista de conclusão.',
          acao: 'Solicitar à empresa ou registrar uma previsão para controle do prazo.',
          severidade: 'alta',
          cor: 'var(--os)',
          icone: 'bi-calendar-plus-fill',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (STATUS_CAMPO.includes(st) && configAtivaAlerta_('ALERTA_COBRANCA_CAMPO_ATIVO', 'SIM') && !item.temEquipeDiaValida) {
        alertas.push(criarAlerta_({
          id: 'sem-equipe-dia-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'sem-equipe-dia',
          grupo: 'Campo',
          titulo: 'Empresa sem equipe registrada hoje',
          descricao: 'A unidade está em atendimento, mas a equipe do dia ainda não foi informada no sistema.',
          acao: 'Cobrar o preenchimento diário da empresa ou registrar a equipe atuante.',
          severidade: 'critica',
          cor: 'var(--os)',
          icone: 'bi-people-fill',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (st === 'Solicitado Orçamento' && configAtivaAlerta_('ALERTA_ORCAMENTO_SEM_RETORNO_ATIVO', 'SIM') && dias !== null && dias >= slaOrcamento) {
        alertas.push(criarAlerta_({
          id: 'orcamento-sem-retorno-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'orcamento-sem-retorno',
          grupo: 'Orçamento',
          titulo: 'Orçamento solicitado sem retorno',
          descricao: 'O chamado está aguardando retorno da empresa além do prazo configurado de ' + slaOrcamento + ' dia(s).',
          acao: 'Verificar com a empresa o envio do orçamento ou registrar uma observação de acompanhamento.',
          severidade: dias >= slaOrcamento + 3 ? 'critica' : 'alta',
          cor: 'var(--orcamento)',
          icone: 'bi-clock-history',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (st === 'Orçamento Realizado' && configAtivaAlerta_('ALERTA_APROVACAO_PARADA_ATIVO', 'SIM') && dias !== null && dias >= slaAprovacao) {
        alertas.push(criarAlerta_({
          id: 'aprovacao-parada-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'aprovacao-parada',
          grupo: 'Aprovação',
          titulo: 'Orçamento aguardando aprovação',
          descricao: 'O orçamento já voltou da empresa e está aguardando decisão interna há ' + dias + ' dia(s).',
          acao: 'Aprovar, devolver para ajuste, negar ou registrar encaminhamento.',
          severidade: dias >= slaAprovacao + 3 ? 'critica' : 'alta',
          cor: 'var(--orcamento-realizado)',
          icone: 'bi-receipt-cutoff',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (st === 'Aguardando visita' && configAtivaAlerta_('ALERTA_VISITA_ATRASADA_ATIVO', 'SIM') && dias !== null && dias >= slaVisita) {
        alertas.push(criarAlerta_({
          id: 'visita-atrasada-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'visita-atrasada',
          grupo: 'Visita',
          titulo: 'Visita técnica aguardando há muitos dias',
          descricao: 'O chamado permanece aguardando visita acima do prazo configurado de ' + slaVisita + ' dia(s).',
          acao: 'Priorizar a visita ou encaminhar para orçamento/emergencial se a decisão já for possível.',
          severidade: dias >= slaVisita + 3 ? 'alta' : 'media',
          cor: 'var(--visita)',
          icone: 'bi-person-walking',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (st === 'Serviço Realizado' && configAtivaAlerta_('ALERTA_SERVICO_SEM_FINALIZACAO_ATIVO', 'SIM') && dias !== null && dias >= slaFinalizacao) {
        alertas.push(criarAlerta_({
          id: 'servico-sem-finalizacao-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'servico-sem-finalizacao',
          grupo: 'Finalização',
          titulo: 'Serviço realizado aguardando finalização',
          descricao: 'A empresa informou o serviço como realizado, mas a GOM ainda não finalizou o atendimento.',
          acao: 'Validar o serviço e encaminhar para o Memorial, ou devolver para nova ação.',
          severidade: dias >= slaFinalizacao + 3 ? 'alta' : 'media',
          cor: 'var(--servico-realizado)',
          icone: 'bi-clipboard2-check-fill',
          dias,
          dataReferencia: dataRef,
          item
        }));
      }

      if (previsao && STATUS_CAMPO.includes(st) && configAtivaAlerta_('ALERTA_PREVISAO_VENCIDA_ATIVO', 'SIM') && previsao < Date.now()) {
        const atraso = diasDesde_(previsao);
        alertas.push(criarAlerta_({
          id: 'previsao-vencida-' + id,
          chamadoId: id,
          unidade,
          status: st,
          tipo: 'previsao-vencida',
          grupo: 'Prazo',
          titulo: 'Previsão de conclusão vencida',
          descricao: 'A data prevista de conclusão foi ultrapassada.',
          acao: 'Atualizar a previsão, cobrar a empresa ou finalizar se o serviço já foi concluído.',
          severidade: 'critica',
          cor: 'var(--emergencial)',
          icone: 'bi-calendar-x-fill',
          dias: atraso,
          dataReferencia: formatarDataAlerta_(previsao),
          item
        }));
      }

      if (STATUS_CAMPO.includes(st) && dias !== null && dias >= slaOs && !previsao) {
        // Complemento de SLA geral de OS: só adiciona se ainda não houve alerta de ausência de previsão.
        const jaExiste = alertas.some(a => a.id === 'os-sem-previsao-' + id);
        if (!jaExiste) {
          alertas.push(criarAlerta_({
            id: 'os-sla-geral-' + id,
            chamadoId: id,
            unidade,
            status: st,
            tipo: 'os-sla-geral',
            grupo: 'OS',
            titulo: 'OS em acompanhamento acima do SLA',
            descricao: 'A OS está ativa há ' + dias + ' dia(s), acima do prazo de referência de ' + slaOs + ' dia(s).',
            acao: 'Verificar andamento, atualizar previsão e cobrar devolutiva da empresa.',
            severidade: 'alta',
            cor: 'var(--os)',
            icone: 'bi-stopwatch-fill',
            dias,
            dataReferencia: dataRef,
            item
          }));
        }
      }
    });

    return alertas.sort((a, b) => pesoSeveridade_(b.severidade) - pesoSeveridade_(a.severidade) || Number(b.dias || 0) - Number(a.dias || 0));
  }

  function pesoSeveridade_(sev) {
    if (sev === 'critica') return 3;
    if (sev === 'alta') return 2;
    if (sev === 'media') return 1;
    return 0;
  }

  function filtrarAlertas_(alertas) {
    const termoInput = document.getElementById('pesquisaAlertas');
    const termo = normalizarTextoBase(termoInput ? termoInput.value : '');
    const filtro = window.alertasFiltroAtual || 'todos';

    return (alertas || []).filter(a => {
      const porFiltro = filtro === 'todos' || a.severidade === filtro || a.grupo === filtro || a.tipo === filtro;
      const texto = normalizarTextoBase([a.titulo, a.descricao, a.acao, a.unidade, a.chamadoId, a.status, a.grupo, a.severidade].join(' '));
      return porFiltro && (!termo || texto.includes(termo));
    });
  }

  function contadorPor_(lista, fn) {
    return (lista || []).reduce((acc, item) => {
      const key = fn(item);
      acc[key] = (acc[key] || 0) + 1;
      return acc;
    }, {});
  }


  function renderizarResumoSlaAlertas_(alertas) {
    const box = document.getElementById('alertasSlaResumo');
    if (!box) return;

    const regras = [
      { chave: 'SLA_ANALISE_DIAS', label: 'Análise', valor: getConfigNumeroAlerta_('SLA_ANALISE_DIAS', 3), icon: 'bi-funnel-fill' },
      { chave: 'SLA_VISITA_DIAS', label: 'Visita', valor: getConfigNumeroAlerta_('SLA_VISITA_DIAS', 3), icon: 'bi-person-walking' },
      { chave: 'SLA_ORCAMENTO_DIAS', label: 'Orçamento', valor: getConfigNumeroAlerta_('SLA_ORCAMENTO_DIAS', 5), icon: 'bi-cash-coin' },
      { chave: 'SLA_APROVACAO_DIAS', label: 'Aprovação', valor: getConfigNumeroAlerta_('SLA_APROVACAO_DIAS', 2), icon: 'bi-clipboard2-check' },
      { chave: 'SLA_OS_DIAS', label: 'OS', valor: getConfigNumeroAlerta_('SLA_OS_DIAS', 7), icon: 'bi-file-earmark-check' },
      { chave: 'SLA_FINALIZACAO_DIAS', label: 'Finalização', valor: getConfigNumeroAlerta_('SLA_FINALIZACAO_DIAS', 2), icon: 'bi-check2-circle' }
    ];

    const criticos = (alertas || []).filter(a => a.severidade === 'critica').length;
    const altas = (alertas || []).filter(a => a.severidade === 'alta').length;

    box.innerHTML = [
      '<div class="alertas-sla-head">',
        '<div><strong><i class="bi bi-stopwatch me-1"></i>Controle de SLA ativo</strong><span>Prazos puxados da tela Configurações. Ajuste os dias sem alterar código.</span></div>',
        '<button class="btn btn-light border fw-bold btn-sm" onclick="loadPage(&quot;configuracoes&quot;)"><i class="bi bi-sliders me-1"></i>Ajustar SLA</button>',
      '</div>',
      '<div class="alertas-sla-grid">',
        regras.map(r => '<div class="alertas-sla-pill"><i class="bi ' + r.icon + '"></i><span>' + escapeHtml(r.label) + '</span><strong>' + escapeHtml(r.valor) + 'd</strong></div>').join(''),
      '</div>',
      '<div class="alertas-sla-foot"><span><b>' + criticos + '</b> crítico(s)</span><span><b>' + altas + '</b> alta prioridade</span><span>Use os cards abaixo para filtrar o radar.</span></div>'
    ].join('');
  }


  function renderizarKpisAlertas_(alertas) {
    const grid = document.getElementById('alertasKpis');
    if (!grid) return;

    const porGrupo = contadorPor_(alertas, a => a.grupo);
    const criticos = alertas.filter(a => a.severidade === 'critica').length;
    const altas = alertas.filter(a => a.severidade === 'alta').length;

    const cards = [
      { filtro: 'todos', titulo: 'Total de alertas', valor: alertas.length, cor: 'var(--primary)', icon: 'bi-exclamation-diamond-fill', desc: 'Todas as pendências encontradas automaticamente no fluxo.' },
      { filtro: 'critica', titulo: 'Críticos', valor: criticos, cor: 'var(--emergencial)', icon: 'bi-exclamation-triangle-fill', desc: 'Pendências que podem comprometer rastreabilidade, prazo ou operação diária.' },
      { filtro: 'alta', titulo: 'Alta prioridade', valor: altas, cor: 'var(--orcamento)', icon: 'bi-clock-history', desc: 'Itens parados acima do prazo configurado.' },
      { filtro: 'Campo', titulo: 'Campo', valor: porGrupo.Campo || 0, cor: 'var(--os)', icon: 'bi-geo-alt-fill', desc: 'Unidades em atendimento sem informação diária da equipe.' },
      { filtro: 'Orçamento', titulo: 'Orçamentos', valor: porGrupo.Orçamento || 0, cor: 'var(--orcamento)', icon: 'bi-cash-coin', desc: 'Orçamentos solicitados que ainda não retornaram.' },
      { filtro: 'Aprovação', titulo: 'Aprovações', valor: porGrupo.Aprovação || 0, cor: 'var(--orcamento-realizado)', icon: 'bi-receipt-cutoff', desc: 'Orçamentos realizados aguardando decisão interna.' }
    ];

    grid.innerHTML = cards
      .filter(c => Number(c.valor) > 0 || c.filtro === 'todos')
      .map(renderKpiAlerta_)
      .join('');
  }

  function renderKpiAlerta_(card) {
    const ativo = (window.alertasFiltroAtual || 'todos') === card.filtro;
    return `
      <div class="kpi-box ${ativo ? 'ativo' : ''}" style="--kpi-color:${card.cor};" onclick="filtrarAlertas('${escapeJsAttr(card.filtro)}')" title="${escapeHtml(card.desc)}" aria-label="${escapeHtml(card.titulo)}: ${escapeHtml(card.desc)}">
        <div class="kpi-box-head"><span class="kpi-icon"><i class="bi ${card.icon}"></i></span><span class="kpi-pulse"></span></div>
        <div class="kpi-title">${escapeHtml(card.titulo)}</div>
        <div class="kpi-value-row"><div class="kpi-value">${escapeHtml(card.valor)}</div><span class="kpi-caption">alertas</span></div>
        <div class="kpi-help">${escapeHtml(card.desc)}</div>
      </div>`;
  }

  function renderizarFiltrosAlertas_(alertas) {
    const el = document.getElementById('alertasFiltros');
    if (!el) return;
    const porGrupo = contadorPor_(alertas, a => a.grupo);
    const filtros = [
      ['todos', 'Todos', alertas.length],
      ['critica', 'Críticos', alertas.filter(a => a.severidade === 'critica').length],
      ['alta', 'Alta prioridade', alertas.filter(a => a.severidade === 'alta').length],
      ['Campo', 'Campo', porGrupo.Campo || 0],
      ['OS', 'OS', porGrupo.OS || 0],
      ['Orçamento', 'Orçamento', porGrupo.Orçamento || 0],
      ['Aprovação', 'Aprovação', porGrupo.Aprovação || 0],
      ['Visita', 'Visita', porGrupo.Visita || 0],
      ['Finalização', 'Finalização', porGrupo.Finalização || 0],
      ['Prazo', 'Prazo', porGrupo.Prazo || 0]
    ].filter(f => f[2] > 0 || f[0] === 'todos');

    el.innerHTML = filtros.map(f => {
      const ativo = (window.alertasFiltroAtual || 'todos') === f[0];
      return `<button class="alerta-filter ${ativo ? 'ativo' : ''}" onclick="filtrarAlertas('${escapeJsAttr(f[0])}')">${escapeHtml(f[1])}<span>${escapeHtml(f[2])}</span></button>`;
    }).join('');
  }

  function renderizarListaAlertas_(lista) {
    if (!lista.length) {
      return '<div class="empty-state"><h5>Nenhuma pendência encontrada</h5><p>Não há alertas para o filtro atual. Isso indica que os fluxos configurados estão sem travamentos aparentes.</p></div>';
    }

    return lista.map(a => `
      <div class="alerta-row alerta-${escapeHtml(a.severidade)}" style="--alerta-cor:${escapeHtml(a.cor)};">
        <div class="alerta-row-icon"><i class="bi ${escapeHtml(a.icone)}"></i></div>
        <div class="alerta-row-main">
          <div class="alerta-row-top">
            <span class="alerta-sev">${escapeHtml(labelSeveridade_(a.severidade))}</span>
            <span class="alerta-grupo">${escapeHtml(a.grupo)}</span>
            <span class="alerta-id">#${escapeHtml(a.chamadoId || '-')}</span>
          </div>
          <h5>${escapeHtml(a.titulo)}</h5>
          <div class="alerta-unidade"><i class="bi bi-building me-1"></i>${escapeHtml(a.unidade)}</div>
          <p>${escapeHtml(a.descricao)}</p>
          <div class="alerta-acao"><strong>Ação recomendada:</strong> ${escapeHtml(a.acao)}</div>
        </div>
        <div class="alerta-row-meta">
          <span class="status-pill"><span class="status-dot"></span>${escapeHtml(a.status || '-')}</span>
          <div class="alerta-data"><strong>${escapeHtml(a.dias == null ? '-' : a.dias + 'd')}</strong><span>desde ${escapeHtml(a.dataReferencia || 'sem data')}</span></div>
          <button class="btn btn-primary btn-sm fw-bold" onclick="abrirModalAnalise('${escapeJsAttr(a.chamadoId)}')"><i class="bi bi-box-arrow-up-right me-1"></i>Abrir</button>
        </div>
      </div>`).join('');
  }

  function labelSeveridade_(sev) {
    if (sev === 'critica') return 'Crítico';
    if (sev === 'alta') return 'Alta prioridade';
    if (sev === 'media') return 'Atenção';
    return 'Informativo';
  }

  window.filtrarAlertas = function(filtro) {
    window.alertasFiltroAtual = filtro || 'todos';
    renderizarAlertas();
  };

  window.renderizarAlertas = function() {
    const painel = document.getElementById('painelDados');
    const contador = document.getElementById('contadorAlertas');
    if (!painel) return;

    const todos = calcularAlertas();
    window.alertasGlobal = todos;
    const filtrados = filtrarAlertas_(todos);

    renderizarResumoSlaAlertas_(todos);
    renderizarKpisAlertas_(todos);
    renderizarFiltrosAlertas_(todos);
    if (contador) contador.innerText = filtrados.length + ' alertas';
    painel.innerHTML = renderizarListaAlertas_(filtrados);
  };


  function parseJsonCobrancaAlertas_(res) {
    if (!res) return { ok: false, erro: 'Resposta vazia.' };
    if (typeof res === 'string') {
      try { return JSON.parse(res); }
      catch(e) { return { ok: false, erro: 'JSON inválido: ' + e.message }; }
    }
    return res;
  }

  function prepararCobrancaEmpresaAlertas(botao) {
    if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Gerando prévia...');
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        const payload = parseJsonCobrancaAlertas_(res);
        renderPreviewCobrancaAlertas(payload);
      })
      .withFailureHandler(function(err) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível gerar a prévia da cobrança.');
        else alert((err && err.message) || err);
      })
      .gomGerarPreviewCobrancaEmpresaV1Json();
  }

  function enviarCobrancaEmpresaAlertas(botao) {
    if (!confirm('Enviar cobrança consolidada para a empresa agora?')) return;
    if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Enviando...');
    google.script.run
      .withSuccessHandler(function(res) {
        const payload = parseJsonCobrancaAlertas_(res);
        if (!payload.ok) {
          if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
          alert(payload.erro || 'Não foi possível enviar a cobrança.');
          renderPreviewCobrancaAlertas(payload);
          return;
        }
        if (typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Enviado');
        renderPreviewCobrancaAlertas(payload);
        alert('Cobrança enviada com sucesso. Total de pendências: ' + (payload.total || 0));
      })
      .withFailureHandler(function(err) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível enviar a cobrança.');
        else alert((err && err.message) || err);
      })
      .gomEnviarCobrancaPendenciasEmpresaV1Json();
  }

  function ativarCobrancaDiariaEmpresa(botao) {
    if (!confirm('Ativar/atualizar cobrança automática diária da empresa às 11h?')) return;
    if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Ativando...');
    google.script.run
      .withSuccessHandler(function(res) {
        const payload = parseJsonCobrancaAlertas_(res);
        if (!payload.ok) {
          if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
          alert(payload.erro || 'Não foi possível ativar o agendamento.');
          return;
        }
        if (typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Ativado');
        alert('Cobrança automática diária ativada/atualizada para 11h.');
      })
      .withFailureHandler(function(err) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível ativar o agendamento.');
        else alert((err && err.message) || err);
      })
      .gomCriarTriggerCobrancaPendenciasEmpresaV1Json();
  }

  function renderPreviewCobrancaAlertas(payload) {
    const box = document.getElementById('alertasCobrancaPreview');
    if (!box) return;

    if (!payload || !payload.ok) {
      box.innerHTML = '<div class="alertas-cobranca-error"><i class="bi bi-exclamation-triangle me-1"></i>' + escapeHtml((payload && payload.erro) || 'Não foi possível carregar a prévia.') + '</div>';
      return;
    }

    const grupos = payload.grupos || {};
    const linhas = payload.pendencias || [];
    if (!linhas.length) {
      box.innerHTML = '<div class="alertas-cobranca-empty"><i class="bi bi-check2-circle me-1"></i>Nenhuma pendência de cobrança encontrada para a empresa.</div>';
      return;
    }

    const gruposHtml = Object.keys(grupos).map(function(chave) {
      return '<span><strong>' + escapeHtml(grupos[chave]) + '</strong>' + escapeHtml(chave) + '</span>';
    }).join('');

    const linhasHtml = linhas.slice(0, 10).map(function(p) {
      return '<tr><td>#' + escapeHtml(p.id || '') + '</td><td>' + escapeHtml(p.unidade || '') + '</td><td>' + escapeHtml(p.tipo || '') + '</td><td>' + escapeHtml(p.dias || '-') + '</td></tr>';
    }).join('');

    box.innerHTML = [
      '<div class="alertas-cobranca-resumo">',
        '<div><strong>' + escapeHtml(payload.total || 0) + '</strong><span>pendência(s) na cobrança</span></div>',
        '<div><strong>' + escapeHtml(payload.emailDestino || 'Sem e-mail') + '</strong><span>destinatário</span></div>',
        payload.cc ? '<div><strong>' + escapeHtml(payload.cc) + '</strong><span>cópia</span></div>' : '',
      '</div>',
      '<div class="alertas-cobranca-grupos">' + gruposHtml + '</div>',
      '<div class="table-responsive mt-2"><table class="table table-sm table-hover align-middle mb-0 alertas-cobranca-table">',
        '<thead><tr><th>ID</th><th>Unidade</th><th>Pendência</th><th>Dias</th></tr></thead>',
        '<tbody>' + linhasHtml + '</tbody>',
      '</table></div>',
      linhas.length > 10 ? '<div class="alertas-cobranca-more">Exibindo 10 de ' + linhas.length + ' pendências. O e-mail contém a relação consolidada.</div>' : ''
    ].join('');
  }

  window.prepararCobrancaEmpresaAlertas = prepararCobrancaEmpresaAlertas;
  window.enviarCobrancaEmpresaAlertas = enviarCobrancaEmpresaAlertas;
  window.ativarCobrancaDiariaEmpresa = ativarCobrancaDiariaEmpresa;
  window.renderPreviewCobrancaAlertas = renderPreviewCobrancaAlertas;


  window.calcularAlertasSistema = calcularAlertas;
  window.getConfigNumeroAlertaSistema = getConfigNumeroAlerta_;
  window.configAtivaAlertaSistema = configAtivaAlerta_;

  window.inicializarAlertas = function(forcar) {
    const painel = document.getElementById('painelDados');
    if (painel && !dadosCarregados) painel.innerHTML = '<div class="empty-state"><div class="spinner-border text-primary"></div><p class="mt-3 fw-bold">Carregando chamados para calcular alertas...</p></div>';

    carregarConfiguracoesParaAlertas_(function() {
      if (!dadosCarregados || forcar) {
        carregarChamados({
          renderizar: false,
          forcar: Boolean(forcar),
          callback: function() { renderizarAlertas(); }
        });
      } else {
        renderizarAlertas();
      }
    });
  };
})();

  </script>

  <!-- Scripts_Relatorios.html -->
  <script>
window.relatoriosCharts = window.relatoriosCharts || {};
window.relatoriosTabAtual = window.relatoriosTabAtual || 'visao';

function inicializarRelatorios(forcar) {
  const painel = document.getElementById('relatoriosKpis');
  if (painel) painel.innerHTML = '<div class="empty-state relatorios-loading"><div class="spinner-border text-primary"></div><p class="mt-3 fw-bold">Carregando relatórios...</p></div>';

  function carregarObrasDepois() {
    if (!window.obrasCarregadas || forcar) {
      carregarObras({
        renderizar: false,
        forcar: Boolean(forcar),
        callback: function() { renderRelatorios(); }
      });
    } else {
      renderRelatorios();
    }
  }

  if (!window.dadosCarregados || forcar) {
    carregarChamados({
      renderizar: false,
      forcar: Boolean(forcar),
      callback: function() { carregarObrasDepois(); }
    });
  } else {
    carregarObrasDepois();
  }
}

function setRelatorioTab(tab, botao) {
  window.relatoriosTabAtual = tab || 'visao';
  document.querySelectorAll('.relatorio-tab').forEach(function(btn) { btn.classList.remove('active'); });
  if (botao) botao.classList.add('active');
  else {
    const btnAuto = document.querySelector('[data-rel-tab="' + window.relatoriosTabAtual + '"]');
    if (btnAuto) btnAuto.classList.add('active');
  }

  document.querySelectorAll('.relatorio-tab-pane').forEach(function(pane) { pane.classList.remove('active'); });
  const alvo = document.getElementById('relatorioTab' + capitalizarRelatorio(window.relatoriosTabAtual));
  if (alvo) alvo.classList.add('active');

  if (window.relatoriosTabAtual === 'graficos') {
    setTimeout(function() { renderRelatoriosGraficos(); }, 80);
  }
}

function capitalizarRelatorio(valor) {
  valor = String(valor || '');
  return valor.charAt(0).toUpperCase() + valor.slice(1);
}

function renderRelatorios() {
  if (window.telaAtual !== 'relatorios') return;

  const chamados = filtrarRelatoriosChamados(window.listaChamadosGlobal || []);
  const obras = filtrarRelatoriosObras(window.listaObrasGlobal || []);
  window.relatoriosListaAtual = chamados.slice();
  window.relatoriosObrasAtual = obras.slice();

  popularFiltrosRelatorios(window.listaChamadosGlobal || []);
  renderRelatoriosKpis(chamados, obras);
  renderRelatorioStatusBars(chamados);
  renderRelatorioFunil(chamados);
  renderRelatorioRankingUnidades(chamados);
  renderRelatorioTempoEtapa(chamados);
  renderRelatorioOrcamentosMes(chamados);
  renderRelatorioFinalizadosMes(chamados);
  renderRelatorioTipos(chamados);
  renderRelatorioObrasStatus(obras);
  setRelatorioTab(window.relatoriosTabAtual || 'visao');
}

function renderRelatoriosGraficos() {
  const chamados = window.relatoriosListaAtual || [];
  const obras = window.relatoriosObrasAtual || [];

  const fallback = document.getElementById('relatoriosChartFallback');
  if (typeof Chart === 'undefined') {
    if (fallback) fallback.innerHTML = '<div class="alert alert-warning fw-bold mb-0"><i class="bi bi-exclamation-triangle me-1"></i>Não foi possível carregar a biblioteca de gráficos. A visão em barras/tabelas continua disponível nas outras abas.</div>';
    return;
  }
  if (fallback) fallback.innerHTML = '';

  const statusMap = contarPorRelatorio(chamados, c => normalizarSituacaoSistema(c.situacao || c.status));
  const tiposMap = contarPorRelatorio(chamados, c => String(c.tipo || 'Sem tipo').trim());
  const topUnidadesMap = contarPorRelatorio(chamados, c => String(c.unidade || 'Unidade não informada').trim());
  const orcamentosMap = agruparOrcamentosPorMesRelatorio(chamados);
  const finalizadosMap = agruparFinalizadosPorMesRelatorio(chamados);
  const obrasMap = contarPorRelatorio(obras, c => String(c.status || c.situacao || 'Sem status').trim());

  criarGraficoRelatorio('chartStatusChamados', 'doughnut', statusMap, {
    label: 'Chamados',
    coresPorChave: getCorStatus,
    legenda: true
  });

  criarGraficoRelatorio('chartTiposChamados', 'doughnut', limitarMapaRelatorio(tiposMap, 8), {
    label: 'Tipos',
    paleta: paletaRelatorios(),
    legenda: true
  });

  criarGraficoRelatorio('chartTopUnidades', 'bar', limitarMapaRelatorio(topUnidadesMap, 10), {
    label: 'Chamados',
    horizontal: true,
    paleta: ['#002b5e']
  });

  criarGraficoRelatorio('chartOrcamentosMes', 'bar', ordenarMapaMesRelatorio(orcamentosMap, 8), {
    label: 'Orçamentos',
    paleta: ['#fb923c']
  });

  criarGraficoRelatorio('chartFinalizadosMes', 'line', ordenarMapaMesRelatorio(finalizadosMap, 8), {
    label: 'Finalizações',
    paleta: ['#22c55e']
  });

  criarGraficoRelatorio('chartObrasStatus', 'bar', limitarMapaRelatorio(obrasMap, 10), {
    label: 'Obras',
    horizontal: true,
    coresPorChave: corObraRelatorio
  });
}

function criarGraficoRelatorio(canvasId, tipo, mapa, opcoes) {
  opcoes = opcoes || {};
  const canvas = document.getElementById(canvasId);
  if (!canvas || typeof Chart === 'undefined') return;

  const ctx = canvas.getContext('2d');
  if (window.relatoriosCharts[canvasId]) {
    try { window.relatoriosCharts[canvasId].destroy(); } catch(e) {}
  }

  const labels = Object.keys(mapa || {});
  const valores = labels.map(k => Number(mapa[k] || 0));
  const labelsFormatadas = labels.map(k => /^\d{4}-\d{2}$/.test(k) ? formatarMesRelatorio(k) : k);

  if (!labels.length) {
    const box = canvas.closest('.chart-shell');
    if (box) box.classList.add('chart-empty');
    return;
  } else {
    const box = canvas.closest('.chart-shell');
    if (box) box.classList.remove('chart-empty');
  }

  const cores = labels.map(function(k, idx) {
    if (typeof opcoes.coresPorChave === 'function') return opcoes.coresPorChave(k);
    const paleta = opcoes.paleta || paletaRelatorios();
    return paleta[idx % paleta.length];
  });

  const chartType = tipo === 'bar' && opcoes.horizontal ? 'bar' : tipo;
  const config = {
    type: chartType,
    data: {
      labels: labelsFormatadas,
      datasets: [{
        label: opcoes.label || 'Total',
        data: valores,
        backgroundColor: tipo === 'line' ? 'rgba(34, 197, 94, .14)' : cores,
        borderColor: tipo === 'line' ? (opcoes.paleta && opcoes.paleta[0] || '#22c55e') : cores,
        borderWidth: tipo === 'line' ? 3 : 1.5,
        tension: .36,
        fill: tipo === 'line',
        pointRadius: tipo === 'line' ? 4 : 0,
        pointHoverRadius: tipo === 'line' ? 6 : 0,
        borderRadius: tipo === 'bar' ? 10 : 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: opcoes.horizontal ? 'y' : 'x',
      plugins: {
        legend: {
          display: Boolean(opcoes.legenda),
          position: 'bottom',
          labels: {
            usePointStyle: true,
            boxWidth: 9,
            font: { weight: '700' }
          }
        },
        tooltip: {
          backgroundColor: '#0f172a',
          titleFont: { weight: '800' },
          bodyFont: { weight: '700' },
          padding: 10
        }
      },
      scales: tipo === 'doughnut' ? {} : {
        x: {
          beginAtZero: true,
          grid: { color: 'rgba(148,163,184,.22)' },
          ticks: { font: { weight: '700' } }
        },
        y: {
          beginAtZero: true,
          grid: { display: !opcoes.horizontal, color: 'rgba(148,163,184,.18)' },
          ticks: { font: { weight: '700' } }
        }
      }
    }
  };

  window.relatoriosCharts[canvasId] = new Chart(ctx, config);
}

function paletaRelatorios() {
  return ['#002b5e', '#00e5ff', '#f59e0b', '#22c55e', '#fb923c', '#14b8a6', '#6366f1', '#ec4899', '#84cc16', '#475569'];
}

function filtrarRelatoriosChamados(lista) {
  const termo = normalizarTextoBase(document.getElementById('relatorioBusca') ? document.getElementById('relatorioBusca').value : '');
  const mes = document.getElementById('relatorioMes') ? document.getElementById('relatorioMes').value : '';
  const status = document.getElementById('relatorioStatus') ? document.getElementById('relatorioStatus').value : '';
  const tipo = document.getElementById('relatorioTipo') ? document.getElementById('relatorioTipo').value : '';

  return (lista || []).filter(function(item) {
    const st = normalizarSituacaoSistema(item.situacao || item.status);
    if (status && st !== status) return false;
    if (tipo && String(item.tipo || '') !== tipo) return false;

    if (mes) {
      const dt = parseDataRelatorio(item.dataHora || item.data || item.dataRaw || item.dataConclusaoOs || item.dataConclusao || item.dataHoraUltimaAcao);
      if (!dt || getAnoMesRelatorio(dt) !== mes) return false;
    }

    if (!termo) return true;
    const texto = normalizarTextoBase([
      item.id, item.unidade, item.numeroOs, item.tipo, st, item.detalhamento,
      item.observacoes, item.equipe, item.valorOrcamento
    ].join(' '));
    return texto.includes(termo);
  });
}

function filtrarRelatoriosObras(lista) {
  const termo = normalizarTextoBase(document.getElementById('relatorioBusca') ? document.getElementById('relatorioBusca').value : '');
  if (!termo) return Array.isArray(lista) ? lista : [];
  return (lista || []).filter(function(item) {
    const texto = normalizarTextoBase([
      item.id, item.unidade, item.escola, item.status, item.situacao, item.tipo,
      item.descricao, item.detalhamento, item.responsavel
    ].join(' '));
    return texto.includes(termo);
  });
}

function popularFiltrosRelatorios(lista) {
  preencherSelectRelatorio('relatorioStatus', coletarValoresRelatorio(lista, function(item) {
    return normalizarSituacaoSistema(item.situacao || item.status);
  }), 'Todos os status');

  preencherSelectRelatorio('relatorioTipo', coletarValoresRelatorio(lista, function(item) {
    return String(item.tipo || '').trim();
  }), 'Todos os tipos');

  preencherSelectRelatorio('relatorioMes', coletarMesesRelatorio(lista), 'Todos os meses', formatarMesRelatorio);
}

function preencherSelectRelatorio(id, valores, labelTodos, formatador) {
  const el = document.getElementById(id);
  if (!el) return;
  const atual = el.value || '';
  el.innerHTML = '<option value="">' + escapeHtml(labelTodos || 'Todos') + '</option>' +
    (valores || []).map(function(v) {
      return '<option value="' + escapeHtml(v) + '">' + escapeHtml(formatador ? formatador(v) : v) + '</option>';
    }).join('');
  if (atual && valores.indexOf(atual) >= 0) el.value = atual;
}

function coletarValoresRelatorio(lista, getter) {
  const mapa = {};
  (lista || []).forEach(function(item) {
    const v = getter(item);
    if (v) mapa[v] = true;
  });
  return Object.keys(mapa).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
}

function coletarMesesRelatorio(lista) {
  const mapa = {};
  (lista || []).forEach(function(item) {
    const d = parseDataRelatorio(item.dataHora || item.data || item.dataRaw || item.dataConclusaoOs || item.dataConclusao || item.dataHoraUltimaAcao);
    if (d) mapa[getAnoMesRelatorio(d)] = true;
  });
  return Object.keys(mapa).sort().reverse();
}

function renderRelatoriosKpis(chamados, obras) {
  const box = document.getElementById('relatoriosKpis');
  if (!box) return;

  const ativos = (chamados || []).filter(function(c) {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    return ['Em análise','Aguardando visita','Solicitado Orçamento','Orçamento Realizado','OS emitida','Atendimento Emergencial','Garantia de Obra','Serviço Realizado'].indexOf(st) >= 0;
  });

  const concluidos = (chamados || []).filter(function(c) {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    return ['Concluído','A cargo da unidade escolar','Devolvido para a escola','Duplicado','Encaminhado para outra gerência ou Unidade escolar.'].indexOf(st) >= 0;
  });

  const comOs = (chamados || []).filter(c => String(c.numeroOs || '').trim()).length;
  const comOrcamento = (chamados || []).filter(c => String(c.valorOrcamento || '').trim()).length;
  const tempoMedio = calcularTempoMedioRelatorio(chamados);

  const cards = [
    { label: 'Chamados filtrados', valor: chamados.length, desc: 'Registros dentro dos filtros atuais', icon: 'bi-collection', cor: 'var(--primary)' },
    { label: 'Ativos no fluxo', valor: ativos.length, desc: 'Ainda em acompanhamento operacional', icon: 'bi-activity', cor: 'var(--orcamento)' },
    { label: 'Encerrados', valor: concluidos.length, desc: 'Memorial e saídas finais', icon: 'bi-check2-circle', cor: 'var(--concluido)' },
    { label: 'Com OS', valor: comOs, desc: 'Registros com número de ordem', icon: 'bi-file-earmark-check', cor: 'var(--os)' },
    { label: 'Com orçamento', valor: comOrcamento, desc: 'Registros com valor informado', icon: 'bi-cash-coin', cor: 'var(--orcamento-realizado)' },
    { label: 'Tempo médio', valor: tempoMedio, desc: 'Abertura até conclusão/última ação', icon: 'bi-stopwatch', cor: 'var(--visita)' },
    { label: 'Obras', valor: obras.length, desc: 'Obras cadastradas filtradas', icon: 'bi-buildings', cor: 'var(--obras)' },
    { label: 'Alertas atuais', valor: typeof calcularAlertasSistema === 'function' ? calcularAlertasSistema().length : '-', desc: 'Radar operacional integrado', icon: 'bi-exclamation-triangle', cor: 'var(--emergencial)' }
  ];

  box.innerHTML = cards.map(function(c) {
    return '<div class="relatorio-kpi" style="--rel-color:' + c.cor + ';">' +
      '<span class="relatorio-kpi-icon"><i class="bi ' + c.icon + '"></i></span>' +
      '<span class="relatorio-kpi-label">' + escapeHtml(c.label) + '</span>' +
      '<strong>' + escapeHtml(c.valor) + '</strong>' +
      '<small>' + escapeHtml(c.desc) + '</small>' +
    '</div>';
  }).join('');
}

function renderRelatorioStatusBars(chamados) {
  const ordem = ['Em análise','Aguardando visita','Solicitado Orçamento','Orçamento Realizado','OS emitida','Atendimento Emergencial','Garantia de Obra','Serviço Realizado','Concluído','Devolvido para a escola','A cargo da unidade escolar','Duplicado'];
  renderBarrasRelatorio('relatorioStatusBars', contarPorRelatorio(chamados, c => normalizarSituacaoSistema(c.situacao || c.status)), ordem, getCorStatus);
}

function renderRelatorioFunil(chamados) {
  const etapas = [
    ['Em análise', 'Triagem'],
    ['Aguardando visita', 'Visita'],
    ['Solicitado Orçamento', 'Orçamento'],
    ['Orçamento Realizado', 'Aprovação'],
    ['OS emitida', 'OS'],
    ['Serviço Realizado', 'Validação'],
    ['Concluído', 'Concluído']
  ];
  const cont = contarPorRelatorio(chamados, c => normalizarSituacaoSistema(c.situacao || c.status));
  const total = Math.max(1, Math.max.apply(null, etapas.map(e => cont[e[0]] || 0)));
  const html = etapas.map(function(e) {
    const valor = cont[e[0]] || 0;
    const largura = Math.max(9, Math.round((valor / total) * 100));
    return '<div class="relatorio-funnel-row" style="--funnel-color:' + getCorStatus(e[0]) + '; --funnel-width:' + largura + '%;">' +
      '<span>' + escapeHtml(e[1]) + '</span><strong>' + valor + '</strong><div><em></em></div>' +
    '</div>';
  }).join('');
  const box = document.getElementById('relatorioFunil');
  if (box) box.innerHTML = html || vazioRelatorio('Sem dados para o funil.');
}

function renderRelatorioRankingUnidades(chamados) {
  const mapa = contarPorRelatorio(chamados, c => String(c.unidade || 'Unidade não informada').trim());
  renderRankingRelatorio('relatorioRankingUnidades', mapa, 8);
}

function renderRelatorioTempoEtapa(chamados) {
  const grupos = {};
  (chamados || []).forEach(function(c) {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    const dias = calcularDiasRelatorio(c);
    if (dias == null) return;
    if (!grupos[st]) grupos[st] = [];
    grupos[st].push(dias);
  });
  const medias = {};
  Object.keys(grupos).forEach(function(k) {
    const arr = grupos[k];
    medias[k] = Math.round(arr.reduce((a,b) => a + b, 0) / arr.length);
  });
  renderRankingRelatorio('relatorioTempoEtapa', medias, 8, function(v) { return v + 'd'; });
}

function agruparOrcamentosPorMesRelatorio(chamados) {
  const filtrados = (chamados || []).filter(c => String(c.valorOrcamento || '').trim());
  return contarPorRelatorio(filtrados, c => {
    const d = parseDataRelatorio(c.dataHoraUltimaAcao || c.dataHoraEncaminhamento || c.dataHora || c.data);
    return d ? getAnoMesRelatorio(d) : 'Sem data';
  });
}

function agruparFinalizadosPorMesRelatorio(chamados) {
  const filtrados = (chamados || []).filter(c => ['Concluído','Serviço Realizado'].indexOf(normalizarSituacaoSistema(c.situacao || c.status)) >= 0);
  return contarPorRelatorio(filtrados, c => {
    const d = parseDataRelatorio(c.dataConclusaoOs || c.dataConclusao || c.dataHoraUltimaAcao || c.dataHora || c.data);
    return d ? getAnoMesRelatorio(d) : 'Sem data';
  });
}

function renderRelatorioOrcamentosMes(chamados) {
  const mapa = agruparOrcamentosPorMesRelatorio(chamados);
  renderBarrasRelatorio('relatorioOrcamentosMes', mapa, Object.keys(mapa).sort().slice(-8), () => 'var(--orcamento)');
}

function renderRelatorioFinalizadosMes(chamados) {
  const mapa = agruparFinalizadosPorMesRelatorio(chamados);
  renderBarrasRelatorio('relatorioFinalizadosMes', mapa, Object.keys(mapa).sort().slice(-8), () => 'var(--concluido)');
}

function renderRelatorioTipos(chamados) {
  const mapa = contarPorRelatorio(chamados, c => String(c.tipo || 'Sem tipo').trim());
  renderBarrasRelatorio('relatorioTipos', mapa, Object.keys(mapa).sort((a,b) => mapa[b]-mapa[a]).slice(0, 8), () => 'var(--primary)');
}

function renderRelatorioObrasStatus(obras) {
  const mapa = contarPorRelatorio(obras, c => String(c.status || c.situacao || 'Sem status').trim());
  renderBarrasRelatorio('relatorioObrasStatus', mapa, Object.keys(mapa).sort((a,b) => mapa[b]-mapa[a]).slice(0, 8), corObraRelatorio);
}

function renderBarrasRelatorio(id, mapa, ordem, corFn) {
  const box = document.getElementById(id);
  if (!box) return;
  const chaves = (ordem || Object.keys(mapa)).filter(k => mapa[k]);
  if (!chaves.length) {
    box.innerHTML = vazioRelatorio('Sem dados para exibir.');
    return;
  }
  const max = Math.max(1, Math.max.apply(null, chaves.map(k => mapa[k] || 0)));
  box.innerHTML = chaves.map(function(k) {
    const valor = mapa[k] || 0;
    const largura = Math.max(4, Math.round((valor / max) * 100));
    const label = /^\d{4}-\d{2}$/.test(k) ? formatarMesRelatorio(k) : k;
    return '<div class="relatorio-bar-row">' +
      '<div class="relatorio-bar-label" title="' + escapeHtml(label) + '"><span style="background:' + corFn(k) + ';"></span>' + escapeHtml(label) + '</div>' +
      '<div class="relatorio-bar-track"><em style="width:' + largura + '%; background:' + corFn(k) + ';"></em></div>' +
      '<strong>' + escapeHtml(valor) + '</strong>' +
    '</div>';
  }).join('');
}

function renderRankingRelatorio(id, mapa, limite, formatadorValor) {
  const box = document.getElementById(id);
  if (!box) return;
  const linhas = Object.keys(mapa || {}).map(k => ({ label: k, valor: mapa[k] }))
    .sort((a,b) => Number(b.valor) - Number(a.valor) || a.label.localeCompare(b.label, 'pt-BR'))
    .slice(0, limite || 8);
  if (!linhas.length) {
    box.innerHTML = vazioRelatorio('Sem dados para exibir.');
    return;
  }
  box.innerHTML = linhas.map(function(r, idx) {
    return '<div class="relatorio-rank-row"><span>' + (idx + 1) + '</span><strong title="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + '</strong><em>' + escapeHtml(formatadorValor ? formatadorValor(r.valor) : r.valor) + '</em></div>';
  }).join('');
}

function contarPorRelatorio(lista, getter) {
  const mapa = {};
  (lista || []).forEach(function(item) {
    const k = getter(item) || 'Sem informação';
    mapa[k] = (mapa[k] || 0) + 1;
  });
  return mapa;
}

function limitarMapaRelatorio(mapa, limite) {
  const saida = {};
  Object.keys(mapa || {})
    .sort((a,b) => Number(mapa[b]) - Number(mapa[a]) || a.localeCompare(b, 'pt-BR'))
    .slice(0, limite || 10)
    .forEach(k => saida[k] = mapa[k]);
  return saida;
}

function ordenarMapaMesRelatorio(mapa, limite) {
  const saida = {};
  Object.keys(mapa || {}).sort().slice(-(limite || 8)).forEach(k => saida[k] = mapa[k]);
  return saida;
}

function calcularTempoMedioRelatorio(chamados) {
  const arr = (chamados || []).map(calcularDiasRelatorio).filter(v => v !== null && !isNaN(v));
  if (!arr.length) return '-';
  const media = Math.round(arr.reduce((a,b) => a + b, 0) / arr.length);
  if (media === 0) return 'Mesmo dia';
  return media + 'd';
}

function calcularDiasRelatorio(item) {
  const ini = parseDataRelatorio(item.dataHora || item.data || item.dataRaw);
  const fim = parseDataRelatorio(item.dataConclusaoOs || item.dataConclusao || item.dataHoraUltimaAcao || item.dataHoraEncaminhamento || item.dataHora || item.data);
  if (!ini || !fim) return null;
  return Math.max(0, Math.round((fim.getTime() - ini.getTime()) / 86400000));
}

function parseDataRelatorio(valor) {
  if (!valor) return null;
  if (valor instanceof Date && !isNaN(valor.getTime())) return valor;
  if (typeof valor === 'number' && !isNaN(valor)) return new Date(valor);
  const s = String(valor || '').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const p = s.slice(0, 10).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  if (typeof parseDataHoraBR === 'function') {
    const ts = parseDataHoraBR(s);
    if (ts) return new Date(ts);
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function getAnoMesRelatorio(data) {
  return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0');
}

function formatarMesRelatorio(valor) {
  const p = String(valor || '').split('-');
  if (p.length !== 2) return valor;
  const data = new Date(Number(p[0]), Number(p[1]) - 1, 1);
  return data.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
}

function corObraRelatorio(status) {
  const s = normalizarTextoBase(status);
  if (s.includes('conclu')) return 'var(--obra-concluida)';
  if (s.includes('exec')) return 'var(--obra-execucao)';
  if (s.includes('licit')) return 'var(--obra-licitacao)';
  if (s.includes('projeto')) return 'var(--obra-projeto)';
  if (s.includes('susp')) return 'var(--obra-suspensa)';
  return 'var(--obras)';
}

function vazioRelatorio(msg) {
  return '<div class="relatorio-empty">' + escapeHtml(msg || 'Sem dados.') + '</div>';
}

function limparFiltrosRelatorios() {
  ['relatorioBusca','relatorioMes','relatorioStatus','relatorioTipo'].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  renderRelatorios();
}

function exportarRelatoriosCsv(botao) {
  const lista = window.relatoriosListaAtual || [];
  if (!lista.length) {
    alert('Não há registros filtrados para exportar.');
    return;
  }
  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Exportando...');

  const linhas = [['ID','Unidade','Tipo','Status','Nº OS','Data','Valor orçamento','Equipe','Descrição','Observações']];
  lista.forEach(function(item) {
    linhas.push([
      item.id || '',
      item.unidade || '',
      item.tipo || '',
      normalizarSituacaoSistema(item.situacao || item.status),
      item.numeroOs || '',
      item.dataHora || item.data || '',
      item.valorOrcamento || '',
      item.equipe || '',
      item.detalhamento || '',
      item.observacoes || ''
    ]);
  });

  const csv = linhas.map(l => l.map(csvEscapeRelatorio).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'relatorios_gom_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if (typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Exportado');
}

function csvEscapeRelatorio(valor) {
  return '"' + String(valor == null ? '' : valor).replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
}

window.inicializarRelatorios = inicializarRelatorios;
window.renderRelatorios = renderRelatorios;
window.renderRelatoriosGraficos = renderRelatoriosGraficos;
window.setRelatorioTab = setRelatorioTab;
window.limparFiltrosRelatorios = limparFiltrosRelatorios;
window.exportarRelatoriosCsv = exportarRelatoriosCsv;

  </script>

  <script>
window.acompanharChamadosResultado = window.acompanharChamadosResultado || [];
window.acompanharListaPayload = window.acompanharListaPayload || null;

function inicializarAcompanhar() {
  preencherSelectEscolasAcompanhar();
  const resultado = document.getElementById('acompanharResultado');
  if (resultado && !resultado.innerHTML.trim()) {
    resultado.innerHTML = '<div class="acompanhar-empty"><i class="bi bi-search"></i><strong>Nenhuma consulta realizada.</strong><span>Informe protocolo, unidade ou e-mail para visualizar o andamento.</span></div>';
  }
}

function preencherSelectEscolasAcompanhar() {
  const select = document.getElementById('acompanharUnidade');
  if (!select) return;
  const atual = select.value || '';
  const escolas = Array.isArray(window.listaEscolasGlobal) ? window.listaEscolasGlobal : [];
  select.innerHTML = '<option value="">Selecione uma unidade para listar seus chamados</option>' +
    escolas.map(e => '<option value="' + escapeHtml(e.nome || '') + '">' + escapeHtml(e.nome || '') + '</option>').join('');
  if (atual) select.value = atual;
}

function consultarProtocoloEscola(event) {
  event.preventDefault();
  const form = event.target;
  const botao = typeof gomEncontrarBotaoSubmit === 'function' ? gomEncontrarBotaoSubmit(form) : form.querySelector('button[type="submit"]');
  const payload = formToObject(form);
  payload.id = String(payload.id || '').trim();
  payload.email = String(payload.email || '').trim();
  payload.unidade = String(payload.unidade || '').trim();

  if (!payload.id && !payload.email && !payload.unidade) {
    alert('Informe o protocolo, a unidade escolar ou o e-mail cadastrado da unidade.');
    return;
  }

  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Consultando...');
  const resultado = document.getElementById('acompanharResultado');
  if (resultado) resultado.innerHTML = '<div class="acompanhar-loading"><div class="spinner-border text-primary"></div><strong>Consultando andamento...</strong></div>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
      const retorno = parseJsonAcompanhar_(res);
      if (!retorno.ok) {
        renderErroAcompanhar(retorno.erro || 'Não foi possível localizar registros para a consulta.');
        return;
      }
      if (retorno.modo === 'lista' || Array.isArray(retorno.chamados)) renderListaAcompanhar(retorno);
      else renderResultadoAcompanhar(retorno.chamado);
    })
    .withFailureHandler(function(err) {
      if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
      renderErroAcompanhar((err && err.message) || err);
    })
    .gomConsultarProtocoloEscolaV1Json(payload);
}

function parseJsonAcompanhar_(res) {
  if (typeof res === 'string') {
    try { return JSON.parse(res); } catch(e) { return { ok: false, erro: 'Resposta inválida do servidor.' }; }
  }
  return res || { ok: false, erro: 'Resposta vazia do servidor.' };
}

function renderErroAcompanhar(msg) {
  const box = document.getElementById('acompanharResultado');
  if (!box) return;
  box.innerHTML = '<div class="acompanhar-alerta erro"><i class="bi bi-exclamation-triangle"></i><div><strong>Consulta não encontrada</strong><span>' + escapeHtml(msg || 'Verifique os dados informados.') + '</span></div></div>';
}

function renderListaAcompanhar(payload) {
  const box = document.getElementById('acompanharResultado');
  if (!box) return;
  const chamados = Array.isArray(payload.chamados) ? payload.chamados : [];
  window.acompanharChamadosResultado = chamados;
  window.acompanharListaPayload = payload;

  if (!chamados.length) {
    box.innerHTML = '<div class="acompanhar-empty"><i class="bi bi-inbox"></i><strong>Nenhum chamado encontrado.</strong><span>Não há protocolos vinculados aos dados informados.</span></div>';
    return;
  }

  const unidadeLabel = payload.unidade || (chamados[0] && chamados[0].unidade) || 'unidade consultada';
  box.innerHTML = [
    '<section class="acompanhar-lista-box">',
      '<div class="acompanhar-lista-head"><div>',
        '<span class="acompanhar-pill"><i class="bi bi-list-check me-1"></i>' + chamados.length + ' chamado(s)</span>',
        '<h5>Protocolos encontrados para ' + escapeHtml(unidadeLabel) + '</h5>',
        '<p>Clique em “Ver detalhes” para abrir o andamento completo de um protocolo.</p>',
      '</div></div>',
      '<div class="acompanhar-lista">' + chamados.map(renderItemListaAcompanhar).join('') + '</div>',
    '</section>'
  ].join('');
}

function renderItemListaAcompanhar(chamado, index) {
  const st = chamado.status || chamado.situacao || 'Em análise';
  const cor = chamado.corStatus || (typeof getCorStatus === 'function' ? getCorStatus(st) : '#002b5e');
  const descricao = chamado.descricao || 'Sem descrição pública informada.';
  return [
    '<article class="acompanhar-lista-item" style="--status-color:' + escapeHtml(cor) + ';">',
      '<div class="acompanhar-lista-status"><span>#' + escapeHtml(chamado.id || '') + '</span><strong>' + escapeHtml(st) + '</strong></div>',
      '<div class="acompanhar-lista-main">',
        '<h6>' + escapeHtml(chamado.unidade || 'Unidade não informada') + '</h6>',
        '<p>' + escapeHtml(resumirTextoAcompanhar(descricao, 180)) + '</p>',
        '<div class="acompanhar-lista-meta">',
          '<span><i class="bi bi-calendar-event me-1"></i>Abertura: ' + escapeHtml(chamado.dataAbertura || '-') + '</span>',
          '<span><i class="bi bi-clock-history me-1"></i>Atualização: ' + escapeHtml(chamado.ultimaAtualizacao || '-') + '</span>',
          '<span><i class="bi bi-hash me-1"></i>OS: ' + escapeHtml(chamado.numeroOs || 'Sem número') + '</span>',
        '</div>',
      '</div>',
      '<div class="acompanhar-lista-action"><button class="btn btn-primary btn-sm fw-bold" onclick="abrirDetalheAcompanhar(' + index + ')"><i class="bi bi-eye me-1"></i>Ver detalhes</button></div>',
    '</article>'
  ].join('');
}

function abrirDetalheAcompanhar(index) {
  const chamado = (window.acompanharChamadosResultado || [])[Number(index)];
  if (!chamado) return;
  renderResultadoAcompanhar(chamado, true);
  const box = document.getElementById('acompanharResultado');
  if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function voltarListaAcompanhar() {
  if (window.acompanharListaPayload) renderListaAcompanhar(window.acompanharListaPayload);
}

function renderResultadoAcompanhar(chamado, mostrarVoltar) {
  const box = document.getElementById('acompanharResultado');
  if (!box || !chamado) return;

  const st = chamado.status || chamado.situacao || 'Em análise';
  const cor = chamado.corStatus || (typeof getCorStatus === 'function' ? getCorStatus(st) : '#002b5e');
  const timeline = Array.isArray(chamado.timeline) ? chamado.timeline : [];
  const obsPublicas = Array.isArray(chamado.observacoesPublicas) ? chamado.observacoesPublicas : [];

  box.innerHTML = [
    '<section class="acompanhar-protocolo" style="--status-color:' + escapeHtml(cor) + ';">',
      mostrarVoltar ? '<button class="btn btn-light border fw-bold btn-sm mb-3" onclick="voltarListaAcompanhar()"><i class="bi bi-arrow-left me-1"></i>Voltar para lista</button>' : '',
      '<div class="acompanhar-protocolo-head">',
        '<div><span class="acompanhar-pill">Protocolo #' + escapeHtml(chamado.id || '') + '</span><h5>' + escapeHtml(chamado.unidade || 'Unidade não informada') + '</h5><p>' + escapeHtml(chamado.descricao || 'Sem descrição pública informada.') + '</p></div>',
        '<div class="acompanhar-status-box"><small>Status atual</small><strong>' + escapeHtml(st) + '</strong></div>',
      '</div>',
      '<div class="acompanhar-info-grid">',
        renderInfoAcompanhar('Abertura', chamado.dataAbertura || '-'),
        renderInfoAcompanhar('Última atualização', chamado.ultimaAtualizacao || '-'),
        renderInfoAcompanhar('Previsão', chamado.dataPrevistaConclusao || '-'),
        renderInfoAcompanhar('Conclusão', chamado.dataConclusao || '-'),
        renderInfoAcompanhar('Nº OS', chamado.numeroOs || 'Sem número'),
        renderInfoAcompanhar('Tipo', chamado.tipo || '-'),
      '</div>',
      '<div class="acompanhar-orientacao-status"><i class="bi bi-info-circle-fill"></i><span>' + escapeHtml(chamado.mensagemPublica || 'A solicitação está em acompanhamento pela equipe responsável.') + '</span></div>',
      '<div class="acompanhar-section-title"><i class="bi bi-clock-history me-1"></i>Linha do tempo do protocolo</div>',
      '<div class="acompanhar-timeline">' + (timeline.length ? timeline.map(renderEventoAcompanhar).join('') : '<div class="acompanhar-empty-mini">Sem eventos públicos suficientes para exibir.</div>') + '</div>',
      obsPublicas.length ? '<div class="acompanhar-section-title"><i class="bi bi-chat-left-text me-1"></i>Observações públicas</div><div class="acompanhar-observacoes">' + obsPublicas.map(o => '<div>' + escapeHtml(o) + '</div>').join('') + '</div>' : '',
      chamado.podeComplementar ? renderComplementoEscola(chamado) : '',
    '</section>'
  ].join('');
}

function renderInfoAcompanhar(label, valor) {
  return '<div class="acompanhar-info"><span>' + escapeHtml(label) + '</span><strong>' + escapeHtml(valor || '-') + '</strong></div>';
}

function renderEventoAcompanhar(ev) {
  return '<div class="acompanhar-evento"><span>' + escapeHtml(ev.data || '-') + '</span><div><strong>' + escapeHtml(ev.titulo || '') + '</strong><p>' + escapeHtml(ev.descricao || '') + '</p></div></div>';
}

function renderComplementoEscola(chamado) {
  return [
    '<div class="acompanhar-complemento">',
      '<div class="acompanhar-section-title"><i class="bi bi-paperclip me-1"></i>Complementar informações</div>',
      '<p>Este chamado foi devolvido para a escola. Envie uma complementação para que ele volte à análise da GOM.</p>',
      '<form onsubmit="enviarComplementoEscola(event)" class="acompanhar-complemento-form">',
        '<input type="hidden" name="id" value="' + escapeHtml(chamado.id || '') + '">',
        '<input type="hidden" name="unidade" value="' + escapeHtml(chamado.unidade || '') + '">',
        '<input type="hidden" name="email" value="' + escapeHtml(document.getElementById('acompanharEmail') ? document.getElementById('acompanharEmail').value : '') + '">',
        '<textarea class="form-control" name="observacao" rows="3" placeholder="Descreva a complementação ou correção solicitada..." required></textarea>',
        '<input class="form-control" type="file" name="anexos" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">',
        '<button class="btn btn-success fw-bold" type="submit"><i class="bi bi-send-check me-1"></i>Enviar complemento</button>',
      '</form>',
    '</div>'
  ].join('');
}

async function enviarComplementoEscola(event) {
  event.preventDefault();
  const form = event.target;
  const botao = typeof gomEncontrarBotaoSubmit === 'function' ? gomEncontrarBotaoSubmit(form) : form.querySelector('button[type="submit"]');
  const payload = formToObject(form);

  try {
    if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Enviando...');
    payload.anexos = await arquivosInputParaBase64(form.querySelector('[name="anexos"]'));
    google.script.run
      .withSuccessHandler(function(res) {
        const retorno = parseJsonAcompanhar_(res);
        if (!retorno.ok) {
          if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
          alert(retorno.erro || 'Não foi possível enviar o complemento.');
          return;
        }
        if (typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Enviado');
        alert('Complemento enviado com sucesso. O chamado voltou para análise.');
        consultarProtocoloAposComplemento_(payload);
      })
      .withFailureHandler(function(err) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        alert((err && err.message) || err);
      })
      .gomRegistrarComplementoEscolaV1Json(payload);
  } catch (erro) {
    if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
    alert((erro && erro.message) || erro);
  }
}

function consultarProtocoloAposComplemento_(payload) {
  const form = document.getElementById('formAcompanharProtocolo');
  if (!form) return;
  if (document.getElementById('acompanharId')) document.getElementById('acompanharId').value = payload.id || '';
  if (document.getElementById('acompanharUnidade')) document.getElementById('acompanharUnidade').value = payload.unidade || '';
  setTimeout(function() {
    consultarProtocoloEscola({ preventDefault: function(){}, target: form });
  }, 450);
}

function limparConsultaAcompanhar() {
  window.acompanharChamadosResultado = [];
  window.acompanharListaPayload = null;
  const form = document.getElementById('formAcompanharProtocolo');
  if (form) form.reset();
  preencherSelectEscolasAcompanhar();
  const resultado = document.getElementById('acompanharResultado');
  if (resultado) resultado.innerHTML = '<div class="acompanhar-empty"><i class="bi bi-search"></i><strong>Nenhuma consulta realizada.</strong><span>Informe protocolo, unidade ou e-mail para visualizar o andamento.</span></div>';
}

function resumirTextoAcompanhar(texto, limite) {
  texto = String(texto || '').replace(/\s+/g, ' ').trim();
  limite = Number(limite || 160);
  return texto.length <= limite ? texto : texto.slice(0, limite - 1).trim() + '…';
}

window.inicializarAcompanhar = inicializarAcompanhar;
window.consultarProtocoloEscola = consultarProtocoloEscola;
window.enviarComplementoEscola = enviarComplementoEscola;
window.limparConsultaAcompanhar = limparConsultaAcompanhar;
window.abrirDetalheAcompanhar = abrirDetalheAcompanhar;
window.voltarListaAcompanhar = voltarListaAcompanhar;

  </script>

  <script>
(function() {
  window.configuracoesGlobal = Array.isArray(window.configuracoesGlobal) ? window.configuracoesGlobal : [];
  window.configuracoesGrupoAtual = window.configuracoesGrupoAtual || 'Todos';
  window.configuracoesCarregadas = Boolean(window.configuracoesCarregadas);
  window.configuracoesCarregando = false;
  window.configuracoesAlteradas = window.configuracoesAlteradas || {};

  function parseJsonConfig_(res) {
    if (!res) return { ok: false, erro: 'Resposta vazia.' };
    if (typeof res === 'string') {
      try { return JSON.parse(res); }
      catch(e) { return { ok: false, erro: 'JSON inválido: ' + e.message }; }
    }
    return res;
  }

  function chaveParaId_(chave) {
    const texto = String(chave || '');
    let saida = '';
    for (let i = 0; i < texto.length; i++) {
      const c = texto.charAt(i);
      const ok = (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9') || c === '_' || c === '-';
      saida += ok ? c : '_';
    }
    return saida || 'config';
  }

  function procurarConfig_(chave) {
    chave = String(chave || '').trim();
    return (Array.isArray(window.configuracoesGlobal) ? window.configuracoesGlobal : []).find(function(item) {
      return String(item.chave || '').trim() === chave;
    }) || null;
  }



  /* ==========================================================
     v17.1 - Editor intuitivo de listas de e-mail
     ========================================================== */
  const CONFIG_EMAIL_LIST_KEYS = [
    'EMAILS_ADMIN_GOM',
    'EMAILS_GOM_OPERACIONAL',
    'EMAILS_EMPRESA_ADICIONAIS',
    'EMAILS_CAMPO',
    'EMAILS_CONFERENTE'
  ];

  function isConfigEmailList_(chave) {
    return CONFIG_EMAIL_LIST_KEYS.indexOf(String(chave || '').trim()) >= 0;
  }

  function normalizarListaEmailsConfig_(valor) {
    const vistos = {};
    return String(valor || '')
      .split(/[;,\n\r\t ]+/)
      .map(function(email) { return String(email || '').trim().toLowerCase(); })
      .filter(function(email) {
        if (!email) return false;
        if (vistos[email]) return false;
        vistos[email] = true;
        return true;
      });
  }

  function validarEmailConfig_(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
  }

  function getEmailsConfigAtual_(chave) {
    const id = chaveParaId_(chave);
    const input = document.getElementById('cfg_valor_' + id);
    return normalizarListaEmailsConfig_(input ? input.value : '');
  }

  function setEmailsConfigAtual_(chave, emails, marcar) {

        + '<button type="button" class="btn btn-light border btn-sm fw-bold" onclick="importarEmailsConfig(\'' + escapeJsAttr(chave) + '\')"><i class="bi bi-clipboard-plus me-1"></i>Importar lista</button>'

      + '</div>';

  window.adicionarEmailConfig = function(chave) {

  function doisDigitos_(valor) {
    valor = Number(valor || 0);
    return valor < 10 ? '0' + valor : String(valor);
  }

  function formatarHoraConfig_(valor, fallback) {
    fallback = fallback || '11:00';
    if (valor === null || valor === undefined || valor === '') return fallback;

    if (valor instanceof Date && !isNaN(valor.getTime())) {
      return doisDigitos_(valor.getHours()) + ':' + doisDigitos_(valor.getMinutes());
    }

    const texto = String(valor).trim();
    if (!texto) return fallback;

    // Já está no formato correto: 11:00 ou 11:00:00.
    const matchHoraDireta = texto.match(/^\d{1,2}:\d{2}(?::\d{2})?$/);
    if (matchHoraDireta) {
      const partes = texto.split(':');
      return doisDigitos_(partes[0]) + ':' + doisDigitos_(partes[1]);
    }

    // Quando a planilha salva como horário, o Apps Script pode mandar como Date/string tipo:
    // Sat Dec 30 1899 11:00:00 GMT-0300 ou 1899-12-30T14:00:00.000Z.
    const data = new Date(texto);
    if (!isNaN(data.getTime())) {
      return doisDigitos_(data.getHours()) + ':' + doisDigitos_(data.getMinutes());
    }

    // Último fallback: procura qualquer HH:MM dentro da string.
    const matchHoraInterna = texto.match(/(\d{1,2}):(\d{2})/);
    if (matchHoraInterna) {
      return doisDigitos_(matchHoraInterna[1]) + ':' + doisDigitos_(matchHoraInterna[2]);
    }

    return texto;
  }

  function formatarDataConfig_(valor) {
    if (!valor) return '';
    const data = valor instanceof Date ? valor : new Date(String(valor));
    if (isNaN(data.getTime())) return String(valor || '');
    return doisDigitos_(data.getDate()) + '/' + doisDigitos_(data.getMonth() + 1) + '/' + data.getFullYear();
  }

  function formatarValorConfigParaTela_(itemOuValor, chaveOpcional) {
    const item = itemOuValor && typeof itemOuValor === 'object' && !(itemOuValor instanceof Date) && Object.prototype.hasOwnProperty.call(itemOuValor, 'chave')
      ? itemOuValor
      : { chave: chaveOpcional || '', valor: itemOuValor };

    const chave = String(item.chave || chaveOpcional || '').trim();
    const valor = item.valor;

    if (chave === 'HORARIO_LIMITE_CAMPO') return formatarHoraConfig_(valor, '11:00');

    if (valor instanceof Date && !isNaN(valor.getTime())) {
      // Valores de hora pura no Google Sheets costumam vir como 30/12/1899.
      if (valor.getFullYear() <= 1900) return formatarHoraConfig_(valor, '');
      return formatarDataConfig_(valor);
    }

    return String(valor === null || valor === undefined ? '' : valor);
  }

  function formatarValorConfigParaSalvar_(chave, valor) {
    chave = String(chave || '').trim();
    if (chave === 'HORARIO_LIMITE_CAMPO') return formatarHoraConfig_(valor, '11:00');
    return String(valor === null || valor === undefined ? '' : valor);
  }

  function obterValorConfigInput_(chave) {
    const input = document.getElementById('cfg_valor_' + chaveParaId_(chave));
    if (input) return input.value;
    const item = procurarConfig_(chave);
    return item ? formatarValorConfigParaTela_(item) : '';
  }

  function obterAtivoConfigInput_(chave) {
    const input = document.getElementById('cfg_ativo_' + chaveParaId_(chave));
    if (input) return input.value;
    const item = procurarConfig_(chave);
    return item ? String(item.ativo || 'SIM') : 'SIM';
  }

  function montarPayloadConfiguracao_(chave) {
    const item = procurarConfig_(chave);
    if (!item) return null;
    return {
      chave: String(item.chave || '').trim(),
      valor: formatarValorConfigParaSalvar_(item.chave, obterValorConfigInput_(item.chave)),
      grupo: item.grupo || 'Sistema',
      descricao: item.descricao || '',
      ativo: obterAtivoConfigInput_(item.chave)
    };
  }

  function atualizarItemMemoria_(chave) {
    const item = procurarConfig_(chave);
    if (!item) return;
    item.valor = formatarValorConfigParaSalvar_(chave, obterValorConfigInput_(chave));
    item.ativo = obterAtivoConfigInput_(chave);
  }

  function totalAlteracoes_() {
    return Object.keys(window.configuracoesAlteradas || {}).length;
  }

  function atualizarEstadoSalvar_() {
    const total = totalAlteracoes_();
    const alert = document.getElementById('configSaveAlert');
    const count = document.getElementById('configAlteracoesCount');
    const bar = document.getElementById('configSaveBar');
    const barText = document.getElementById('configSaveBarText');
    if (count) count.textContent = String(total);
    if (alert) alert.style.display = total > 0 ? 'flex' : 'none';
    if (bar) bar.style.display = total > 0 ? 'flex' : 'none';
    if (barText) barText.textContent = total > 0 ? total + ' alteração(ões) aguardando salvamento.' : 'Nenhuma alteração pendente.';
  }

  function setBotoesConfiguracoes_(disabled) {
    document.querySelectorAll('#configSaveBar button').forEach(function(btn) {
      if (disabled) {
        btn.disabled = true;
        btn.classList.add('gom-btn-disabled-context');
      } else {
        if (!btn.classList.contains('gom-btn-loading')) btn.disabled = false;
        btn.classList.remove('gom-btn-disabled-context');
      }
    });
  }

  window.inicializarConfiguracoes = function() {
    if (window.configuracoesCarregadas) {
      renderizarConfiguracoes();
      atualizarEstadoSalvar_();
      return;
    }
    carregarConfiguracoes({ forcar: true });
  };

  window.carregarConfiguracoes = function(opcoes) {
    opcoes = opcoes || {};
    const botao = opcoes.botao || null;
    if (window.configuracoesCarregando) return;
    window.configuracoesCarregando = true;
    if (botao && typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Carregando...');

    const painel = document.getElementById('painelConfiguracoes');
    if (painel) {
      painel.innerHTML = '<div class="text-center w-100 py-5 text-muted"><div class="spinner-border text-primary mb-3"></div><div class="fw-bold">Carregando configurações...</div></div>';
    }

    google.script.run
      .withSuccessHandler(function(res) {
        window.configuracoesCarregando = false;
        const payload = parseJsonConfig_(res);
        if (!payload.ok) {
          mostrarErroConfiguracoes(payload.erro || 'Não foi possível carregar as configurações.');
          return;
        }
        const dados = payload.dados || {};
        window.configuracoesGlobal = Array.isArray(dados.configuracoes) ? dados.configuracoes : [];
        window.configuracoesAlteradas = {};
        window.configuracoesCarregadas = true;
        renderizarConfiguracoes();
        atualizarEstadoSalvar_();
        if (botao && typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'Atualizado');
        else if (botao && typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
      })
      .withFailureHandler(function(err) {
        window.configuracoesCarregando = false;
        if (botao && typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        mostrarErroConfiguracoes(err && err.message ? err.message : String(err));
      })
      .gomListarConfiguracoesWebV1Json();
  };

  window.recarregarConfiguracoes = function(botao) {
    if (totalAlteracoes_() > 0 && !confirm('Existem alterações não salvas. Deseja recarregar e perder essas alterações?')) return;
    window.configuracoesAlteradas = {};
    window.configuracoesCarregadas = false;
    carregarConfiguracoes({ forcar: true, botao: botao || (typeof gomGetBotaoAtivo === 'function' ? gomGetBotaoAtivo() : null) });
  };

  window.descartarAlteracoesConfiguracoes = function(botao) {
    if (totalAlteracoes_() > 0 && !confirm('Descartar alterações não salvas?')) return;
    window.configuracoesAlteradas = {};
    window.configuracoesCarregadas = false;
    carregarConfiguracoes({ forcar: true, botao: botao || (typeof gomGetBotaoAtivo === 'function' ? gomGetBotaoAtivo() : null) });
  };

  window.setConfigGrupo = function(grupo) {
    window.configuracoesGrupoAtual = grupo || 'Todos';
