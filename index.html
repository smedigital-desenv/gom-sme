<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOM | SME</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
:root { 
      --primary: #002b5e; --neon-blue: #00e5ff; --bg: #f4f7f9;
      --atendimento: #00e5ff; 
      --concluido: #39FF14; --encaminhado: #6366f1; --orcamento: #f59e0b; 
      --os: #22d3ee; --emergencial: #ec4899; --griffo: #ff3131; 
      --orcamento-realizado: #fb923c; --servico-realizado: #22c55e;
      --analise: #FFD300; --garantia: #d97706; --duplicado: #475569; 
      --visita: #14b8a6; --unidade: #84cc16;
      --obras: #0f766e; --obra-aguardando: #f59e0b; --obra-projeto: #6366f1;
      --obra-licitacao: #0ea5e9; --obra-execucao: #14b8a6; --obra-concluida: #22c55e;
      --obra-suspensa: #ef4444; --obra-arquivada: #64748b;
    }
    body { 
      background:
        radial-gradient(circle at top left, rgba(0, 229, 255, 0.10), transparent 30%),
        linear-gradient(180deg, #f8fafc 0%, var(--bg) 42%, #eef3f7 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      overflow-x: hidden; 
      color: #0f172a;
    }
    .nav-header { background: var(--primary); padding: 1rem 2rem; border-bottom: 5px solid var(--neon-blue); color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 12px 30px rgba(0, 43, 94, 0.20); }
    .btn-nav { background: rgba(255,255,255,0.04); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.18); font-weight: 800; padding: 8px 18px; border-radius: 999px; transition: 0.25s ease; margin-left: 10px; letter-spacing: .02em; }
    .btn-nav:hover { color: #fff; border-color: rgba(0, 229, 255, 0.65); background: rgba(0, 229, 255, 0.10); }
    .btn-nav.active { background: var(--neon-blue); color: var(--primary); border-color: var(--neon-blue); box-shadow: 0 0 18px rgba(0, 229, 255, 0.42); }

    .container-fluid { padding-top: 1.35rem; }
    #main-content > h4:first-child { margin-top: 0.35rem; margin-bottom: 0.95rem !important; display: flex; align-items: center; }
    #main-content > h4:first-child i { transform: translateY(1px); }
    #main-content > p.text-muted:first-of-type { margin-top: -0.55rem; margin-bottom: 1rem !important; }
    
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 12px;
      margin: 0.55rem 0 1.35rem;
      align-items: stretch;
    }
    .kpi-box {
      --kpi-color: var(--primary);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 18px;
      padding: 13px 14px 12px;
      text-align: left;
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.055);
      position: relative;
      overflow: hidden;
      min-height: 118px;
      isolation: isolate;
    }
    .kpi-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 94% 8%, var(--kpi-color), transparent 36%);
      opacity: .10;
      pointer-events: none;
      z-index: -1;
    }
    .kpi-box::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: var(--kpi-color);
      opacity: .70;
    }
    .kpi-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.10);
      border-color: rgba(0, 43, 94, 0.16);
      background: #ffffff;
    }
    .kpi-box.ativo {
      background: linear-gradient(135deg, #002b5e 0%, #063f70 58%, #057f95 100%);
      border-color: rgba(0, 229, 255, 0.55);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 43, 94, 0.20), 0 0 0 1px rgba(0, 229, 255, 0.12);
    }
    .kpi-box.ativo::before {
      background: radial-gradient(circle at 92% 2%, rgba(0, 229, 255, 0.95), transparent 42%);
      opacity: .20;
    }
    .kpi-box.ativo::after {
      height: 4px;
      background: var(--neon-blue);
      opacity: 1;
    }
    .kpi-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      position: relative;
      z-index: 1;
    }
    .kpi-icon {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--kpi-color);
      background: rgba(0, 43, 94, 0.055);
      border: 1px solid rgba(0, 43, 94, 0.08);
      font-size: 1rem;
    }
    .kpi-pulse {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--kpi-color);
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.14);
      opacity: .82;
    }
    .kpi-title {
      font-size: 0.67rem;
      font-weight: 900;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .065em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      z-index: 1;
    }
    .kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }
    .kpi-value {
      font-size: 1.85rem;
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.045em;
      color: var(--kpi-color);
    }
    .kpi-caption {
      color: #94a3b8;
      font-size: .64rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .kpi-box.ativo .kpi-title,
    .kpi-box.ativo .kpi-caption { color: rgba(255, 255, 255, 0.78); }
    .kpi-box.ativo .kpi-value { color: #ffffff; }
    .kpi-box.ativo .kpi-icon {
      color: var(--neon-blue);
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .kpi-box.ativo .kpi-pulse {
      background: var(--neon-blue);
      box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.18), 0 0 16px rgba(0, 229, 255, 0.45);
    }

    .kpi-help {
      margin-top: 8px;
      color: #64748b;
      font-size: .70rem;
      font-weight: 750;
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .kpi-box.ativo .kpi-help { color: rgba(255, 255, 255, 0.82); }
    .kpi-box.info { cursor: default; }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 18px; padding: 16px 0 34px 0; }
    .card-admin { 
      --card-accent: var(--primary);
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(248,250,252,0.98) 100%); 
      border-radius: 20px; 
      padding: 18px 18px 16px 20px; 
      border: 1px solid rgba(148, 163, 184, 0.22); 
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07); 
      cursor: pointer; 
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background-color .22s ease; 
      position: relative; 
      overflow: hidden; 
      min-height: 205px;
      display: flex;
      flex-direction: column;
    }
    .card-admin::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 6px; background: linear-gradient(180deg, var(--card-accent), rgba(255,255,255,0.08)); }
    .card-admin::after { content: ''; position: absolute; top: -46px; right: -46px; width: 118px; height: 118px; border-radius: 999px; background: var(--card-accent); opacity: .075; }
    .card-admin:hover { transform: translateY(-5px); background-color: #fff; border-color: rgba(0, 43, 94, 0.18); box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12); }
    .card-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; position: relative; z-index: 1; }
    .card-kind { display: inline-flex; align-items: center; gap: 7px; max-width: 70%; padding: 6px 10px; border-radius: 999px; background: #f1f5f9; border: 1px solid #e2e8f0; color: #334155; font-size: .68rem; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 999px; background: var(--card-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--card-accent) 16%, transparent); }
    .card-id { color: #64748b; font-size: .78rem; font-weight: 900; letter-spacing: .02em; }
    .card-title-wrap { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 13px; position: relative; z-index: 1; }
    .card-icon { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); background: rgba(0, 43, 94, 0.07); border: 1px solid rgba(0, 43, 94, 0.08); }
    .card-label { font-size: .66rem; line-height: 1; color: #94a3b8; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .card-unit { color: var(--primary); font-size: 1.02rem; font-weight: 900; line-height: 1.22; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-detail { color: #475569; font-size: .84rem; line-height: 1.45; background: rgba(241, 245, 249, 0.78); border: 1px solid rgba(226, 232, 240, 0.92); border-radius: 14px; padding: 11px 12px; margin: 0 0 14px 0; min-height: 62px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; position: relative; z-index: 1; }
    .card-footer-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(226, 232, 240, 0.9); position: relative; z-index: 1; }
    .card-footer-label { color: #94a3b8; font-size: .66rem; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; max-width: 68%; padding: 7px 10px; border-radius: 999px; background: #ffffff; border: 1px solid rgba(148, 163, 184, 0.30); color: #1e293b; font-size: .72rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 12px rgba(15, 23, 42, .045); }
    .status-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 999px; background: var(--card-accent); }

    .st-recebido { --card-accent: var(--recebido); } .st-atendimento { --card-accent: var(--atendimento); }
    .st-concluido { --card-accent: var(--concluido); }
    .st-encaminhado { --card-accent: var(--encaminhado); } .st-orcamento { --card-accent: var(--orcamento); }
    .st-os { --card-accent: var(--os); } .st-emergencial { --card-accent: var(--emergencial); }
    .st-griffo { --card-accent: var(--griffo); } .st-analise { --card-accent: var(--analise); }
    .st-garantia { --card-accent: var(--garantia); } .st-duplicado { --card-accent: var(--duplicado); }
    .st-visita { --card-accent: var(--visita); } .st-unidade { --card-accent: var(--unidade); }
    .st-orcamento-realizado { --card-accent: var(--orcamento-realizado); } .st-servico-realizado { --card-accent: var(--servico-realizado); }
    .st-default { --card-accent: var(--primary); }


    .card-anexo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.12);
      color: var(--primary);
      border: 1px solid rgba(0, 43, 94, 0.12);
      margin-left: 6px;
      vertical-align: middle;
    }
    .anexo-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .anexo-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.30);
      color: var(--primary);
      font-size: .82rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .045);
      max-width: 100%;
    }
    .anexo-link:hover {
      color: var(--primary);
      border-color: rgba(0, 229, 255, 0.55);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
      text-decoration: none;
    }
    .anexo-link span {
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.78); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-label { font-size: 0.75rem; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
    .modal-data { font-size: 1rem; color: var(--primary); font-weight: 500; margin-bottom: 15px; }

    .table-empresa { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07); border: 1px solid rgba(148, 163, 184, 0.20); }
    .table-empresa th { background: var(--primary); color: white; font-weight: 700; font-size: 0.85rem; padding: 15px; }
    .table-empresa td { padding: 15px; vertical-align: middle; font-size: 0.9rem; border-bottom: 1px solid #e2e8f0; }
    .link-unidade:hover { color: var(--neon-blue) !important; text-decoration: underline; }


    .fila-grid .card-admin { min-height: 242px; }
    .fila-card { --card-accent: var(--atendimento); }
    .fila-rank-badge {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), #075b82);
      color: #ffffff;
      font-size: .92rem;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(0, 43, 94, .18);
      letter-spacing: -.02em;
    }
    .fila-order-badge,
    .fila-warning-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .fila-order-badge {
      background: rgba(0, 229, 255, 0.10);
      border: 1px solid rgba(0, 229, 255, 0.28);
      color: var(--primary);
    }
    .fila-warning-badge {
      background: rgba(245, 158, 11, 0.13);
      border: 1px solid rgba(245, 158, 11, 0.32);
      color: #92400e;
    }
    .fila-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 14px 0;
      position: relative;
      z-index: 1;
    }
    .fila-meta-item {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(226, 232, 240, 0.92);
      border-radius: 14px;
      padding: 10px 11px;
      min-width: 0;
    }
    .fila-meta-label {
      display: block;
      color: #94a3b8;
      font-size: .61rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .fila-meta-value {
      display: block;
      color: #0f172a;
      font-size: .80rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fila-help {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #64748b;
      font-size: .78rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.64);
      border: 1px dashed rgba(0, 43, 94, 0.18);
      border-radius: 16px;
      padding: 10px 12px;
      margin: 0 0 10px 0;
    }
    .fila-help i { color: var(--primary); }


    .obras-grid .card-admin { min-height: 258px; }
    .obra-card { --card-accent: var(--obras); }
    .obra-top-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }
    .prioridade-pill,
    .obra-tipo-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: .69rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .055em;
      white-space: nowrap;
      border: 1px solid rgba(148, 163, 184, .24);
      background: rgba(255,255,255,.78);
      color: #334155;
    }
    .prioridade-pill.p0 { color: #991b1b; background: rgba(220,38,38,.10); border-color: rgba(220,38,38,.22); }
    .prioridade-pill.p1 { color: #92400e; background: rgba(245,158,11,.13); border-color: rgba(245,158,11,.28); }
    .prioridade-pill.p2 { color: #075985; background: rgba(14,165,233,.10); border-color: rgba(14,165,233,.25); }
    .prioridade-pill.p3 { color: #334155; background: rgba(100,116,139,.10); border-color: rgba(100,116,139,.22); }
    .obra-tipo-pill i { color: var(--obras); }
    .obra-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 14px 0;
      position: relative;
      z-index: 1;
    }
    .obra-meta-item {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(226,232,240,.92);
      border-radius: 14px;
      padding: 10px 11px;
      min-width: 0;
    }
    .obra-meta-label {
      display: block;
      color: #94a3b8;
      font-size: .60rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .obra-meta-value {
      display: block;
      color: #0f172a;
      font-size: .78rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .obra-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-size: .72rem;
      font-weight: 900;
      text-decoration: none;
    }
    .obra-link-btn:hover { color: var(--obras); text-decoration: underline; }
    @media (max-width: 768px) {
      .obra-meta-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .nav-header { align-items: flex-start !important; gap: 14px; flex-direction: column; }
      .nav-header .d-flex { flex-wrap: wrap; gap: 8px; }
      .btn-nav { margin-left: 0; }
      .container-fluid { padding-top: 1rem; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .kpi-box { min-height: 112px; padding: 12px; }
      .grid-cards { grid-template-columns: 1fr; }
      .card-admin { min-height: auto; }
    }
  

    .card-subline { margin-top: 4px; color: #64748b; font-size: .72rem; font-weight: 700; }
    .card-observacao { color: #334155; font-size: .80rem; line-height: 1.35; background: #fff; border: 1px dashed rgba(148, 163, 184, .45); border-radius: 12px; padding: 9px 11px; margin-bottom: 12px; position: relative; z-index: 1; }
    .card-money { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 999px; padding: 7px 10px; font-size: .78rem; font-weight: 900; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px; width: fit-content; position: relative; z-index: 1; }
    .empresa-help, .fila-help { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: rgba(0, 229, 255, .08); border: 1px solid rgba(0, 229, 255, .22); border-radius: 16px; color: #0f3b57; font-size: .88rem; }
    .empresa-help i, .fila-help i { color: var(--primary); margin-top: 2px; }
    .empresa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; padding-bottom: 34px; }
    .empresa-card { --card-accent: var(--primary); background: #fff; border: 1px solid rgba(148, 163, 184, .24); border-left: 6px solid var(--card-accent); border-radius: 18px; padding: 18px; box-shadow: 0 10px 28px rgba(15, 23, 42, .07); }
    .empresa-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .empresa-unidade { color: var(--primary); font-size: 1.02rem; font-weight: 900; cursor: pointer; margin-bottom: 12px; line-height: 1.25; }

}

.alerta-grupo { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }

@media (max-width: 900px) {

/* Etapa 4 - Campo oficial */
.campo-page-head { margin-top: .35rem; }

  display: flex;

}
.campo-lista-toolbar {

  align-items: center;
  gap: 14px;

  border-radius: 16px;
  padding: 12px 14px;

}

  display: block;
  color: var(--primary);
  font-size: .92rem;
  font-weight: 950;
}

}

  flex-wrap: wrap;
  justify-content: flex-end;
}

  font-weight: 950;
  text-transform: uppercase;

}

}

.campo-unidade-cell { min-width: 0; }
.campo-status-cell, .campo-data-cell, .campo-acao-cell { min-width: 0; }
.campo-data-cell {

  font-size: .78rem;
  font-weight: 850;
}
.campo-data-cell i { color: var(--primary); margin-right: 4px; }
.campo-acao-cell .badge { width: 100%; padding: 7px 9px; }

  flex-wrap: wrap;

  font-size: .80rem;
}

.campo-readonly-cell {
  min-width: 0;

}
.campo-readonly-label {

}

}
.campo-status-dia-cell {

  align-items: center;
  justify-content: center;
}
.campo-status-dia-cell .badge { width: auto; min-width: 112px; }

.campo-chart-panel { min-height: 310px; }
@media (max-width: 1200px) {
  .campo-lista-head-oficial { display: none; }
  .campo-lista-row-oficial {

  }

}

/* Etapa 4 - Campo: gráficos aprimorados */
.campo-grafico-principal {
  display: block;
}
.campo-dashboard-grid-secundario {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.campo-chart-panel-wide {
  min-height: 360px;
}
.campo-chart-head {
  align-items: flex-start;
}
.campo-chart-subtitle {
  color: #64748b;

  font-weight: 700;
  margin-top: 4px;
  line-height: 1.35;
}
.campo-chart-periodo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 7px 10px;
  background: rgba(0, 229, 255, .10);
  color: var(--primary);
  border: 1px solid rgba(0, 229, 255, .25);

  font-weight: 950;
  text-transform: uppercase;
  letter-spacing: .05em;

.campo-chart-data {

}

  min-width: 34px;
}
.campo-chart-data .campo-bar {

}

  min-height: 16px;
}
.campo-donut-panel {
  min-height: 360px;
}
.campo-donut-wrap {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);

}

.campo-donut-legend {

}

}
.campo-donut-legend-row strong {
  color: var(--primary);
  font-weight: 950;
}
.campo-donut-legend-row em {
  color: #94a3b8;
  font-style: normal;
  font-weight: 900;
  font-size: .70rem;
}
.empty-state.compact {
  padding: 34px 18px;
}
@media (max-width: 1180px) {

}
@media (max-width: 780px) {

/* Etapa 4 - Campo: indicadores gráficos avançados */
.campo-section-title {

.dashboard-page { padding-bottom: 38px; }

  border: 1px solid rgba(0,229,255,.25);
}
.dashboard-eyebrow {
  display: inline-flex;

.dashboard-hero p { margin: 0; color: rgba(255,255,255,.80); font-size: .90rem; font-weight: 700; max-width: 920px; }
.dashboard-hero-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.dashboard-kpi-grid {
  display: grid;

  gap: 12px;

}
.dashboard-kpi {
  --dash-color: var(--primary);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-height: 142px;
  padding: 15px 15px 14px;
  border-radius: 20px;

  border: 1px solid rgba(148,163,184,.24);

  box-shadow: 0 10px 28px rgba(15,23,42,.07);
  text-align: left;
  transition: .22s ease;
  overflow: hidden;
}
.dashboard-kpi::after {
  content: '';
  position: absolute;
  top: -38px;
  right: -38px;
  width: 118px;
  height: 118px;
  border-radius: 999px;
  background: var(--dash-color);
  opacity: .09;
}
.dashboard-kpi:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(15,23,42,.11); }
.dashboard-kpi-icon {
  width: 34px;

  align-items: center;
  justify-content: center;
  color: var(--dash-color);
  background: color-mix(in srgb, var(--dash-color) 10%, #ffffff);
  border: 1px solid color-mix(in srgb, var(--dash-color) 18%, #e2e8f0);

.dashboard-kpi-label { color: #64748b; font-size: .66rem; font-weight: 950; text-transform: uppercase; letter-spacing: .07em; }
.dashboard-kpi strong { color: var(--dash-color); font-size: 2rem; font-weight: 950; line-height: 1; letter-spacing: -.04em; }
.dashboard-kpi small { color: #475569; font-size: .76rem; font-weight: 800; }
.dashboard-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(340px, .75fr); gap: 16px; align-items: start; }
.dashboard-main-col, .dashboard-side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dashboard-card {
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(148,163,184,.24);
  border-radius: 22px;
  padding: 16px;
  box-shadow: 0 10px 28px rgba(15,23,42,.07);
}
.dashboard-card-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.dashboard-card-head h5 { margin: 0 0 4px; color: var(--primary); font-weight: 950; font-size: 1rem; }
.dashboard-card-head p { margin: 0; color: #64748b; font-size: .78rem; font-weight: 750; }
.dashboard-bars { display: flex; flex-direction: column; gap: 10px; }
.dashboard-bar-row { display: grid; grid-template-columns: 210px minmax(0,1fr) 44px; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; }
.dashboard-bar-label { display: flex; align-items: center; gap: 8px; color: #334155; font-size: .80rem; font-weight: 900; min-width: 0; }

.dashboard-bar-row strong { color: var(--primary); font-size: .86rem; font-weight: 950; text-align: right; }
.dashboard-pendencias, .dashboard-ranking, .dashboard-prod { display: flex; flex-direction: column; gap: 9px; }
.dashboard-pendencia {
  --pend-color: var(--emergencial);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 11px 12px;
  border-radius: 15px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-left: 5px solid var(--pend-color);

}
.dashboard-pendencia strong { display: block; color: var(--primary); font-size: .84rem; font-weight: 950; }
.dashboard-pendencia span { display: block; color: #64748b; font-size: .75rem; font-weight: 750; margin-top: 2px; }
.dashboard-pendencia em { color: #334155; font-size: .68rem; font-style: normal; font-weight: 950; background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 9px; white-space: nowrap; }
.dashboard-quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.dashboard-quick-actions button { display: flex; align-items: center; gap: 8px; border: 1px solid rgba(148,163,184,.24); background: #fff; color: var(--primary); border-radius: 14px; padding: 10px 11px; font-size: .78rem; font-weight: 900; text-align: left; transition: .2s ease; }
.dashboard-quick-actions button:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }
.dashboard-rank-row { display: grid; grid-template-columns: 28px minmax(0,1fr) 34px; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 13px; background: #f8fafc; border: 1px solid #e2e8f0; }
.dashboard-rank-row span { width: 24px; height: 24px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--primary); font-size: .70rem; font-weight: 950; }
.dashboard-rank-row strong { color: #334155; font-size: .76rem; font-weight: 900; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dashboard-rank-row em { color: var(--primary); font-style: normal; font-size: .82rem; font-weight: 950; text-align: right; }
.dashboard-prod-main { text-align: center; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, #ecfdf5, #f0fdfa); border: 1px solid #bbf7d0; }
.dashboard-prod-main strong { display: block; color: #047857; font-size: 2.2rem; font-weight: 950; line-height: 1; }
.dashboard-prod-main span { display: block; color: #166534; font-size: .78rem; font-weight: 900; margin-top: 5px; }

.dashboard-prod-grid div { padding: 10px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; }
.dashboard-prod-grid strong { display: block; color: var(--primary); font-size: 1.25rem; font-weight: 950; }
.dashboard-prod-grid span { color: #64748b; font-size: .70rem; font-weight: 850; }
.dashboard-hidden-panel { display: none; }
.empty-state.compact { padding: 26px 16px; }
@media (max-width: 1280px) {
  .dashboard-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dashboard-layout { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .dashboard-hero { flex-direction: column; }
  .dashboard-hero-actions { width: 100%; justify-content: stretch; }
  .dashboard-hero-actions .btn { flex: 1 1 auto; }
  .dashboard-kpi-grid { grid-template-columns: 1fr; }
  .dashboard-bar-row { grid-template-columns: 1fr; }
  .dashboard-quick-actions { grid-template-columns: 1fr; }
}

/* ==========================================================
   v10 - Linha do tempo do chamado no modal
   ========================================================== */
.timeline-chamado-box {
  background: #ffffff;
  border: 1px solid rgba(148, 163, 184, .35);
  border-radius: 16px;
  padding: 12px 14px;
  max-height: 310px;
  overflow: auto;
  box-shadow: inset 0 1px 0 rgba(15,23,42,.025);
}
.timeline-list {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.timeline-list::before {
  content: '';
  position: absolute;
  left: 17px;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: linear-gradient(180deg, rgba(14,165,233,.35), rgba(15,23,42,.08));
}
.timeline-item {
  position: relative;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 10px;
  align-items: start;
}
.timeline-marker {
  position: relative;
  z-index: 1;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}
.timeline-content {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 10px 12px;
}
.timeline-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  color: var(--primary);
}
.timeline-top strong {
  font-weight: 950;
  font-size: .86rem;
}
.timeline-top span {
  color: #64748b;
  font-weight: 800;
  font-size: .72rem;
  white-space: nowrap;
}
.timeline-status {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: .72rem;
  font-weight: 900;
}
.timeline-status-de,
.timeline-status-para {
  border-radius: 999px;
  padding: 3px 8px;
  background: #e2e8f0;
  color: #334155;
}
.timeline-status-para {
  background: rgba(14,165,233,.12);
  color: var(--primary);
}
.timeline-desc {
  margin-top: 6px;
  color: #475569;
  font-size: .78rem;
  line-height: 1.35;
  white-space: pre-line;
}
.timeline-meta {
  margin-top: 6px;
  color: #64748b;
  font-size: .70rem;
  font-weight: 750;
}
.timeline-loading,
.timeline-empty {
  color: #64748b;
  font-weight: 850;
  text-align: center;
  padding: 16px;
}
.timeline-loading.small {
  padding: 8px;
  font-size: .75rem;
}
.timeline-equipe .timeline-marker { background: #ecfdf5; border-color: #bbf7d0; color: #047857; }
.timeline-prazo .timeline-marker { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.timeline-conclusao .timeline-marker { background: #dcfce7; border-color: #86efac; color: #15803d; }
@media (max-width: 768px) {
  .timeline-top { flex-direction: column; gap: 2px; }
  .timeline-top span { white-space: normal; }
}

.memorial-tipo {

.memorial-status,

.memorial-acoes {

}
.memorial-tempo-pill,

@media (max-width: 1300px) {

/* ==========================================================
   v13.1 - Correção global de quebra de texto em cards
   ========================================================== */
/*
  Objetivo:
  - Nenhum card deve quebrar palavra letra por letra ou ficar com coluna estreita.
  - Os cards passam a ter largura mínima mais confortável.
  - Textos longos são limitados por linhas/ellipsis, sem "espremer" o conteúdo.
*/

/* Grid de cards operacional: menos colunas e mais área útil para texto */
.grid-cards {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)) !important;
  gap: 18px !important;
  align-items: stretch !important;
}

/* Em telas muito largas, impede 5/6 cards espremidos lado a lado */
@media (min-width: 1600px) {
  .grid-cards {
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)) !important;
  }
}

/* Estrutura interna dos cards */
.card-admin,
.card-admin *,
.kpi-box,
.kpi-box *,
.dashboard-kpi,
.dashboard-kpi *,
.alerta-row,
.alerta-row *,
.empresa-card,
.empresa-card *,
.memorial-row,
.memorial-row *,
.obra-card,
.obra-card * {
  word-break: normal !important;
  overflow-wrap: normal !important;
  hyphens: none !important;
}

.card-admin {
  min-width: 0 !important;
  width: 100% !important;
}

.card-topline,
.card-title-wrap,
.card-footer-row {
  min-width: 0 !important;
  width: 100% !important;
}

.card-title-wrap > div {
  flex: 1 1 auto !important;
  min-width: 0 !important;
  max-width: 100% !important;
}

/* Unidade, descrição e observações: quebram somente por espaço, sem coluna estreita */
.card-unit {
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  white-space: normal !important;
  max-width: 100% !important;
  line-height: 1.22 !important;
}

.card-detail,
.card-observacao {
  width: 100% !important;
  max-width: 100% !important;
  white-space: normal !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

.card-detail {
  display: -webkit-box !important;
  -webkit-line-clamp: 3 !important;
  -webkit-box-orient: vertical !important;
}

.card-observacao {
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
}

/* Badges não podem roubar largura do conteúdo */
.card-kind,
.card-id,
.status-pill,
.fila-warning-badge,
.fila-order-badge,
.fila-rank-badge {
  flex: 0 1 auto !important;
  min-width: 0 !important;
  max-width: 100% !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

.card-footer-label {
  flex: 1 1 auto !important;
  min-width: 0 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

/* Alertas em lista: texto principal com largura real */
.alerta-row-main,
.alerta-row-main h5,
.alerta-row-main p,
.alerta-unidade,
.alerta-acao {
  min-width: 0 !important;
  max-width: 100% !important;
  white-space: normal !important;
}

.alerta-row-main h5 {
  line-height: 1.25 !important;
}

/* KPIs e cards do dashboard: evitar quebra feia em telas estreitas */
.kpi-title,
.kpi-help,
.dashboard-kpi-label,
.dashboard-kpi small,
.memorial-unidade strong,
.memorial-unidade p,
.empresa-unidade,
.empresa-os-desc,
.obra-card-title,
.obra-card-desc {
  word-break: normal !important;
  overflow-wrap: normal !important;
  hyphens: none !important;
}

/* Responsivo: no tablet/celular, cards ocupam a linha toda */
@media (max-width: 980px) {
  .grid-cards {
    grid-template-columns: 1fr !important;
  }

  .card-admin {
    min-height: auto !important;
  }
}

/* Barras de filtros também não devem esmagar conteúdo */
#main-content .input-group,
#main-content .form-control,
#main-content .badge {
  min-width: 0;
}

      </div>

window.formatarInputDate = window.formatarInputDate || function(valor) {
  if (valor === null || valor === undefined || valor === '') return '';

  if (valor instanceof Date && !isNaN(valor.getTime())) {
    return valor.getFullYear() + '-' + String(valor.getMonth() + 1).padStart(2, '0') + '-' + String(valor.getDate()).padStart(2, '0');

  var texto = String(valor || '').trim();

function escapeHtml(valor) {
  return String(valor == null ? '' : valor)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsAttr(valor) {
  return String(valor == null ? '' : valor)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/\r?\n/g, ' ');
}

function normalizarTextoBase(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();
}

function parseDataOrdenacao(item) {
  const raw = Number(item && (item.dataEntradaFilaRaw || item.dataOrdenacaoFila || item.dataRaw || item.dataOrdenacao));

  return parseDataHoraBR(item ? (item.dataHoraEntradaFila || item.dataEntradaFila || item.dataHora || item.data) : '') || Number.MAX_SAFE_INTEGER;
}

function parseDataHoraBR(valor) {
  const texto = String(valor || '').trim();
  if (!texto) return null;
  const match = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!match) return null;
  let ano = Number(match[3]);
  if (ano < 100) ano += 2000;
  const data = new Date(ano, Number(match[2]) - 1, Number(match[1]), match[4] !== undefined ? Number(match[4]) : 0, match[5] !== undefined ? Number(match[5]) : 0, match[6] !== undefined ? Number(match[6]) : 0);
  const timestamp = data.getTime();
  return isNaN(timestamp) ? null : timestamp;
}

function ehMesmoDia(timestamp, dataReferencia) {
  if (!timestamp || timestamp === Number.MAX_SAFE_INTEGER) return false;
  const data = new Date(timestamp);
  return data.getFullYear() === dataReferencia.getFullYear()
    && data.getMonth() === dataReferencia.getMonth()
    && data.getDate() === dataReferencia.getDate();
}

function formatarTempoFila(timestamp) {
  if (!timestamp || timestamp === Number.MAX_SAFE_INTEGER) return 'Entrada não registrada';
  const diff = Date.now() - timestamp;
  if (diff < 0) return 'Entrada futura';
  const minuto = 60 * 1000, hora = 60 * minuto, dia = 24 * hora;
  const dias = Math.floor(diff / dia);
  const horas = Math.floor((diff % dia) / hora);
  const minutos = Math.floor((diff % hora) / minuto);
  if (dias > 0) return `${dias}d ${horas}h`;
  if (horas > 0) return `${horas}h ${minutos}min`;
  return `${Math.max(minutos, 0)}min`;
}

function deveRevisarFila(item) {
  const timestamp = parseDataOrdenacao(item);
  if (!timestamp || timestamp === Number.MAX_SAFE_INTEGER) return true;
  if (timestamp > Date.now() + (5 * 60 * 1000)) return true;
  return Boolean(item && item.precisaRevisaoFila);
}


function formatarInputDate(valor) {
  if (valor === null || valor === undefined || valor === '') return '';

  if (valor instanceof Date && !isNaN(valor.getTime())) {
    return valor.getFullYear() + '-' + String(valor.getMonth() + 1).padStart(2, '0') + '-' + String(valor.getDate()).padStart(2, '0');
  }

  if (typeof valor === 'number' && !isNaN(valor)) {
    const dataNumero = new Date(valor);
    if (!isNaN(dataNumero.getTime())) {
      return dataNumero.getFullYear() + '-' + String(dataNumero.getMonth() + 1).padStart(2, '0') + '-' + String(dataNumero.getDate()).padStart(2, '0');
    }
  }

  const texto = String(valor || '').trim();
  if (!texto) return '';

  // Formato já compatível com input[type=date]: yyyy-mm-dd
  const iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];

  // Formato brasileiro: dd/mm/yyyy ou dd-mm-yyyy
  const br = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (br) {
    let ano = Number(br[3]);
    if (ano < 100) ano += 2000;
    return String(ano).padStart(4, '0') + '-' + String(Number(br[2])).padStart(2, '0') + '-' + String(Number(br[1])).padStart(2, '0');
  }

  const data = new Date(texto);
  if (!isNaN(data.getTime())) {
    return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0') + '-' + String(data.getDate()).padStart(2, '0');
  }

  return '';
}


function arquivosInputParaBase64(input) {
  const files = Array.from(input?.files || []);
  const limiteArquivos = 5;
  const limiteBytes = 8 * 1024 * 1024;
  if (files.length > limiteArquivos) return Promise.reject(new Error(`Selecione no máximo ${limiteArquivos} arquivo(s).`));
  for (const file of files) {
    if (file.size > limiteBytes) return Promise.reject(new Error(`O arquivo "${file.name}" ultrapassa 8 MB.`));
  }
  return Promise.all(files.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ nome: file.name, mimeType: file.type || 'application/octet-stream', tamanho: file.size, base64: String(reader.result).split(',').pop() });
    reader.onerror = () => reject(new Error('Não foi possível ler o arquivo: ' + file.name));
    reader.readAsDataURL(file);
  })));
}

function extrairLinksAnexos(valor) {
  const texto = String(valor || '').trim();
  if (!texto) return [];
  try {
    const json = JSON.parse(texto);
    if (Array.isArray(json)) return json.map((item, idx) => ({ nome: item.nome || item.name || `Anexo ${idx + 1}`, url: item.url || item.link || '' })).filter(item => item.url);
  } catch (e) {}
  const encontrados = [];
  texto.split(/\n+/).filter(Boolean).forEach((linha, idx) => {
    const urls = linha.match(/https?:\/\/[^\s,;]+/g) || [];
    if (!urls.length) return;
    const url = urls[urls.length - 1];
    const nome = linha.replace(url, '').replace(/[|:;,-]+$/g, '').replace(/^[|:;,-]+/g, '').trim() || `Anexo ${idx + 1}`;
    encontrados.push({ nome, url });
  });
  return encontrados;
}

}

  <script>

window.usuarioAtualGom = window.usuarioAtualGom || null;
window.permissoesCarregadas = window.permissoesCarregadas || false;

function carregarUsuarioPermissoes(callback) {
  google.script.run
    .withSuccessHandler(function(res) {
      var payload = parseJsonPermissoes_(res);
      if (!payload || payload.ok === false) {
        window.usuarioAtualGom = perfilFallbackPermissoes_();
      } else {
        window.usuarioAtualGom = payload.usuario || payload;
      }
      window.permissoesCarregadas = true;
      aplicarPermissoesInterface();
      if (typeof callback === 'function') callback(window.usuarioAtualGom);
    })
    .withFailureHandler(function(err) {
      console.error('[GOM PERMISSÕES] Erro ao carregar usuário:', err);
      window.usuarioAtualGom = perfilFallbackPermissoes_();
      window.permissoesCarregadas = true;
      aplicarPermissoesInterface();
      if (typeof callback === 'function') callback(window.usuarioAtualGom);
    })
    .gomObterUsuarioAtualV1Json();
}

function parseJsonPermissoes_(res) {
  if (typeof res === 'string') {
    try { return JSON.parse(res); } catch(e) { return { ok: false, erro: 'JSON inválido' }; }
  }
  return res || { ok: false };
}

function perfilFallbackPermissoes_() {
  return {
    ok: true,
    perfil: 'ADMIN_GOM',
    perfilLabel: 'Administrador GOM',
    modo: 'ABERTO',
    restrito: false,
    email: '',
    telas: (window.TELAS_WEB || []).slice(),
    paginaInicial: 'dashboard',
    unidades: [],
    acoes: { configurar: true }
  };
}

function getUsuarioGom() {
  return window.usuarioAtualGom || perfilFallbackPermissoes_();
}

function podeAcessarPagina(pageName) {
  var usuario = getUsuarioGom();
  if (!usuario.restrito) return true;
  return Array.isArray(usuario.telas) && usuario.telas.indexOf(pageName) >= 0;
}

function getPaginaInicialPermitida(preferida) {
  if (podeAcessarPagina(preferida)) return preferida;
  var usuario = getUsuarioGom();
  return (usuario.telas && usuario.telas[0]) || 'acompanhar';
}

function aplicarPermissoesInterface() {
  var usuario = getUsuarioGom();
  var telas = Array.isArray(usuario.telas) ? usuario.telas : [];
  var restrito = Boolean(usuario.restrito);

  document.querySelectorAll('[data-page]').forEach(function(el) {
    var page = el.getAttribute('data-page');
    if (!page || page === 'mais') return;
    var permitido = !restrito || telas.indexOf(page) >= 0;
    el.classList.toggle('gom-permissao-oculto', !permitido);
    el.disabled = !permitido;
  });

  document.querySelectorAll('.nav-more').forEach(function(box) {
    var visiveis = box.querySelectorAll('.nav-more-item:not(.gom-permissao-oculto)').length;
    box.classList.toggle('gom-permissao-oculto', visiveis === 0);
  });

  atualizarBadgePerfilUsuario();
}

function atualizarBadgePerfilUsuario() {
  var usuario = getUsuarioGom();
  var perfil = usuario.perfilLabel || usuario.perfil || 'Usuário';
  var modo = usuario.modo ? 'Modo: ' + usuario.modo : '';
  var email = usuario.email || '';
  var detalhe = [modo, email].filter(Boolean).join(' · ');
  var html = '<span class="perfil-badge-text" title="' + escapeHtml(perfil) + '">' + escapeHtml(perfil) + '</span>' + (detalhe ? '<small title="' + escapeHtml(detalhe) + '">' + escapeHtml(detalhe) + '</small>' : '');

  var desktop = document.getElementById('perfilUsuarioBadge');
  if (desktop) desktop.innerHTML = html;

  var mobile = document.getElementById('mobilePerfilUsuarioBadge');
  if (mobile) mobile.textContent = perfil;
}

function renderAcessoNegado(pageName) {
  fecharMobileMais();
  var main = document.getElementById('main-content');
  var usuario = getUsuarioGom();
  if (!main) return;
  main.innerHTML = [
    '<div class="acesso-negado-card">',
      '<i class="bi bi-shield-lock"></i>',
      '<h4>Acesso restrito</h4>',
      '<p>Seu perfil <strong>' + escapeHtml(usuario.perfilLabel || usuario.perfil || '') + '</strong> não possui acesso à tela <strong>' + escapeHtml((ROTULOS_PAGINAS_GOM && ROTULOS_PAGINAS_GOM[pageName]) || pageName) + '</strong>.</p>',
      '<button class="btn btn-primary fw-bold" onclick="loadPage(\'' + escapeJsAttr(getPaginaInicialPermitida('dashboard')) + '\')"><i class="bi bi-arrow-left me-1"></i>Ir para minha tela inicial</button>',
    '</div>'
  ].join('');
}

window.carregarUsuarioPermissoes = carregarUsuarioPermissoes;
window.podeAcessarPagina = podeAcessarPagina;
window.getPaginaInicialPermitida = getPaginaInicialPermitida;
window.aplicarPermissoesInterface = aplicarPermissoesInterface;
window.renderAcessoNegado = renderAcessoNegado;

  </script>

  <script>
function renderDashboard() {
  const resumo = document.getElementById('dashboardResumo');
  const painel = document.getElementById('painelDados');
  if (!resumo) return;

  if (!window.dadosCarregados) {
    resumo.innerHTML = '<div class="empty-state"><div class="spinner-border text-primary"></div><p class="mt-3 fw-bold">Carregando dashboard...</p></div>';
    if (painel) painel.innerHTML = '';
    return;
  }

  const chamados = Array.isArray(window.listaChamadosGlobal) ? window.listaChamadosGlobal : [];
  const hoje = new Date();
  const mesAtual = hoje.getMonth();
  const anoAtual = hoje.getFullYear();

  const porStatus = contarPorStatusDashboard(chamados);
  const campoAtivos = chamados.filter(c => ['OS emitida','Atendimento Emergencial','Garantia de Obra'].includes(normalizarSituacaoSistema(c.situacao || c.status)));
  const osEmitidas = chamados.filter(c => normalizarSituacaoSistema(c.situacao || c.status) === 'OS emitida');
  const osSemNumero = osEmitidas.filter(c => !String(c.numeroOs || '').trim());
  const campoHoje = campoAtivos.filter(c => !!c.temEquipeDiaValida);
  const atrasos = calcularAtrasosDashboardIntegrado(chamados);
  const finalizadosMes = chamados.filter(c => {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    if (st !== 'Concluído' && st !== 'Serviço Realizado') return false;
    const d = parseDataDashboard(c.dataConclusaoOs || c.dataConclusao || c.dataHoraUltimaAcao || c.dataHora || c.data);
    return d && d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
  });

  const cards = [
    { titulo: 'Chamados novos', valor: porStatus['Em análise'] || 0, desc: 'Em análise sem interação', icon: 'bi-funnel', cor: 'var(--analise)', acao: "irDashboardPara('triagem','Em análise')" },
    { titulo: 'Aguardando visita', valor: porStatus['Aguardando visita'] || 0, desc: 'Na fila de visita', icon: 'bi-hourglass-split', cor: 'var(--visita)', acao: "irDashboardPara('fila','Aguardando visita')" },
    { titulo: 'Orçamentos pendentes', valor: porStatus['Solicitado Orçamento'] || 0, desc: 'Solicitados à empresa', icon: 'bi-cash-coin', cor: 'var(--orcamento)', acao: "irDashboardPara('empresa','Solicitado Orçamento','orcamentos')" },
    { titulo: 'Aprovações pendentes', valor: porStatus['Orçamento Realizado'] || 0, desc: 'Aguardando decisão', icon: 'bi-clipboard2-check', cor: 'var(--orcamento-realizado)', acao: "irDashboardPara('aprovacao','Orçamento Realizado')" },
    { titulo: 'OS emitidas', valor: osEmitidas.length, desc: osSemNumero.length + ' sem número', icon: 'bi-file-earmark-check', cor: 'var(--os)', acao: "irDashboardPara('empresa',null,'gerencial')" },
    { titulo: 'Campo hoje', valor: campoHoje.length + '/' + campoAtivos.length, desc: 'Com equipe registrada', icon: 'bi-geo-alt', cor: 'var(--servico-realizado)', acao: "loadPage('campo')" },
    { titulo: 'Radar de alertas', valor: atrasos.length, desc: 'SLA, prazo ou pendência', icon: 'bi-exclamation-triangle', cor: 'var(--emergencial)', acao: "loadPage('alertas')" },
    { titulo: 'Finalizados no mês', valor: finalizadosMes.length, desc: 'Produtividade mensal', icon: 'bi-check-circle', cor: 'var(--concluido)', acao: "loadPage('historico')" }
  ];

  resumo.innerHTML = cards.map(renderDashboardKpi).join('');
  renderDashboardStatusBars(chamados, porStatus);
  renderDashboardPendencias(chamados, atrasos, osSemNumero);
  renderDashboardRankingUnidades(chamados);
  renderDashboardProdutividade(finalizadosMes, chamados);
  if (painel) painel.innerHTML = '';
}

function renderDashboardKpi(card) {
  return '<button type="button" class="dashboard-kpi" style="--dash-color:' + card.cor + ';" onclick="' + card.acao + '">' +
    '<span class="dashboard-kpi-icon"><i class="bi ' + card.icon + '"></i></span>' +
    '<span class="dashboard-kpi-label">' + escapeHtml(card.titulo) + '</span>' +
    '<strong>' + escapeHtml(card.valor) + '</strong>' +
    '<small>' + escapeHtml(card.desc) + '</small>' +
  '</button>';
}

function contarPorStatusDashboard(chamados) {
  const cont = {};
  (chamados || []).forEach(c => {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    cont[st] = (cont[st] || 0) + 1;
  });
  return cont;
}

function renderDashboardStatusBars(chamados, porStatus) {
  const box = document.getElementById('dashboardStatusBars');
  if (!box) return;
  const ordem = ['Em análise','Aguardando visita','Solicitado Orçamento','Orçamento Realizado','OS emitida','Atendimento Emergencial','Garantia de Obra','Serviço Realizado','Concluído'];
  const total = Math.max(1, (chamados || []).length);
  const linhas = ordem.filter(st => (porStatus[st] || 0) > 0).map(st => {
    const valor = porStatus[st] || 0;
    const perc = Math.max(4, Math.round((valor / total) * 100));
    return '<div class="dashboard-bar-row" onclick="irDashboardStatus(\'' + escapeJsAttr(st) + '\')">' +
      '<div class="dashboard-bar-label"><span class="status-dot" style="background:' + getCorStatus(st) + ';"></span>' + escapeHtml(st) + '</div>' +
      '<div class="dashboard-bar-track"><span style="width:' + perc + '%; background:' + getCorStatus(st) + ';"></span></div>' +
      '<strong>' + valor + '</strong>' +
    '</div>';
  }).join('');
  box.innerHTML = linhas || '<div class="empty-state compact"><h5>Nenhum chamado para exibir.</h5></div>';
}

function renderDashboardPendencias(chamados, atrasos, osSemNumero) {
  const box = document.getElementById('dashboardPendencias');
  if (!box) return;
  const pendencias = [];
  (osSemNumero || []).slice(0, 4).forEach(c => pendencias.push({ tipo: 'OS sem número', item: c, cor: 'var(--orcamento)' }));
  (atrasos || []).slice(0, 6).forEach(c => pendencias.push({ tipo: c.motivoAtraso || 'Atraso operacional', item: c, cor: 'var(--emergencial)' }));

  if (!pendencias.length) {
    box.innerHTML = '<div class="empty-state compact"><h5>Nenhuma pendência crítica no momento.</h5><p>Os principais gargalos aparecerão aqui automaticamente.</p></div>';
    return;
  }

  box.innerHTML = pendencias.slice(0, 8).map(p => {
    const c = p.item;
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    return '<div class="dashboard-pendencia" style="--pend-color:' + p.cor + ';" onclick="abrirModalAnalise(\'' + escapeJsAttr(c.id) + '\')">' +
      '<div><strong>' + escapeHtml(p.tipo) + '</strong><span>#' + escapeHtml(c.id || '-') + ' · ' + escapeHtml(c.unidade || 'Unidade não informada') + '</span></div>' +
      '<em>' + escapeHtml(st) + '</em>' +
    '</div>';
  }).join('');
}

function renderDashboardRankingUnidades(chamados) {
  const box = document.getElementById('dashboardRankingUnidades');
  if (!box) return;
  const statusAtivos = ['Em análise','Aguardando visita','Solicitado Orçamento','Orçamento Realizado','OS emitida','Atendimento Emergencial','Garantia de Obra','Serviço Realizado'];
  const mapa = {};
  (chamados || []).forEach(c => {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    if (!statusAtivos.includes(st)) return;
    const unidade = String(c.unidade || 'Unidade não informada').trim();
    mapa[unidade] = (mapa[unidade] || 0) + 1;
  });
  const ranking = Object.keys(mapa).map(k => ({ unidade: k, total: mapa[k] })).sort((a,b) => b.total - a.total || a.unidade.localeCompare(b.unidade, 'pt-BR')).slice(0, 6);
  box.innerHTML = ranking.length ? ranking.map((r, idx) => '<div class="dashboard-rank-row"><span>' + (idx + 1) + '</span><strong>' + escapeHtml(r.unidade) + '</strong><em>' + r.total + '</em></div>').join('') : '<div class="empty-state compact"><h5>Sem ranking no momento.</h5></div>';
}

function renderDashboardProdutividade(finalizadosMes, chamados) {
  const box = document.getElementById('dashboardProdutividade');
  if (!box) return;
  const servRealizado = (chamados || []).filter(c => normalizarSituacaoSistema(c.situacao || c.status) === 'Serviço Realizado').length;
  const concluidos = (chamados || []).filter(c => normalizarSituacaoSistema(c.situacao || c.status) === 'Concluído').length;
  box.innerHTML = '<div class="dashboard-prod-main"><strong>' + finalizadosMes.length + '</strong><span>finalizados neste mês</span></div>' +
    '<div class="dashboard-prod-grid"><div><strong>' + servRealizado + '</strong><span>serviços realizados</span></div><div><strong>' + concluidos + '</strong><span>concluídos</span></div></div>';
}


function calcularAtrasosDashboardIntegrado(chamados) {
  if (typeof window.calcularAlertasSistema === 'function') {
    try {
      const alertas = window.calcularAlertasSistema() || [];
      return alertas.map(function(a) {
        const item = Object.assign({}, a.item || {});
        item.motivoAtraso = a.titulo || 'Alerta operacional';
        item.alertaSeveridade = a.severidade || 'media';
        item.alertaGrupo = a.grupo || '';
        item.alertaTipo = a.tipo || '';
        return item;
      }).filter(function(item) { return item && item.id; });
    } catch (erro) {
      console.warn('[GOM DASHBOARD] Falha ao usar radar de alertas; usando cálculo local.', erro);
    }
  }
  return calcularAtrasosDashboard(chamados);
}


function calcularAtrasosDashboard(chamados) {
  const hoje = inicioDiaDashboard(new Date());
  const campoStatus = ['OS emitida','Atendimento Emergencial','Garantia de Obra'];
  return (chamados || []).filter(c => {
    const st = normalizarSituacaoSistema(c.situacao || c.status);
    const previsao = parseDataDashboard(c.dataPrevistaConclusao || c.dataPrevistaConclusaoRaw);
    const ultima = parseDataDashboard(c.dataHoraUltimaAcao || c.dataHoraEncaminhamento || c.dataHora || c.data);

    if (campoStatus.includes(st) && !previsao) {
      c.motivoAtraso = 'Sem previsão de conclusão';
      return true;
    }
    if (previsao && inicioDiaDashboard(previsao).getTime() < hoje.getTime() && st !== 'Serviço Realizado' && st !== 'Concluído') {
      c.motivoAtraso = 'Previsão vencida';
      return true;
    }
    if (ultima) {
      const dias = Math.floor((hoje.getTime() - inicioDiaDashboard(ultima).getTime()) / 86400000);
      if (st === 'Em análise' && dias >= 3) { c.motivoAtraso = 'Em análise há muitos dias'; return true; }
      if (st === 'Aguardando visita' && dias >= 3) { c.motivoAtraso = 'Visita atrasada'; return true; }
      if (st === 'Solicitado Orçamento' && dias >= 5) { c.motivoAtraso = 'Orçamento sem retorno'; return true; }
      if (st === 'Orçamento Realizado' && dias >= 2) { c.motivoAtraso = 'Aprovação parada'; return true; }
      if (st === 'Serviço Realizado' && dias >= 2) { c.motivoAtraso = 'Aguardando finalização'; return true; }
    }
    return false;
  });
}

function parseDataDashboard(valor) {
  if (!valor) return null;
  if (valor instanceof Date && !isNaN(valor.getTime())) return valor;
  if (typeof valor === 'number' && !isNaN(valor)) return new Date(valor);
  const s = String(valor || '').trim();
  if (!s) return null;
  if (s.length >= 10 && s.charAt(4) === '-' && s.charAt(7) === '-') {
    const p = s.slice(0, 10).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  const br = parseDataHoraBR(s);
  if (br) return new Date(br);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function inicioDiaDashboard(data) {
  return new Date(data.getFullYear(), data.getMonth(), data.getDate());
}

function irDashboardPara(tela, filtro, modoEmpresa) {
  if (modoEmpresa) window.empresaModoAtual = modoEmpresa;
  loadPage(tela);
  setTimeout(function() {
    if (filtro) {
      window.statusFiltroClicado = filtro;
      if (typeof statusFiltroClicado !== 'undefined') statusFiltroClicado = filtro;
      if (typeof renderizarTela === 'function') renderizarTela();
    }
  }, 50);
}

function irDashboardStatus(status) {
  const st = normalizarSituacaoSistema(status);
  if (st === 'Em análise') return irDashboardPara('triagem', st);
  if (st === 'Aguardando visita') return irDashboardPara('fila', st);
  if (st === 'Solicitado Orçamento') return irDashboardPara('empresa', st, 'orcamentos');
  if (st === 'Orçamento Realizado') return irDashboardPara('aprovacao', st);
  if (['OS emitida','Atendimento Emergencial','Garantia de Obra','Serviço Realizado'].includes(st)) return irDashboardPara('empresa', null, 'gerencial');
  return loadPage('historico');
}

function refreshDashboard() {
  if (typeof refreshChamados === 'function') refreshChamados(function() { renderDashboard(); });
  else renderDashboard();
}

window.renderDashboard = renderDashboard;
window.refreshDashboard = refreshDashboard;
window.irDashboardPara = irDashboardPara;
window.irDashboardStatus = irDashboardStatus;

  <script>

// Tela aparece primeiro; os dados carregam em seguida no painel.
document.addEventListener('DOMContentLoaded', iniciarSistema);

function iniciarSistema() {
  try {
    carregarUsuarioPermissoes(function(usuario) {
      const paginaInicial = getPaginaInicialPermitida('dashboard');
      loadPage(paginaInicial, true);
      esconderLoader();
      carregarBasesIniciais();

      const deveCarregarChamados = ['dashboard','triagem','fila','aprovacao','empresa','campo','alertas','obras','historico','relatorios'].some(function(p) {
        return podeAcessarPagina(p);
      });

      if (deveCarregarChamados) {
        carregarChamados({
          renderizar: true,
          forcar: true,
          callback: () => {
            // Pré-carrega Obras em segundo plano, depois da primeira tela estar pronta.
            // Assim, ao clicar em OBRAS, a tela já abre praticamente instantânea.
            if (podeAcessarPagina('obras')) setTimeout(precarregarObrasEmSegundoPlano, 500);
          }
        });
      }
    });
  } catch (erro) {
    console.error('[GOM] Erro ao iniciar sistema:', erro);
    mostrarErro(erro?.message || erro);
  }
}

function esconderLoader() {
  const loader = document.getElementById('loader');
  if (loader) loader.classList.add('hidden');
}

function mostrarErro(msg) {
  esconderLoader();
  const painel = document.getElementById('painelDados') || document.getElementById('main-content');

function normalizarRespostaChamadosFrontend_(res) {
  ultimaRespostaChamadosRaw = res;

  // API V3 retorna JSON string para evitar problema de serialização do google.script.run.
  if (typeof res === 'string') {
    try {
      const payload = JSON.parse(res);
      if (Array.isArray(payload)) return payload;
      if (payload && Array.isArray(payload.chamados)) return payload.chamados;
      if (payload && Array.isArray(payload.lista)) return payload.lista;
      if (payload && Array.isArray(payload.dados)) return payload.dados;
      if (payload && payload.ok === false) {
        console.error('[GOM] Backend retornou erro:', payload.erro, payload);
        return [];
      }
      console.warn('[GOM] JSON de chamados sem array reconhecível:', payload);
      return [];
    } catch (e) {
      console.error('[GOM] Erro ao interpretar JSON de chamados:', e, res?.slice ? res.slice(0, 500) : res);
      return [];
    }
  }

  if (Array.isArray(res)) return res;
  if (!res || typeof res !== 'object') return [];
  if (Array.isArray(res.chamados)) return res.chamados;
  if (Array.isArray(res.lista)) return res.lista;
  if (Array.isArray(res.dados)) return res.dados;
  if (Array.isArray(res.ativos) || Array.isArray(res.concluidos)) {
    return [...(res.ativos || []), ...(res.concluidos || [])];
  }
  console.warn('[GOM] Resposta inesperada em chamados:', res);
  return [];
}

const ROTULOS_PAGINAS_GOM = {

        if (window.empresaModoAtual === 'gerencial') return txt.indexOf('gerencial') !== -1;
        if (window.empresaModoAtual === 'equipes') return txt.indexOf('equipe') !== -1;

  <script>
function renderizarTela() {
  if (telaAtual === 'dashboard') return (typeof renderDashboard === 'function' ? renderDashboard() : null);
  if (telaAtual === 'cadastro' || telaAtual === 'configuracoes') return;
  if (telaAtual === 'campo') return renderizarCampo();
  if (telaAtual === 'alertas') return (typeof renderizarAlertas === 'function' ? renderizarAlertas() : null);
  if (telaAtual === 'obras') return renderizarObras();

  const painel = document.getElementById('painelDados');
  if (!painel) return;

  if (!dadosCarregados) {
    painel.innerHTML = '<div class="empty-state"><div class="spinner-border text-primary"></div><p class="mt-3 fw-bold">Carregando chamados...</p></div>';
    return;
  }

  let listaTela = filtrarTelaChamados(listaChamadosGlobal);
  listaTela = ordenarChamados(listaTela);
  renderizarKPIsChamados(listaTela);

  const modoEmpresaAtual = window.empresaModoAtual || 'diario';
  const termo = (telaAtual === 'empresa' && (modoEmpresaAtual === 'gerencial' || modoEmpresaAtual === 'equipes')) ? '' : termoPesquisa();
  let listaRender = listaTela.filter(item => {
    const texto = normalizarTextoBase(`${item.id} ${item.unidade} ${item.detalhamento} ${item.situacao} ${item.status} ${item.observacoes} ${item.valorOrcamento} ${item.equipe} ${item.numeroOs} ${item.tipo}`);
    return texto.includes(termo) && (statusFiltroClicado ? normalizarSituacaoSistema(item.situacao || item.status) === statusFiltroClicado : true);
  });

  const contador = document.getElementById('contador');
  if (contador) {
    if (telaAtual === 'fila') contador.innerText = `${listaRender.length} na fila`;
    else if (telaAtual === 'aprovacao') contador.innerText = `${listaRender.length} orçamento${listaRender.length === 1 ? '' : 's'}`;
    else contador.innerText = `${listaRender.length} Resultados`;
  }

  if (telaAtual === 'empresa') {
    painel.innerHTML = (typeof renderEmpresaView === 'function'
      ? renderEmpresaView(listaRender)
      : (typeof renderEmpresaViewFallback === 'function' ? renderEmpresaViewFallback(listaRender) : '<div class="empty-state"><h5>Módulo Empresa não carregado.</h5></div>'));
    return;
  }

  if (telaAtual === 'aprovacao') {
    painel.innerHTML = renderAprovacaoView(listaRender, listaChamadosGlobal || []);
    return;
  }

  if (telaAtual === 'historico') {
    painel.innerHTML = renderMemorialView(listaTela);
    return;
  }

  if (!listaRender.length) {
    painel.innerHTML = '<div class="empty-state"><h5>Nenhum registro encontrado para os filtros atuais.</h5></div>';
    return;
  }

  if (telaAtual === 'fila') painel.innerHTML = listaRender.map((item, idx) => renderCardFila(item, idx)).join('');
  else painel.innerHTML = listaRender.map((item) => renderCardChamado(item)).join('');
}

function filtrarTelaChamados(lista) {
  const statusTriagemSet = new Set(STATUS_TRIAGEM);
  const statusFilaSet = new Set(STATUS_FILA);
  const statusAprovacaoSet = new Set(STATUS_APROVACAO);
  const statusMemorialSet = new Set(STATUS_MEMORIAL);

  const getStatusEmpresaPorModo = function() {
    const modo = window.empresaModoAtual || 'diario';
    if (modo === 'orcamentos') return window.STATUS_EMPRESA_ORCAMENTO || ['Solicitado Orçamento'];
    if (modo === 'gerencial') return window.STATUS_EMPRESA_GERENCIAL || ['OS emitida', 'Atendimento Emergencial', 'Garantia de Obra', 'Serviço Realizado'];
    if (modo === 'equipes') return [];
    return window.STATUS_EMPRESA_DIARIO || ['OS emitida', 'Atendimento Emergencial', 'Garantia de Obra'];
  };

  return (lista || []).filter(item => {
    const st = normalizarSituacaoSistema(item.situacao || item.status || item['Situação'] || item['Status']);
    item.situacao = st;
    if (telaAtual === 'fila') return statusFilaSet.has(st);
    if (telaAtual === 'empresa') {
      const modo = window.empresaModoAtual || 'diario';
      if (modo === 'equipes') return true;
      return new Set(getStatusEmpresaPorModo()).has(st);
    }
    if (telaAtual === 'aprovacao') return statusAprovacaoSet.has(st);
    if (telaAtual === 'historico') return statusMemorialSet.has(st);
    if (telaAtual === 'triagem') return statusTriagemSet.has(st);
    return true;
  });
}

function ordenarChamados(lista) {
  return [...(lista || [])].sort((a, b) => parseDataOrdenacao(a) - parseDataOrdenacao(b) || Number(a.id || 0) - Number(b.id || 0));
}

function renderizarKPIsChamados(listaTela) {
  const grid = document.getElementById('kpiGrid');
  if (!grid) return;

  const cont = {};
  (listaTela || []).forEach(i => {
    const st = normalizarSituacaoSistema(i.situacao || i.status);
    cont[st] = (cont[st] || 0) + 1;
  });

  let html = '';

  if (telaAtual === 'fila') {
    const hoje = new Date();
    const entradaHoje = (listaTela || []).filter(item => ehMesmoDia(parseDataOrdenacao(item), hoje)).length;
    const revisar = (listaTela || []).filter(item => deveRevisarFila(item)).length;
    html += montarKpiCard('Aguardando visita', 'Fila de visita', listaTela.length, 'var(--primary)', true, 'Chamados aguardando visita técnica ou registros legados de fila.', false);

  let statuses = [];
  let tituloTotal = 'Todos na tela';

  if (telaAtual === 'triagem') statuses = STATUS_TRIAGEM;

function aplicarFiltrosMemorial(lista) {
  const termo = termoPesquisa();
  const mes = document.getElementById('memorialMes') ? document.getElementById('memorialMes').value : '';
  const status = document.getElementById('memorialStatus') ? document.getElementById('memorialStatus').value : '';
  const tipo = document.getElementById('memorialTipo') ? document.getElementById('memorialTipo').value : '';

  return (lista || []).filter(function(item) {
    const st = normalizarSituacaoSistema(item.situacao || item.status);
    if (statusFiltroClicado && st !== statusFiltroClicado) return false;
    if (status && st !== status) return false;

    if (tipo && String(item.tipo || '') !== tipo) return false;

    if (mes) {
      const dt = getDataFechamentoMemorial(item) || getDataAberturaMemorial(item);
      if (!dt || getAnoMesMemorial(dt) !== mes) return false;
    }

    if (!termo) return true;
    const texto = normalizarTextoBase([
      item.id, item.unidade, item.detalhamento, item.situacao, item.status,
      item.numeroOs, item.tipo, item.equipe, item.valorOrcamento, item.observacoes,
      item.dataHora, item.data, item.dataHoraUltimaAcao, item.dataConclusaoOs, item.dataConclusao
    ].join(' '));
    return texto.includes(termo);
  });
}

}

function getDataAberturaMemorial(item) {
  return parseDataMemorial(item.dataHora || item.data || item.dataRaw || item.dataOrdenacao);
}

function getDataFechamentoMemorial(item) {
  return parseDataMemorial(item.dataConclusaoOs || item.dataConclusao || item.dataHoraUltimaAcao || item.dataHora || item.data);
}

function parseDataMemorial(valor) {
  if (!valor) return null;
  if (valor instanceof Date && !isNaN(valor.getTime())) return valor;
  if (typeof valor === 'number' && !isNaN(valor)) return new Date(valor);
  const s = String(valor || '').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const p = s.slice(0, 10).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  const ts = typeof parseDataHoraBR === 'function' ? parseDataHoraBR(s) : null;
  if (ts) return new Date(ts);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function formatarDataMemorial(data) {
  if (!data || isNaN(data.getTime())) return '-';
  return data.toLocaleDateString('pt-BR') + ' ' + String(data.getHours()).padStart(2, '0') + ':' + String(data.getMinutes()).padStart(2, '0');
}

function getAnoMesMemorial(data) {
  return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0');
}

function formatarMesLabelMemorial(valor) {
  const partes = String(valor || '').split('-');
  if (partes.length !== 2) return valor;
  const data = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
  return data.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}

function calcularTempoTotalMemorial(item) {
  const ini = getDataAberturaMemorial(item);
  const fim = getDataFechamentoMemorial(item);
  if (!ini || !fim || isNaN(ini.getTime()) || isNaN(fim.getTime())) return 'Sem dados';
  const dias = Math.max(0, Math.round((fim.getTime() - ini.getTime()) / 86400000));
  if (dias === 0) return 'Mesmo dia';
  if (dias === 1) return '1 dia';
  return dias + ' dias';
}

function calcularTempoMedioMemorial(lista) {
  const valores = (lista || []).map(function(item) {
    const ini = getDataAberturaMemorial(item);
    const fim = getDataFechamentoMemorial(item);
    if (!ini || !fim) return null;
    return Math.max(0, Math.round((fim.getTime() - ini.getTime()) / 86400000));
  }).filter(function(v) { return v !== null && !isNaN(v); });
  if (!valores.length) return '-';
  const media = Math.round(valores.reduce(function(a, b) { return a + b; }, 0) / valores.length);
  if (media === 0) return 'Mesmo dia';
  if (media === 1) return '1 dia';
  return media + ' dias';
}

function resumirTextoMemorial(valor, limite) {
  const texto = String(valor || '').replace(/\s+/g, ' ').trim();
  if (texto.length <= limite) return texto;
  return texto.slice(0, limite - 1).trim() + '…';
}

function exportarMemorialCsv(botao) {
  const lista = getListaMemorialExportacao();

  }

  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Gerando CSV...');

  const csv = linhas.map(function(l) { return l.map(csvEscapeMemorial).join(';'); }).join('\n');

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'memorial_atendimentos_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

function exportarMemorialXlsx(botao) {
  const lista = getListaMemorialExportacao();
  if (!lista.length) {
    alert('Não há registros para exportar.');
    return;
  }

  if (!google || !google.script || !google.script.run || typeof google.script.run.gomGerarMemorialXlsxV1Json !== 'function') {
    alert('A função de exportação XLSX ainda não está disponível no backend. Substitua também o arquivo Code.gs deste patch.');
    return;
  }

  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Gerando XLSX...');
  const linhas = montarLinhasMemorialExportacao(lista);

  google.script.run
    .withSuccessHandler(function(res) {
      const payload = typeof res === 'string' ? JSON.parse(res) : res;
      if (!payload || !payload.ok) {
        if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
        alert((payload && payload.erro) || 'Não foi possível gerar o XLSX.');
        return;
      }

      baixarBase64Memorial(payload.base64, payload.nome || ('memorial_atendimentos_' + new Date().toISOString().slice(0,10) + '.xlsx'), payload.mime || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (typeof gomMostrarSucessoBotao === 'function') gomMostrarSucessoBotao(botao, 'XLSX exportado');
    })
    .withFailureHandler(function(err) {

      if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível gerar o XLSX.');

function baixarBase64Memorial(base64, nome, mime) {
  const binario = atob(base64);
  const bytes = new Uint8Array(binario.length);
  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome || 'arquivo.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function csvEscapeMemorial(valor) {
  const s = String(valor == null ? '' : valor).replace(/"/g, '""').replace(/\r?\n/g, ' ');

}

function montarEventosProntuarioMemorial(item) {
  const eventos = [];

  function add(data, titulo, detalhe) {
    eventos.push({
      data: data || '-',
      titulo: titulo || '',
      detalhe: detalhe || ''
    });
  }

  add(item.dataHora || item.data, 'Chamado criado', item.origem || item.sistema || '');
  if (item.dataHoraEntradaFila || item.dataEntradaFila) add(item.dataHoraEntradaFila || item.dataEntradaFila, 'Entrada em atendimento/fila', '');
  if (item.dataHoraEncaminhamento) add(item.dataHoraEncaminhamento, 'Encaminhado', 'Encaminhamento para atendimento/empresa.');
  if (item.valorOrcamento) add(item.dataHoraUltimaAcao || item.dataHoraEncaminhamento || '', 'Orçamento registrado', item.valorOrcamento);
  if (item.dataPrevistaConclusao) add(item.dataPrevistaConclusao, 'Previsão de conclusão', '');
  if (item.dataConclusaoOs || item.dataConclusao) add(item.dataConclusaoOs || item.dataConclusao, 'Encerramento/conclusão', normalizarSituacaoSistema(item.situacao || item.status));

  const obs = String(item.observacoes || '').split(/\n+/).map(function(l) { return l.trim(); }).filter(Boolean);
  obs.slice(-12).forEach(function(linha) {
    const match = linha.match(/^\[([^\]]+)\]\s*(.*)$/);
    if (match) add(match[1], 'Observação registrada', match[2]);
    else add('', 'Observação registrada', linha);
  });

  return eventos;
}

function atualizarCamposAprovacao(select, id) {
  const decisao = select ? select.value : '';
  const numeroOs = document.getElementById('aprovNumeroOs_' + id);
  const previsao = document.getElementById('aprovPrevisao_' + id);
  const help = document.getElementById('aprovHelp_' + id);

  if (numeroOs) {
    const aprovar = decisao === 'aprovar';
    numeroOs.disabled = !aprovar;
    numeroOs.required = aprovar;
    if (!aprovar) numeroOs.value = '';
  }

  if (previsao) {
    previsao.disabled = decisao === 'ajuste' || decisao === 'negar' || decisao === 'devolver_escola';
  }

  if (help) {
    const mensagens = {
      aprovar: 'Ao aprovar, o número da OS é obrigatório. A previsão será usada para controle de prazo.',
      ajuste: 'O orçamento volta para a empresa como Solicitado Orçamento, com o parecer interno registrado.',
      negar: 'O chamado será encaminhado ao Memorial como A cargo da unidade escolar.',
      devolver_escola: 'O chamado será devolvido para a escola e ficará no Memorial.'
    };
    help.textContent = mensagens[decisao] || 'Escolha uma decisão para liberar os campos necessários.';
  }
}

function salvarDecisaoAprovacaoFront(e, id) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  const form = e.target;
  const payload = formToObject(form);
  payload.id = id;

  if (!payload.decisao) {
    alert('Selecione uma decisão.');
    return;
  }

  if (payload.decisao === 'aprovar' && !String(payload.numeroOs || '').trim()) {
    alert('Informe o número da OS para aprovar o orçamento.');
    const input = form.querySelector('[name="numeroOs"]');
    if (input) input.focus();
    return;
  }

  const botao = form.querySelector('button[type="submit"], .aprovacao-submit');
  if (typeof gomSetButtonLoading === 'function') gomSetButtonLoading(botao, 'Registrando decisão...');
  else if (botao) {
    botao.disabled = true;
    botao.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';
  }

  google.script.run
    .withSuccessHandler(function() {
      refreshChamados(function() {
        if (typeof renderizarTela === 'function') renderizarTela();
      });
    })
    .withFailureHandler(function(err) {
      if (typeof gomResetButtonLoading === 'function') gomResetButtonLoading(botao);
      else if (botao) {
        botao.disabled = false;
        botao.innerHTML = '<i class="bi bi-check2-square me-1"></i>Registrar decisão';
      }
      if (typeof gomMostrarErroAcao === 'function') gomMostrarErroAcao(err, 'Não foi possível registrar a decisão.');
      else alert((err && err.message) || err);
    })
    .salvarDecisaoAprovacao(payload);
}

  <script>

function gomFormatarInputDateModal_(valor) {
  if (valor === null || valor === undefined || valor === '') return '';

  if (valor instanceof Date && !isNaN(valor.getTime())) {
    return valor.getFullYear() + '-' + String(valor.getMonth() + 1).padStart(2, '0') + '-' + String(valor.getDate()).padStart(2, '0');
  }

  if (typeof valor === 'number' && !isNaN(valor)) {
    var dataNumero = new Date(valor);
    if (!isNaN(dataNumero.getTime())) {
      return dataNumero.getFullYear() + '-' + String(dataNumero.getMonth() + 1).padStart(2, '0') + '-' + String(dataNumero.getDate()).padStart(2, '0');
    }
  }

  var texto = String(valor || '').trim();
  if (!texto) return '';

  var iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];

  var br = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (br) {
    var ano = Number(br[3]);
    if (ano < 100) ano += 2000;
    return String(ano).padStart(4, '0') + '-' + String(Number(br[2])).padStart(2, '0') + '-' + String(Number(br[1])).padStart(2, '0');
  }

  var data = new Date(texto);
  if (!isNaN(data.getTime())) {
    return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0') + '-' + String(data.getDate()).padStart(2, '0');
  }

  return '';
}



function isFluxoAprovacaoModal_(chamado) {
